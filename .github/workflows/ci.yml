name: CI · Cerebro + Tests

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Integridad del kernel + suite de dominio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sin `cache: npm` A PROPÓSITO: el proyecto todavía no tiene ninguna
      # dependencia, así que no existe package-lock.json y la caché fallaría
      # con "Dependencies lock file is not found". Cuando entre la primera
      # dependencia se commitea el lock y se vuelve a activar la caché.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias (si las hubiera)
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # La bóveda ../brain-private NO existe en CI (es local y privada, ADR-059).
      # brain-check lo detecta y degrada: sigue validando los SHA-256 del kernel
      # local contra scripts/.kernel-version.json (el sello COMMITEADO), que es
      # justo la integridad que importa aquí — un kernel forkeado no pasa.
      - name: Cerebro — integridad del kernel y gates
        run: npm run brain:check

      - name: Tests del núcleo de cálculo
        run: npm test

      # El contrato es la única fuente de verdad de las dos mitades (ADR-004).
      # Si deja de compilar, frontend y backend han empezado a separarse.
      - name: Contrato — tipos coherentes
        run: npm run contrato:verificar

      - name: Frontend — compila
        run: npm run build

      # Guardia de ADR-004: el SDK del modelo solo puede vivir en la pasarela.
      # Es la pieza más barata del diseño y la que más dinero salva, porque a un
      # asistente le resulta natural importar el SDK en el archivo que tiene delante.
      - name: Guardia — llamadas al modelo solo desde la pasarela
        run: |
          FUERA=$(grep -rl "@anthropic-ai/sdk" --include="*.js" --include="*.ts" \
                    --exclude-dir=node_modules . 2>/dev/null \
                  | grep -v "funciones/ia/pasarela" || true)
          if [ -n "$FUERA" ]; then
            echo "::error::llamada al modelo fuera de la pasarela: prohibido (ADR-004)"
            echo "$FUERA"
            exit 1
          fi
          echo "✅ el SDK del modelo no se importa fuera de funciones/ia/pasarela"
