name: Vigía · atlas del Caribe

# ⚠️ EL ARCHIVO SE SIGUE LLAMANDO `vigia-nasa.yml` aunque el vigía ya no sea solo
# de NASA: desde el 2026-08-24 vigila también los RAYOS, que son de NOAA
# (`§ADR-079`). Renombrar el archivo cambiaría la dirección de las corridas
# antiguas y rompería los enlaces del historial; el nombre que se lee es el de
# arriba y ése sí dice la verdad.
#
# CADA 4 HORAS le pregunta a NASA si ya publicó más horas — de los CINCO atlas,
# que van a ritmos muy distintos: medido el 2026-08-24, el horario del sol y el
# de nubes iban 87 días por detrás, y temperatura, viento y lluvia 3. Si las hay,
# ABRE UNA PROPUESTA por atlas. No publica: propone.
#
# ⚠️ CADA 4 HORAS ES ORDEN DEL INGENIERO (2026-08-24, §ADR-075), y va con su
# advertencia escrita para que nadie la «arregle» sin saberla: **la fuente no se
# mueve seis veces al día**. NASA POWER publica el día D con 3-4 días de retraso
# —y el sol y las nubes con ~87—, así que de las seis miradas diarias, cinco van
# a encontrar exactamente lo mismo. No sobra: la mirada es barata (3 consultas
# por atlas, segundos) y a cambio el hueco entre que la fuente publica y nosotros
# nos enteramos baja de 7 días a 4 horas. Lo que NO baja es el retraso de la
# fuente. Esa distinción se publica ahora en la pantalla del atlas (§ADR-075):
# se ven las DOS fechas —cuándo se preguntó y hasta cuándo llega el dato— y de
# quién es el atraso.
#
# ⚠️ Y NO MULTIPLICA LAS PROPUESTAS. `create-pull-request` reutiliza la rama
# `vigia/nasa-power-<atlas>`: mientras la propuesta siga sin aprobar, las miradas
# siguientes la ACTUALIZAN en vez de abrir otra. Cinco propuestas abiertas como
# mucho, una por atlas, y eso ya pasaba en semanal.
#
# ⚠️ LOS DOS EN LA MISMA MATRIZ, y no un flujo por atlas: un segundo archivo casi
# igual es un segundo sitio donde arreglar cada fallo, y el que se olvida siempre
# es el segundo (`34 · L-65`).
#
# POR QUÉ PROPONE Y NO PUBLICA. Un robot que commitea y despliega una capa de
# datos sin nadie mirando es un robot que puede publicar una capa mala un domingo
# a las 3 de la mañana. Aquí llega un pull request que dice QUÉ CAMBIÓ —de qué
# fecha a qué fecha y cuántas horas nuevas— y lo aprueba una persona.
#
# NASA POWER no pide clave (verificado el 2026-08-21: HTTP 200 sin una sola
# cabecera de autorización), así que este flujo NO necesita ningún secreto.
#
# ✅ LOS DOS AJUSTES DEL REPOSITORIO YA ESTÁN HECHOS (2026-08-24, `§ADR-076`):
#    1. Actions → General → «Allow GitHub Actions to create and approve pull
#       requests» ENCENDIDO. Sin eso, el paso del PR moría con «GitHub Actions is
#       not permitted to create pull requests» y el vigía no servía de nada.
#    2. `main` PROTEGIDA exigiendo el check «Integridad del kernel + suite de
#       dominio», sin empuje forzado y sin borrado. Los administradores NO quedan
#       sujetos (`enforce_admins: false`): el trabajo diario empuja a `main`
#       directo por decisión del Ingeniero (`ADR-051`), y una protección que
#       rompe el trabajo diario es una protección que se acaba quitando entera.
#
# ⚠️ Y CON ELLO APARECE LA TRAMPA QUE HAY QUE CONOCER: un PR abierto con
# `GITHUB_TOKEN` **no dispara** `ci.yml` —GitHub lo impide para que un robot no
# se llame a sí mismo en bucle—, así que la propuesta llegaría SIN NINGÚN CHECK
# y, con `main` protegida, nacería imposible de fusionar. Por eso este flujo
# **firma el check él mismo** al final: ver el paso «el check de la propuesta».

on:
  schedule:
    # ⏰ DOS RELOJES, porque las fuentes no van al mismo paso (`§ADR-080`):
    #
    #    · CADA 4 HORAS para los cinco de POWER. Medido el 2026-08-25: su dato va
    #      con 4 días de retraso (temperatura, viento, lluvia) o con 87 (sol,
    #      nubes). Mirar más seguido no adelantaría un solo dato.
    #    · CADA HORA para los RAYOS. El satélite publica al minuto —comprobado:
    #      archivos de hace 3 minutos—, así que aquí el límite lo poníamos
    #      nosotros y no la fuente. Con esto, el atlas de rayos va como mucho una
    #      hora por detrás del cielo.
    #
    #    MINUTO 17 y no 0: GitHub avisa de que en la hora en punta, con carga
    #    alta, «some queued jobs may be dropped». Un vigía que pierde su cita no
    #    vigila nada, y en la punta se pierden más. El cron solo corre en la rama
    #    por defecto.
    #
    #    ⚠️ En las horas múltiplo de 4 disparan LOS DOS relojes: son dos
    #    corridas, y la del reloj horario encuentra el libro ya al día y termina
    #    en segundos. Es más barato que inventar una condición para evitarlo.
    - cron: '17 */4 * * *'
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Reconstruir aunque NASA no haya publicado nada nuevo'
        type: boolean
        default: false

# El mínimo para lo único que hace: empujar una rama, abrir el PR sobre ella y
# firmar en ese commit el resultado de la suite que ya corrió.
permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  # NO se auto-cancela: a mitad de las 36 consultas, cortar deja un archivo
  # a medias. Es la misma decisión que el flujo de despliegue.
  group: vigia-nasa
  cancel-in-progress: false

jobs:
  # ⚠️ UN SOLO TRABAJO POR ATLAS —mirar Y proponer—, y esto es un ARREGLO
  # (`§ADR-076`). Antes eran dos trabajos, `mirar` y `proponer`, y el segundo se
  # activaba con la salida `hay` del primero. **Las salidas de un trabajo con matriz
  # las machaca la última pata que termina**: con cinco atlas a ritmos distintos,
  # el «sí» del de temperatura y el «no» del solar se pisaban, y quien mandaba era
  # el azar del reloj. Lo vimos: la corrida del 24-08 reconstruyó los CINCO cuando
  # solo tres tenían dato nuevo. Con la mirada cada 4 horas, eso serían propuestas
  # que solo cambian el sello, seis veces al día — y un buzón así se deja de leer.
  #
  # Juntos, **cada atlas decide por sí mismo** y no hay salida que compartir. La
  # mirada sigue siendo lo barato de arriba: si no hay horas nuevas, la pata
  # termina en segundos sin reconstruir nada.
  vigilar:
    name: ¿Publicó NASA más horas?
    # El reloj horario es SOLO para los rayos: POWER no se mueve en una hora.
    if: github.event.schedule != '17 * * * *'
    runs-on: ubuntu-latest
    strategy:
      # ⚠️ `fail-fast: false` y no el defecto: si el atlas solar falla, los otros
      # cuatro tienen que llegar igual. Son cinco productos, no cinco pasos.
      fail-fast: false
      matrix:
        include:
          - clave: sol
            prefijo: sol-caribe
            param: ALLSKY_SFC_SW_DWN
            nombre: solar
            herramienta: sol-caribe.mjs
            avisoEsperado: 'MEDIA|media'
          - clave: temperatura
            prefijo: temp-caribe
            param: T2M
            nombre: de temperatura
            herramienta: temp-caribe.mjs
            avisoEsperado: '2 m|IEEE 738'
          - clave: viento
            prefijo: viento-caribe
            param: WS10M
            nombre: de viento
            herramienta: viento-caribe.mjs
            avisoEsperado: 'NO VALIDA|EXTREMO DE DISEÑO'
          - clave: lluvia
            prefijo: lluvia-caribe
            param: PRECTOTCORR
            nombre: de lluvia
            herramienta: lluvia-caribe.mjs
            avisoEsperado: 'celda de 111 km|cada hora'
          - clave: nubes
            prefijo: nubes-caribe
            param: CLOUD_AMT
            nombre: de nubosidad
            herramienta: nubes-caribe.mjs
            avisoEsperado: 'tormenta eléctrica|fracción de cielo'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Es la pieza más barata del diseño: TRES consultas para saber si hay que
      # hacer las treinta y seis. El bimestre en que NASA no publicó nada cuesta
      # tres segundos en vez de un minuto.
      - name: Comparar lo publicado con lo nuestro
        id: comparar
        run: |
          set -euo pipefail
          FICHA="./web/public/mapas/${{ matrix.prefijo }}.json"
          NUESTRO=$(node -p "require('$FICHA').ultimoDiaConHoras")
          echo "· atlas ${{ matrix.nombre }}: lo nuestro llega al $NUESTRO"

          HOY=$(date -u +%Y%m%d)
          ANIO=$(node -p "require('$FICHA').anio")
          # Tres celdas repartidas del recuadro. Si NASA publicó más horas, lo
          # habrá hecho para todas; preguntar por tres es la muestra suficiente
          # y detecta además una publicación DESIGUAL, que sería una anomalía.
          ULTIMO=""
          for P in "-75.5 10.5" "-72.5 11.5" "-76.5 8.5"; do
            set -- $P
            U=$(curl -sS --retry 3 --retry-delay 5 --max-time 90 \
              "https://power.larc.nasa.gov/api/temporal/hourly/point?parameters=${{ matrix.param }}&community=RE&longitude=$1&latitude=$2&start=${ANIO}0101&end=${HOY}&format=JSON&time-standard=LST" \
              | node -e "
                let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                  const j=JSON.parse(s);
                  const p=j?.properties?.parameter?.['${{ matrix.param }}'];
                  if(!p){console.error('sin el parámetro esperado');process.exit(1);}
                  const v=Object.entries(p).filter(([,x])=>x>-900);
                  if(!v.length){console.error('sin una sola hora con dato');process.exit(1);}
                  const k=v[v.length-1][0];
                  process.stdout.write(k.slice(0,4)+'-'+k.slice(4,6)+'-'+k.slice(6,8));
                });")
            echo "  celda $1,$2 → $U"
            [ -z "$ULTIMO" ] && ULTIMO="$U"
            if [ "$U" != "$ULTIMO" ]; then
              echo "::warning::NASA publicó DESIGUAL entre celdas ($ULTIMO vs $U). Se toma la menor."
              [ "$U" \< "$ULTIMO" ] && ULTIMO="$U"
            fi
          done

          # ⚠️ Y EL TOTAL DEL DÍA TAMBIÉN CUENTA (`§ADR-080`). Hasta el 2026-08-25
          # esta comparación miraba SOLO la frontera horaria, y en el atlas solar
          # esa frontera lleva clavada en mayo desde hace meses: aunque el resumen
          # diario avanzara cada día, no disparaba nada. Resultado medido: la
          # energía del día publicada iba un día por detrás de la fuente, y nadie
          # se enteraba porque no hay error que dar. Un dato que envejece solo es
          # peor que uno que falta: el que falta se ve.
          NUESTRO_DIA=$(node -p "require('$FICHA').ultimoDiaConTotal ?? ''")
          ULTIMO_DIA=$(curl -sS --retry 3 --retry-delay 5 --max-time 90 \
            "https://power.larc.nasa.gov/api/temporal/daily/point?parameters=${{ matrix.param }}&community=RE&longitude=-75.5&latitude=10.5&start=${ANIO}0101&end=${HOY}&format=JSON" \
            | node -e "
              let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                const p=JSON.parse(s)?.properties?.parameter?.['${{ matrix.param }}']??{};
                const v=Object.entries(p).filter(([,x])=>x>-900);
                const k=v.length?v[v.length-1][0]:'';
                process.stdout.write(k?k.slice(0,4)+'-'+k.slice(4,6)+'-'+k.slice(6,8):'');
              });" || echo "")
          echo "· el total del día: nuestro $NUESTRO_DIA · NASA $ULTIMO_DIA"

          echo "nuestro=$NUESTRO" >> "$GITHUB_OUTPUT"
          echo "publicado=$ULTIMO" >> "$GITHUB_OUTPUT"
          echo "nuestroDia=$NUESTRO_DIA" >> "$GITHUB_OUTPUT"
          echo "publicadoDia=$ULTIMO_DIA" >> "$GITHUB_OUTPUT"

          # ⚠️ Y EL TÍTULO DICE POR QUÉ NACE ESTA PROPUESTA (`§ADR-084`). Se
          # escribe AQUÍ, donde se sabe el motivo, y no en la plantilla de abajo:
          # el 25-08 se abrió una propuesta titulada «NASA publicó hasta
          # 2026-05-30» con una tabla que decía 2026-05-30 ANTES y 2026-05-30
          # AHORA. Era cierta y era ilegible — el disparo había sido el total del
          # día, que el título no nombraba. Un buzón cuyas propuestas no explican
          # qué cambió es un buzón que se deja de leer, y un atlas que nadie
          # fusiona se queda viejo aunque el vigía funcione perfecto.
          if [ "${{ inputs.forzar }}" = "true" ]; then
            echo "::notice::Reconstrucción FORZADA a mano."
            echo "hay=si" >> "$GITHUB_OUTPUT"
            echo "porque=forzado" >> "$GITHUB_OUTPUT"
            echo "titulo=Atlas ${{ matrix.nombre }}: reconstrucción forzada a mano" >> "$GITHUB_OUTPUT"
          elif [ "$ULTIMO" \> "$NUESTRO" ]; then
            echo "::notice::NASA llega al $ULTIMO y nosotros al $NUESTRO — hay horas nuevas."
            echo "hay=si" >> "$GITHUB_OUTPUT"
            echo "porque=horas" >> "$GITHUB_OUTPUT"
            echo "titulo=Atlas ${{ matrix.nombre }}: horas nuevas, hasta el $ULTIMO (antes $NUESTRO)" >> "$GITHUB_OUTPUT"
          elif [ -n "$ULTIMO_DIA" ] && [ "$ULTIMO_DIA" \> "$NUESTRO_DIA" ]; then
            echo "::notice::Sin horas nuevas, pero el TOTAL DEL DÍA avanzó: $NUESTRO_DIA → $ULTIMO_DIA."
            echo "hay=si" >> "$GITHUB_OUTPUT"
            echo "porque=dia" >> "$GITHUB_OUTPUT"
            echo "titulo=Atlas ${{ matrix.nombre }}: el total del día llega al $ULTIMO_DIA (antes $NUESTRO_DIA)" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::NASA sigue en $ULTIMO, igual que nosotros. Nada que hacer."
            echo "hay=no" >> "$GITHUB_OUTPUT"
          fi

      # ── DE AQUÍ ABAJO, SOLO SI ESTE ATLAS TIENE HORAS NUEVAS ──────────────
      - name: Reconstruir el atlas
        if: steps.comparar.outputs.hay == 'si'
        run: node herramientas/${{ matrix.herramienta }}

      # ⚠️ LOS GUARDIANES VAN ANTES DE PROPONER NADA, y bloquean. Sin esto, la
      # forma de romper esto no es un error rojo: es una capa que se vacía sola,
      # un PR que parece normal y un mapa en blanco que nadie relaciona con esto.
      - name: Que la reconstrucción no haya EMPEORADO el archivo
        if: steps.comparar.outputs.hay == 'si'
        run: |
          set -euo pipefail
          node -e "
            const prefijo = '${{ matrix.prefijo }}';
            const nuevo = require('./web/public/mapas/' + prefijo + '.json');
            const { execSync } = require('node:child_process');
            const viejo = JSON.parse(execSync('git show HEAD:web/public/mapas/' + prefijo + '.json').toString());
            const fallos = [];
            const horasDe = (f) => f.meses.reduce((s, m) => s + m.horasConDato, 0);
            if (horasDe(nuevo) < horasDe(viejo))
              fallos.push(\`el archivo nuevo tiene MENOS horas (\${horasDe(nuevo)}) que el que ya estaba (\${horasDe(viejo)})\`);
            if (nuevo.ultimoDiaConHoras < viejo.ultimoDiaConHoras)
              fallos.push(\`la última hora RETROCEDIÓ: \${viejo.ultimoDiaConHoras} → \${nuevo.ultimoDiaConHoras}\`);
            if (nuevo.meses.length < viejo.meses.length)
              fallos.push(\`se publican menos meses: \${viejo.meses.length} → \${nuevo.meses.length}\`);
            if (!nuevo.atribucion?.includes('NASA')) fallos.push('la ficha perdió la atribución de NASA');
            if (!nuevo.aviso?.match(/${{ matrix.avisoEsperado }}/)) fallos.push('la ficha perdió su aviso: lo que el dato NO es');
            if (nuevo.medido && (nuevo.medido.min < nuevo.rampa[0].c || nuevo.medido.max > nuevo.rampa[nuevo.rampa.length-1].c))
              fallos.push('lo medido se sale de la rampa: el extremo se publicaría aplanado');
            if (nuevo.bbox.join() !== viejo.bbox.join()) fallos.push('el recuadro cambió de tamaño');
            if (nuevo.ancho !== viejo.ancho || nuevo.alto !== viejo.alto) fallos.push('la malla cambió de tamaño');
            if (fallos.length) {
              for (const f of fallos) console.error('::error::' + f);
              console.error('No se propone nada. El archivo anterior sigue publicado.');
              process.exit(1);
            }
            console.log('✅ el archivo nuevo no empeora al anterior');
          "

      - name: Suite completa
        if: steps.comparar.outputs.hay == 'si'
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm test
          npm run contrato:verificar

      - name: Abrir la propuesta
        if: steps.comparar.outputs.hay == 'si'
        id: propuesta
        uses: peter-evans/create-pull-request@v6
        with:
          branch: vigia/nasa-power-${{ matrix.clave }}
          title: '${{ steps.comparar.outputs.titulo }}'
          commit-message: |
            ${{ steps.comparar.outputs.titulo }}

            Reconstruido por el vigía. Motivo: ${{ steps.comparar.outputs.porque }}.
          body: |
            El vigía preguntó a NASA POWER y **algo se movió**. Las DOS fronteras,
            para que se vea cuál: el atlas se pinta hora a hora, pero el resumen
            del día tiene su propia frontera y a veces avanza sola.

            | Frontera | Lo que teníamos | Lo que NASA tiene ahora |
            |---|---|---|
            | Por horas | `${{ steps.comparar.outputs.nuestro }}` | `${{ steps.comparar.outputs.publicado }}` |
            | Total del día | `${{ steps.comparar.outputs.nuestroDia }}` | `${{ steps.comparar.outputs.publicadoDia }}` |

            **Lo que disparó esta propuesta: `${{ steps.comparar.outputs.porque }}`.**

            Se reconstruyó el atlas y **pasó los guardianes**: ni retrocede la
            última hora, ni pierde meses, ni cambia el recuadro o la malla, ni se
            queda sin atribución, ni sin su aviso de lo que el dato NO es, ni se
            le sale lo medido de la rampa. La suite completa está en verde.

            **Antes de aprobar, mira el mapa**: fusiona, espera al despliegue y
            abre el atlas ${{ matrix.nombre }} —desde la cabecera o desde
            «Detalle GPS»—. Verde en las pruebas no prueba que se vea
            (`docs/99 §ADR-021`).
          labels: dato, atlas-solar

      # ── EL CHECK DE LA PROPUESTA (`§ADR-076`) ─────────────────────────────
      #
      # POR QUÉ EXISTE. `main` exige el check «Integridad del kernel + suite de
      # dominio» para poder fusionar, y ese check lo produce `ci.yml`… que NO se
      # dispara en un PR abierto con `GITHUB_TOKEN`. Sin este paso, cada propuesta
      # del vigía nacería imposible de fusionar y el Ingeniero tendría que
      # saltarse la protección a mano — es decir, tenerla para nada.
      #
      # QUÉ FIRMA, EXACTAMENTE: lo que este mismo trabajo acaba de ejecutar sobre
      # ESTE contenido, unos pasos más arriba y en este orden — los guardianes de
      # «no empeora», `npm test` y `contrato:verificar`. Si algo de eso falla, el
      # trabajo muere antes y **la propuesta ni llega a abrirse**, así que este
      # sello no puede existir en otro color que el verde.
      #
      # ⚠️ SE LLAMA IGUAL QUE EL CHECK DEL CI A PROPÓSITO, y no para disimular: es
      # la MISMA suite sobre el MISMO contenido, y la protección de rama compara
      # por NOMBRE. Para que nadie lo confunda con una corrida del CI, el sello
      # dice quién lo firmó y su enlace lleva a ESTA ejecución del vigía.
      - name: El check de la propuesta (la suite ya corrió arriba)
        if: steps.comparar.outputs.hay == 'si' && steps.propuesta.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "/repos/${{ github.repository }}/statuses/${{ steps.propuesta.outputs.pull-request-head-sha }}" \
            -f state=success \
            -f context='Integridad del kernel + suite de dominio' \
            -f description='suite completa, ejecutada por el vigía antes de proponer' \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::notice::Check firmado sobre ${{ steps.propuesta.outputs.pull-request-head-sha }}"

  # ══════════════════════════════════════════════════════════════════════════
  # LOS RAYOS — otro trabajo, porque es OTRA FUENTE y otra forma de crecer
  # ══════════════════════════════════════════════════════════════════════════
  #
  # No cabe en la matriz de arriba y meterlo a la fuerza habría sido peor que
  # tenerlo aparte: los cinco atlas de POWER se RECONSTRUYEN enteros en cada
  # pasada —su fuente entrega un año en 36 llamadas—, y éste se **ACUMULA**,
  # porque su año son 1,6 millones de archivos y medio terabyte (`99 §ADR-079`).
  # Comparten lo que de verdad se comparte: el motor que empaqueta y escribe la
  # ficha, los guardianes, la suite y la forma de proponer.
  #
  # ⚠️ CON TOPE POR PASADA (`--maximo`). Si la propuesta se queda sin aprobar una
  # semana, la corrida siguiente tendría 168 horas pendientes: 9 GB y más de dos
  # horas. Con tope se pone al día solo, un trozo cada vez, y ninguna pasada se
  # sale de madre.
  rayos:
    name: ¿Cayeron rayos nuevos?
    runs-on: ubuntu-latest
    # ⚠️ ESTE TRABAJO LLEVA LAS TRES CAPAS DE SATÉLITE —rayos, «Sol ahora» y
    # «Nubes ahora»—, y no una por trabajo (`§ADR-081`). Las tres bajan del mismo
    # cubo, se acumulan en un libro y proponen igual: repartirlas en tres
    # trabajos casi idénticos sería tener tres sitios donde arreglar el mismo
    # fallo, y el que se olvida siempre es el tercero (`34 · L-65`). Van en el
    # mismo commit porque son la misma pasada del mismo satélite.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar (el lector de los archivos del satélite)
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # Ventana de 24 h y como mucho 12 horas nuevas por pasada. Con el vigía
      # mirando cada 4 h, 12 sobran para no dejar hueco jamás.
      - name: Bajar los rayos que falten
        run: node herramientas/rayos-caribe.mjs --horas 24 --maximo 12

      # ⚠️ EL SOL Y LAS NUBES «AHORA» VAN CON TOPE MÁS CORTO, y por peso: una
      # hora de nubes son 54 MB y una de sol, 243 — contra los 71 de una hora de
      # rayos. Con 3 horas por pasada y el reloj horario, se ponen al día solas
      # sin que ninguna corrida se acerque a los límites del runner.
      - name: Bajar el sol y las nubes que falten
        run: |
          node herramientas/abi-caribe.mjs --capa nubes-vivo --horas 12 --maximo 3
          node herramientas/abi-caribe.mjs --capa sol-vivo --horas 12 --maximo 3

      # ⚠️ EL LIBRO SOLO CRECE. Es el mismo criterio que «no empeora» de los
      # otros cinco, adaptado a una capa que acumula: una pasada no puede
      # devolver el atlas a menos horas de las que ya tenía, ni retroceder el
      # último día. Si eso pasa, algo se rompió al leer el satélite y lo que hay
      # publicado es mejor que lo nuevo.
      - name: Que NINGÚN libro haya ENCOGIDO
        id: crecio
        run: |
          set -euo pipefail
          node -e "
            const { execSync } = require('node:child_process');
            const LIBROS = ['rayos-conteo', 'sol-vivo-caribe-libro', 'nubes-vivo-caribe-libro'];
            let nuevas = 0;
            for (const nombre of LIBROS) {
              const ruta = './herramientas/' + nombre + '.json';
              let nuevo = { horas: {} }, viejo = { horas: {} };
              try { nuevo = require(ruta); } catch { continue; }
              try { viejo = JSON.parse(execSync('git show HEAD:herramientas/' + nombre + '.json').toString()); } catch {}
              const n = Object.keys(nuevo.horas).length, v = Object.keys(viejo.horas).length;
              if (n < v) { console.error('::error::' + nombre + ' perdió horas: ' + v + ' → ' + n); process.exit(1); }
              for (const k of Object.keys(viejo.horas)) {
                if (!nuevo.horas[k]) { console.error('::error::' + nombre + ': desapareció la hora ' + k); process.exit(1); }
              }
              console.log(nombre + ': ' + n + ' horas (+' + (n - v) + ')');
              nuevas += n - v;
            }
            require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'nuevas=' + nuevas + '\n');
          "

      - name: Suite completa
        if: steps.crecio.outputs.nuevas != '0'
        run: |
          npm test
          npm run contrato:verificar

      - name: Abrir la propuesta
        id: propuesta
        if: steps.crecio.outputs.nuevas != '0'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: vigia/satelite-caribe
          title: 'Atlas de satélite: ${{ steps.crecio.outputs.nuevas }} hora(s) nuevas'
          commit-message: |
            Atlas de satélite: ${{ steps.crecio.outputs.nuevas }} hora(s) nuevas

            Rayos, sol y nubes contados por el GOES-19 y sumados a sus libros.
            Estas capas se acumulan: no se reconstruyen.
          body: |
            El vigía bajó **${{ steps.crecio.outputs.nuevas }} hora(s)** del satélite —rayos, sol
            y nubes— y las sumó a sus libros, de donde salen los PNG.

            Pasó el guardián de que **ningún libro encoge** —ni pierde horas ni retrocede— y la
            suite completa está en verde.

            **Antes de aprobar, mira el mapa**: fusiona, espera al despliegue y abre las capas.
            Verde en las pruebas no prueba que se vea (`docs/99 §ADR-021`).
          labels: dato, atlas-solar

      - name: El check de la propuesta (la suite ya corrió arriba)
        if: steps.propuesta.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "/repos/${{ github.repository }}/statuses/${{ steps.propuesta.outputs.pull-request-head-sha }}" \
            -f state=success \
            -f context='Integridad del kernel + suite de dominio' \
            -f description='suite completa, ejecutada por el vigía antes de proponer' \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
