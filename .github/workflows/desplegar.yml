name: Desplegar · Cloudflare Pages

# EL ÚNICO SITIO DONDE SE PUBLICA. Lo llaman los demás flujos con `uses:`; no se
# dispara solo por eventos.
#
# ⚠️ POR QUÉ DEJÓ DE DISPARARSE SOLO (`§ADR-137`). Antes colgaba de
# `workflow_run` sobre el CI. **Ese eslabón nunca funcionó**: medido el 22-09,
# 390 corridas verdes del CI en `main` y CERO despliegues; el flujo había corrido
# UNA vez en su vida, a mano, el 24-08. Descartadas una a una las causas
# documentadas —el flujo activo, el fichero en la rama por defecto, el nombre
# idéntico byte a byte— la causa de fondo quedó SIN DETERMINAR. Por eso ya no se
# depende de ella: quien quiera publicar, llama.
#
# ⚠️ Y LA SEGUNDA RAZÓN, que es la que de verdad importa aquí: el vigía fusiona
# con la llave del propio flujo, y GitHub **no despierta ningún evento** con esa
# llave (anti-recursión; el propio `vigia-nasa.yml` lo explica en su cabecera).
# O sea que ningún disparador por evento habría publicado nunca el atlas del
# vigía. `workflow_call` no pasa por el sistema de eventos: por eso funciona.
#
# QUIÉN LO LLAMA:
#   · `ci.yml` → tras pasar la suite, y solo en un empuje a `main` de una persona
#   · `vigia-nasa.yml` → tras fusionar un atlas nuevo
#   · a mano (`workflow_dispatch`), solo sobre `main`
#
# ⚠️ REQUIERE DOS SECRETOS DEL REPOSITORIO. Mientras no existan **no publica y lo
# DICE en el resumen de la corrida** (antes solo dejaba una nota que nadie abre:
# un verde que no publicaba, que es justo lo que esta casa llama mentir —
# `32 · L-65`). El despliegue se sigue haciendo a mano con
# `npm run deploy --workspace web`, que sí pasa por su portero (`35 · L-77/L-93`).
#   CLOUDFLARE_API_TOKEN   — panel de Cloudflare → My Profile → API Tokens →
#                            Create Token. Permiso mínimo: «Account · Cloudflare
#                            Pages · Edit».
#   CLOUDFLARE_ACCOUNT_ID  — el identificador de la cuenta; sale en el panel y
#                            también con `npx wrangler whoami`.
#
# ⚠️ LOS SECRETOS LOS PONE EL INGENIERO, no Claude: una credencial que pasa por
# un chat es una credencial que hay que rotar. `gh secret set NOMBRE` los pide
# por teclado sin mostrarlos.
on:
  workflow_call:
    inputs:
      ref:
        description: >-
          Qué publicar. Vacío (lo normal) = EL COMMIT EXACTO que aprobó la suite,
          no «lo último que haya en main»: entre la aprobación y el despliegue
          cabe otro empuje, y publicarlo sería publicar algo que nadie comprobó.
          El vigía es la excepción y pasa `main` a propósito, porque acaba de
          fusionar ahí y lo que debe publicarse es esa punta.
        type: string
        required: false
        default: ''
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desplegar-produccion
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar en producción
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A mano, SOLO sobre main. Sin esto, el desplegable de GitHub ofrece
    # cualquier rama que lleve el fichero —incluidas las muertas de agosto— y
    # publicarlas sería publicar el sitio de entonces.
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    steps:
      # ⚠️ ANCLADO AL COMMIT, no a «lo último que haya en main». Quien llama ya
      # pasó la suite sobre `github.sha`; sin fijarlo, entre la aprobación y el
      # despliegue cabe otro empuje y se publicaría algo que nadie comprobó.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: ¿Hay credenciales?
        id: cred
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUENTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Los secretos entran por VARIABLE, no interpolados dentro del guion:
          # así su valor nunca forma parte del texto que ejecuta el shell.
          if [ -n "$TOKEN" ] && [ -n "$CUENTA" ]; then
            echo "listo=si" >> "$GITHUB_OUTPUT"
          else
            echo "listo=no" >> "$GITHUB_OUTPUT"
            {
              echo "## 🚫 NO SE PUBLICÓ"
              echo ""
              echo "Faltan los secretos de Cloudflare, así que **esta corrida no ha cambiado la página**."
              echo "Sale en verde porque no hay nada roto, pero producción sigue como estaba."
              echo ""
              echo "Para encenderlo (lo hace el Ingeniero, nunca por el chat):"
              echo ""
              echo '```'
              echo "gh secret set CLOUDFLARE_API_TOKEN    # permiso: Account · Cloudflare Pages · Edit"
              echo "gh secret set CLOUDFLARE_ACCOUNT_ID   # sale con: npx wrangler whoami"
              echo '```'
              echo ""
              echo "Mientras tanto se publica a mano: \`npm run deploy --workspace web\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=No se publicó::Faltan los secretos de Cloudflare. La página NO ha cambiado."
          fi

      - name: Setup Node.js
        if: steps.cred.outputs.listo == 'si'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar y construir
        if: steps.cred.outputs.listo == 'si'
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build

      # ── LA HUELLA DE ESTE DESPLIEGUE ──────────────────────────────────────
      #
      # El paquete de JavaScript lleva su hash en el nombre, así que cambia
      # cuando cambia el CÓDIGO… y NO cambia cuando lo único que cambia es el
      # DATO. Aquí el 90 % de los despliegues son de dato: el atlas del vigía.
      # Comprobar solo el nombre del paquete daba verde sin probar nada justo en
      # el caso más frecuente. Esto pone un fichero que cambia SIEMPRE.
      - name: Sellar la construcción
        if: steps.cred.outputs.listo == 'si'
        run: |
          node -e "require('fs').writeFileSync('web/dist/version.json', JSON.stringify({
            commit: process.env.GITHUB_SHA,
            corrida: process.env.GITHUB_RUN_ID,
            construido: new Date().toISOString()
          }, null, 2) + '\n')"
          cat web/dist/version.json

      - name: Publicar
        if: steps.cred.outputs.listo == 'si'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=mantenimiento-lineas-at --branch=main

      # ── ¿LLEGÓ DE VERDAD? ─────────────────────────────────────────────────
      #
      # No basta con que `wrangler` diga «Deployment complete»: la lección de
      # esta casa es justo ésa —**verde en Actions no es cambio en producción**
      # (`32 · L-65`)—, y ya pasó que un arreglo se diera por hecho durante días
      # sin estar publicado. Se pide la página REAL, con anti-caché, y se compara
      # la huella recién sellada.
      #
      # ⚠️ Cloudflare tarda unos segundos en propagar: diez intentos con quince
      # segundos de espera son dos minutos y medio de margen. Si en ese tiempo no
      # llegó, es que no llegó.
      - name: Comprobar que producción sirve lo que se construyó
        if: steps.cred.outputs.listo == 'si'
        run: |
          set -euo pipefail
          SITIO="https://mantenimiento-lineas-at.pages.dev"
          ESPERADO=$(node -p "require('./web/dist/version.json').corrida")
          echo "· huella construida: corrida $ESPERADO ($GITHUB_SHA)"
          for i in $(seq 1 10); do
            SERVIDO=$(curl -sS --max-time 30 "$SITIO/version.json?cb=$(date +%s)-$i" \
                      | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).corrida)}catch{console.log('')}})" || true)
            echo "  intento $i → ${SERVIDO:-(sin respuesta)}"
            if [ "$SERVIDO" = "$ESPERADO" ]; then
              echo "::notice::Producción sirve la corrida $SERVIDO — es lo que se acaba de construir."
              echo "✅ Producción sirve el commit \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Producción sirve «${SERVIDO:-nada}» y se construyó «$ESPERADO». El despliegue dijo que sí y la página dice que no (32 · L-65)."
          exit 1
