# ============================================================================
# usuarios — configuración del trabajador administrativo de personas
# ----------------------------------------------------------------------------
# ⚠️ AQUÍ NO HAY NI UN SECRETO, Y NO PUEDE HABERLO: este repositorio es PÚBLICO.
# El identificador del proyecto y el origen permitido son públicos por diseño; la
# seguridad viene de que la firma del token se verifica contra las llaves de
# Google y de que la llave de administración es un SECRETO de Cloudflare que
# nunca toca el repositorio.
#
# LOS TRES SECRETOS, DECLARADOS POR NOMBRE Y SOLO POR NOMBRE. Se ponen desde la
# Mac del Ingeniero, una vez cada uno, y NO aparecen en este archivo ni como
# `[vars]`: lo que se escribe aquí se publica con el repositorio.
#
#     npx wrangler secret put CUENTA_DE_SERVICIO < /ruta/en/la/boveda/llave.json
#     npx wrangler secret put PROPIETARIO_UID     # el uid que enseña la consola
#     npx wrangler secret put LIMPIEZA_TOKEN      # de UN SOLO USO, y se borra después
#
# | Secreto              | Qué gobierna              | Si FALTA                  |
# |----------------------|---------------------------|---------------------------|
# | `CUENTA_DE_SERVICIO` | todo lo que toca a Google | **todo** responde 503     |
# | `PROPIETARIO_UID`    | quién puede arrancar y    | `/bootstrap` y            |
# |                      | a quién no toca la app    | `/limpieza-inicial`: 503  |
# | `LIMPIEZA_TOKEN`     | arma el borrado inicial   | `POST /limpieza-inicial`: |
# |                      |                           | 503 (no se borra nada)    |
#
# ⚠️ `PROPIETARIO_UID` va de SECRETO y no de variable a propósito. No es que el
# uid sea confidencial —la consola lo enseña— es que una variable de este archivo
# la cambia quien pueda abrir un `pull request`, y quien cambia ese valor se
# corona propietario en el siguiente `/bootstrap`. Como secreto, cambiarlo exige
# la sesión de `wrangler` del Ingeniero. Y como no se puede releer, `GET /estado`
# dice si está PUESTO sin decir cuál es.
#
# Los tres FALLAN CERRADO: la ausencia apaga lo que gobiernan en vez de abrirlo.
# Una seguridad que depende de que una variable esté puesta no es seguridad.
# ============================================================================
name = "lineas-at-usuarios"
main = "src/index.js"
compatibility_date = "2026-07-01"

# `nodejs_compat` NO hace falta: todo lo que se usa —WebCrypto, fetch, atob/btoa,
# URL— es API estándar del entorno de trabajadores. Menos superficie, menos peso.
workers_dev = true

[vars]
# El proyecto de Firebase que se administra. La cuenta de servicio TIENE que ser
# de este mismo proyecto: si no, el trabajador se apaga (administrar la base de
# otro no es un error tipográfico inofensivo).
PROYECTO_FIREBASE = "mantenimiento-lineas-at"

# Origen que se devuelve en la cabecera CORS.
#
# ⚠️ NO es un control de acceso. CORS impide que OTRA página LEA la respuesta; no
# impide pedirla, y no impide nada fuera de un navegador — un `curl` con un token
# válido pasa igual. Lo único que decide quién entra es la firma del token, el
# reclamo `orgId` y la jerarquía de roles (§ADR-013, hallazgo 19).
ORIGEN_PERMITIDO = "https://mantenimiento-lineas-at.pages.dev"

# La organización dueña del dato. Una sesión válida de otra empresa no pasa, y si
# esta variable falta el trabajador se APAGA en vez de abrirse (503).
#
# ⚠️ El veredicto del comité la llama `ORG_ID` al describir `/bootstrap`. Es LA
# MISMA, y se queda con UN solo nombre: el que ya estaba. Dos variables con el
# mismo valor son dos que se pueden desincronizar, y el día que difieran nadie
# sabría cuál manda —quién entra la decidiría una y qué organización se estampa
# en los reclamos del propietario, la otra—. Aquí `config/arranque.orgId` y el
# `orgId` de todos los reclamos salen de esta línea.
ORG_PERMITIDA = "transpower"

# App Check. Hoy este trabajador NO sabe comprobarlo, así que la variable va en
# `false` y ponerla en `true` APAGA el servicio en vez de simular que lo exige.
# Es deliberado: una promesa que el código no cumple es la falta que más veces ha
# aparecido en este proyecto. Cuando se implemente, esto pasa a `true`.
APP_CHECK_EXIGIDO = "false"

# ⚠️ EL CORTE DE REVOCACIÓN (`99 §ADR-100`): todo token emitido ANTES de esta marca
# se rechaza. Vacía = sin corte. Se pone en la limpieza inicial, aquí y en el
# portero de fotos a la vez. Una marca ilegible APAGA el trabajador (503).
REVOCADOS_ANTES_DE = "2026-09-07T00:20:16Z"
