# ============================================================================
# evidencias — configuración del portero de las fotos
# ----------------------------------------------------------------------------
# Ninguno de estos valores es secreto: el identificador del proyecto de Firebase
# y el origen permitido son públicos por diseño. La seguridad NO viene de
# esconderlos, viene de que la firma del token se verifica contra las llaves de
# Google y de que el depósito jamás se expone directamente.
# ============================================================================
name = "lineas-at-evidencias"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Sin observabilidad de pago ni reintentos: este trabajador o responde o falla,
# y si falla la galería lo dice en pantalla.
workers_dev = true

[vars]
PROYECTO_FIREBASE = "mantenimiento-lineas-at"
# Origen que se devuelve en la cabecera CORS.
#
# ⚠️ NO es un control de acceso, y antes este renglón decía que lo era («solo la
# aplicación publicada puede pedir evidencias desde el navegador»). CORS impide
# que OTRA página LEA la respuesta; no impide pedirla, y no impide absolutamente
# nada fuera de un navegador — un `curl` con un token válido pasa igual. Lo
# único que decide quién entra es la firma del token y el reclamo `orgId`
# (§ADR-013, hallazgo 19).
ORIGEN_PERMITIDO = "https://mantenimiento-lineas-at.pages.dev"
# La organización dueña del dato. Una sesión válida de otra empresa no pasa, y
# si esta variable falta el portero se APAGA en vez de abrirse (503).
ORG_PERMITIDA = "transpower"

# ⚠️ EL CORTE DE REVOCACIÓN (`99 §ADR-100`). Todo token emitido ANTES de esta marca
# se rechaza. Vacía = sin corte. Se pone (fecha ISO o segundos) en el momento de
# la limpieza inicial, en ESTE trabajador y en el de personas a la vez, y así la
# revocación es inmediata en las dos puertas en vez de «en una hora». Una marca
# que no se entiende APAGA el portero (503), no se ignora.
#
# ⚠️ Y VA AQUÍ DENTRO, EN `[vars]`, NO AL FINAL DEL ARCHIVO. En TOML una clave
# pertenece a la ÚLTIMA tabla declarada encima: escrita después de
# `[[r2_buckets]]` se convertía en un campo del depósito, wrangler la descartaba
# con un aviso («Unexpected fields found in r2_buckets[0]») y el portero se
# desplegaba SIN corte. Se creía puesta y no lo estaba, que es justo el fallo del
# que avisa el párrafo de arriba. Medido con `wrangler deploy --dry-run`: antes
# no salía en la lista de Vars; ahora sí.
REVOCADOS_ANTES_DE = "2026-09-07T00:20:16Z"

# El depósito se enlaza por binding.
#
# ⚠️ Un `[[r2_buckets]]` NO tiene modo de solo lectura: el binding expone el
# `R2Bucket` completo, con `put`, `delete` y `list`. Que este trabajador solo
# llame a `.get()` es una COSTUMBRE del código, no un permiso de la plataforma,
# y antes estaba escrito aquí como si fuera lo segundo. Si algún día hace falta
# que sea un permiso de verdad: versionado de objetos en el depósito, o servirlo
# por la API S3 con una llave de alcance solo-lectura (§ADR-013, hallazgo 19).
#
# Lo que sí es cierto: el depósito nunca queda accesible desde internet por su
# cuenta — nace privado y no se publica.
[[r2_buckets]]
binding = "EVIDENCIAS"
bucket_name = "lineas-at-evidencias"
