<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Líneas AT — Expediente navegable</title>
<style>
/* ============================================================================
   TOKENS — la identidad del módulo de campo LN-627, llevada a macOS oscuro.
   No se sustituye la paleta: se conserva (#0f1419 lienzo, #171d24 panel, ámbar
   #f0a500, rótulos de 11,5 px en mayúsculas, cifras tabulares) y se le añade lo
   que hace que un Mac parezca un Mac.
   ========================================================================= */
:root {
  color-scheme: dark;

  --lienzo:      #0f1419;
  --lienzo-hond: #0b0f13;
  --pnl:         #171d24;
  --pnl2:        #1e262f;
  --pnl-alto: linear-gradient(180deg, #1a212a 0%, var(--pnl) 62%);

  --sidebar-fondo:  rgba(19, 25, 32, .62);
  --indice-fondo:   rgba(15, 20, 25, .55);
  --barra-fondo:    rgba(22, 28, 35, .72);
  --flotante-fondo: rgba(30, 38, 47, .86);
  --vibrante: saturate(180%) blur(30px);

  --bd:        rgba(255,255,255,.075);
  --bd-suave:  rgba(255,255,255,.05);
  --bd-fuerte: rgba(255,255,255,.13);
  --bd-solido: #2b353f;
  --hairline:  .5px;

  --tx:    #e6edf3;
  --tx2:   #c6d3de;
  --mut:   #8b98a5;
  --tenue: #6f7d8a;

  --acc:       #f0a500;
  --acc-tx:    #1a1200;
  --acc-suave: rgba(240,165,0,.14);
  --acc-borde: rgba(240,165,0,.32);
  --acc-tinte: #2a2113;
  --anillo-foco: 0 0 0 3px rgba(240,165,0,.32);

  --sel-fondo:    var(--acc-suave);
  --sel-tx:       var(--acc);
  --sel-inactiva: rgba(255,255,255,.06);

  --gr: #7fc96a;  --rd: #e05252;  --az: #5b8dd9;
  --t-verde: #16240f;  --t-rojo: #2a1616;  --t-azul: #12202c;  --b-azul: #24455e;
  --hueco: var(--tenue);

  --fuente:      -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --fuente-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --t-base:   13px;
  --t-prosa:  12.6px;
  --t-fino:   11.4px;
  --t-rotulo: 11.5px;
  --t-micro:  10px;
  --t-tabla:  11.8px;
  --t-matriz: 9.8px;
  --t-cifra:  21px;
  --ls-rotulo: 1px;
  --ls-micro:  .7px;
  --lh: 1.5;
  --num: tabular-nums;

  --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 10px; --r-pastilla: 999px;

  --luz-arriba: inset 0 1px 0 rgba(255,255,255,.045);
  --sombra-1: 0 1px 2px rgba(0,0,0,.35);
  --sombra-2: 0 6px 20px -6px rgba(0,0,0,.55);
  --sombra-flotante: 0 14px 40px -10px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.4);

  --sidebar-ancho: 262px;
  --indice-ancho:  222px;
  --barra-alto:    38px;
  --salto-alto:    27px;
  --fila-lista:    28px;
  --pad-celda: 5px 8px;
  --gap: 8px;
  --medida-prosa: 82ch;

  --curva: cubic-bezier(.2,.7,.3,1);
  --rapido: .12s;
  --medio:  .18s;
}

@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  :root { --sidebar-fondo:#131920; --indice-fondo:#10161c; --barra-fondo:#161c23; --flotante-fondo:#1e262f; }
}
@media (prefers-reduced-transparency: reduce) {
  :root { --sidebar-fondo:#131920; --indice-fondo:#10161c; --barra-fondo:#161c23; --flotante-fondo:#1e262f; --vibrante: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 400 var(--t-base)/var(--lh) var(--fuente);
  background: var(--lienzo); color: var(--tx);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
}
button { font-family: inherit; }
:focus-visible { outline: none; box-shadow: var(--anillo-foco); border-radius: var(--r-sm); }

/* Barras de desplazamiento de macOS: finas, sin pista, solo cuando hacen falta */
.doc::-webkit-scrollbar, .sidebar::-webkit-scrollbar, .indice::-webkit-scrollbar,
.tabla-caja::-webkit-scrollbar, .matriz-caja::-webkit-scrollbar { width: 9px; height: 9px; }
.doc::-webkit-scrollbar-track, .sidebar::-webkit-scrollbar-track, .indice::-webkit-scrollbar-track,
.tabla-caja::-webkit-scrollbar-track, .matriz-caja::-webkit-scrollbar-track { background: transparent; }
.doc::-webkit-scrollbar-thumb, .sidebar::-webkit-scrollbar-thumb, .indice::-webkit-scrollbar-thumb,
.tabla-caja::-webkit-scrollbar-thumb, .matriz-caja::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,.16); border-radius: 5px; border: 2px solid transparent; background-clip: content-box;
}
.doc:hover::-webkit-scrollbar-thumb, .sidebar:hover::-webkit-scrollbar-thumb { background: rgba(255,255,255,.26); background-clip: content-box; }

/* ══ Ventana ═══════════════════════════════════════════════════════════════ */
.ventana { display: grid; grid-template-rows: var(--barra-alto) 1fr; height: 100%; }

.barra {
  position: relative; z-index: 40;
  display: flex; align-items: center; gap: 10px; padding: 0 11px;
  background: var(--barra-fondo);
  -webkit-backdrop-filter: var(--vibrante); backdrop-filter: var(--vibrante);
  border-bottom: var(--hairline) solid var(--bd);
  box-shadow: 0 1px 0 rgba(0,0,0,.28);
}
.semaforos { display: flex; gap: 8px; align-items: center; padding-right: 4px; }
.semaforos i { width: 11px; height: 11px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.28); }
.semaforos i:nth-child(1) { background: #e05a52; }
.semaforos i:nth-child(2) { background: #dfa72a; }
.semaforos i:nth-child(3) { background: #4fb04f; }

.barra-boton {
  appearance: none; background: none; border: 0; cursor: pointer;
  width: 26px; height: 22px; border-radius: var(--r-sm);
  display: grid; place-items: center; color: var(--mut);
  transition: background var(--rapido) var(--curva), color var(--rapido) var(--curva);
}
.barra-boton:hover { background: rgba(255,255,255,.07); color: var(--tx); }
.barra-boton.activo { color: var(--acc); }
.barra-boton svg { width: 15px; height: 15px; }

.barra-centro {
  position: absolute; left: 50%; top: 0; transform: translateX(-50%);
  height: 100%; display: flex; align-items: center; gap: 8px; pointer-events: none;
}
.barra-titulo { font-size: 13px; font-weight: 600; letter-spacing: .1px; color: var(--tx); }
.barra-titulo span { color: var(--mut); font-weight: 400; }
.pastilla-maqueta {
  font-size: 9.4px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase;
  color: var(--mut); border: var(--hairline) solid var(--bd-fuerte);
  border-radius: var(--r-pastilla); padding: 2px 7px;
}
.barra-der { margin-left: auto; display: flex; align-items: center; gap: 3px; }
.barra-sello { font-size: var(--t-fino); color: var(--tenue); font-variant-numeric: var(--num); margin-right: 6px; white-space: nowrap; }
.barra-sello b { color: var(--mut); font-weight: 500; }

.cuerpo {
  display: grid;
  grid-template-columns: var(--sidebar-ancho) var(--indice-ancho) minmax(0, 1fr);
  min-height: 0; overflow: hidden;
  transition: grid-template-columns var(--medio) var(--curva);
}
.cuerpo.sin-sidebar { grid-template-columns: 0px var(--indice-ancho) minmax(0, 1fr); }
.cuerpo.sin-indice  { grid-template-columns: var(--sidebar-ancho) 0px minmax(0, 1fr); }
.cuerpo.sin-sidebar.sin-indice { grid-template-columns: 0px 0px minmax(0, 1fr); }

/* ══ Barra lateral de líneas ═══════════════════════════════════════════════ */
.sidebar {
  overflow-y: auto; overflow-x: hidden; min-width: 0;
  background: var(--sidebar-fondo);
  -webkit-backdrop-filter: var(--vibrante); backdrop-filter: var(--vibrante);
  border-right: var(--hairline) solid var(--bd);
  padding: 8px 0 20px;
}
.buscar { padding: 2px 10px 8px; }
.buscar input {
  width: 100%; appearance: none; font: 400 12px/1.3 var(--fuente);
  color: var(--tx); background: rgba(0,0,0,.24);
  border: var(--hairline) solid var(--bd); border-radius: var(--r-sm);
  padding: 5px 8px 5px 24px;
}
.buscar { position: relative; }
.buscar svg { position: absolute; left: 18px; top: 8px; width: 12px; height: 12px; color: var(--tenue); pointer-events: none; }
.buscar input::placeholder { color: var(--tenue); }
.buscar input:focus { outline: none; border-color: var(--acc-borde); box-shadow: var(--anillo-foco); }

.segmentado { display: flex; margin: 0 10px 10px; background: rgba(0,0,0,.24); border-radius: var(--r-sm); padding: 2px; gap: 2px; }
.segmentado button {
  flex: 1; appearance: none; border: 0; background: none; cursor: pointer;
  font: 500 10.6px/1 var(--fuente); color: var(--mut); padding: 4px 0; border-radius: 4px;
  letter-spacing: .2px;
}
.segmentado button.activo { background: rgba(255,255,255,.09); color: var(--tx); box-shadow: 0 1px 1px rgba(0,0,0,.3); }

.grupo-rotulo {
  display: flex; align-items: center; gap: 6px;
  padding: 12px 12px 4px; font-size: var(--t-micro); font-weight: 700;
  text-transform: uppercase; letter-spacing: var(--ls-rotulo); color: var(--tenue);
}
.grupo-rotulo .cuenta { margin-left: auto; font-weight: 500; letter-spacing: 0; font-variant-numeric: var(--num); }
.grupo-rotulo .pt { width: 6px; height: 6px; border-radius: 50%; }

.fila-linea {
  display: flex; align-items: center; gap: 8px; width: calc(100% - 12px);
  margin: 0 6px; height: var(--fila-lista); padding: 0 8px;
  appearance: none; background: none; border: 0; cursor: pointer;
  border-radius: var(--r-md); color: var(--tx2); text-align: left;
  font: 400 12.2px/1 var(--fuente);
  transition: background var(--rapido) var(--curva), color var(--rapido) var(--curva);
}
.fila-linea:hover { background: rgba(255,255,255,.045); }
.fila-linea .pt { flex: none; width: 7px; height: 7px; border-radius: 50%; }
.fila-linea .cod { font-variant-numeric: var(--num); letter-spacing: .1px; }
.fila-linea .meta { margin-left: auto; font-size: 10.4px; color: var(--tenue); font-variant-numeric: var(--num); }
.fila-linea.sel { background: var(--sel-fondo); color: var(--sel-tx); box-shadow: inset 2px 0 0 var(--acc); font-weight: 600; }
.fila-linea.sel .meta { color: var(--acc); opacity: .8; }
.fila-linea.oculta { display: none; }

.pt.critico { background: var(--rd); }
.pt.atender { background: var(--acc); }
.pt.sin     { background: var(--az); }
.pt.bien    { background: var(--gr); }

.sidebar-pie {
  margin: 16px 12px 0; padding-top: 10px; border-top: var(--hairline) solid var(--bd);
  font-size: 10.4px; line-height: 1.55; color: var(--tenue);
}
.sidebar-pie b { color: var(--mut); font-weight: 600; }

/* ══ Índice del documento ══════════════════════════════════════════════════ */
.indice {
  overflow-y: auto; overflow-x: hidden; min-width: 0;
  background: var(--indice-fondo);
  -webkit-backdrop-filter: var(--vibrante); backdrop-filter: var(--vibrante);
  border-right: var(--hairline) solid var(--bd);
  padding: 10px 0 24px;
}
.indice-cab { padding: 2px 12px 8px; }
.indice-cab .rot { font-size: var(--t-micro); text-transform: uppercase; letter-spacing: var(--ls-rotulo); color: var(--tenue); font-weight: 700; }
.indice-cab .nom { font-size: 12.4px; font-weight: 600; color: var(--tx); margin-top: 2px; font-variant-numeric: var(--num); }
.indice-cab .est { font-size: 10.4px; color: var(--mut); margin-top: 1px; }

.idx {
  display: grid; grid-template-columns: 17px 1fr auto; align-items: baseline; gap: 7px;
  width: calc(100% - 12px); margin: 0 6px; padding: 4px 8px;
  appearance: none; background: none; border: 0; cursor: pointer; border-radius: var(--r-md);
  color: var(--mut); text-align: left; font: 400 11.8px/1.35 var(--fuente);
  transition: background var(--rapido) var(--curva), color var(--rapido) var(--curva);
}
.idx:hover { background: rgba(255,255,255,.045); color: var(--tx2); }
.idx > span:nth-child(2) {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; min-width: 0;
}
.idx .n { font-variant-numeric: var(--num); font-size: 10.6px; color: var(--tenue); text-align: right; }
.idx .pg { font-size: 9.6px; color: var(--tenue); font-variant-numeric: var(--num); }
.idx.act { background: var(--sel-fondo); color: var(--sel-tx); font-weight: 600; box-shadow: inset 2px 0 0 var(--acc); }
.idx.act .n, .idx.act .pg { color: var(--acc); opacity: .82; }
.idx.hijo { grid-template-columns: 17px 1fr; font-size: 11.2px; padding-left: 26px; width: calc(100% - 32px); margin-left: 26px; }
.idx.hijo .n { font-size: 10px; }
.idx.marca-hueco::after { content: ''; }
.idx .aviso-pt { display: inline-block; width: 5px; height: 5px; border-radius: 50%; margin-left: 5px; vertical-align: 1px; }

/* ══ Panel del documento ═══════════════════════════════════════════════════ */
.doc-pane { display: grid; grid-template-rows: var(--salto-alto) 1fr; min-width: 0; min-height: 0; }

.salto {
  display: flex; align-items: center; gap: 8px; padding: 0 14px;
  background: var(--barra-fondo);
  -webkit-backdrop-filter: var(--vibrante); backdrop-filter: var(--vibrante);
  border-bottom: var(--hairline) solid var(--bd);
  font-size: var(--t-fino); color: var(--mut); z-index: 20;
}
.salto .miga { display: flex; align-items: center; gap: 6px; min-width: 0; }
.salto .miga b { color: var(--tx2); font-weight: 600; }
.salto .sep { color: var(--tenue); }
.salto .nav { margin-left: auto; display: flex; gap: 2px; }
.salto .nav button {
  appearance: none; background: none; border: 0; cursor: pointer; color: var(--mut);
  width: 21px; height: 19px; border-radius: 4px; display: grid; place-items: center;
}
.salto .nav button:hover { background: rgba(255,255,255,.07); color: var(--tx); }
.salto .nav svg { width: 11px; height: 11px; }
.salto .prog { font-variant-numeric: var(--num); color: var(--tenue); font-size: 10.4px; margin-left: 8px; }

.doc { overflow-y: auto; overflow-x: hidden; padding: 0 0 28vh; }
.hoja { max-width: 1120px; margin: 0 auto; padding: 0 34px; }

/* ── El documento: aquí manda la lectura ───────────────────────────────── */
.doc p, .doc li { font-size: var(--t-prosa); line-height: 1.62; color: var(--tx2); }
.doc p { margin: 9px 0 0; max-width: var(--medida-prosa); }
.doc b, .doc strong { color: var(--tx); font-weight: 600; }
.doc em { font-style: normal; color: var(--acc); }
.num, .cifra, .tabla, .kpi-v, .mono { font-variant-numeric: var(--num); }
.mono { font-family: var(--fuente-mono); font-size: 11.4px; }

.seccion { padding: 26px 0 6px; scroll-margin-top: 8px; }
.sec-cab {
  display: grid; grid-template-columns: 34px 1fr auto; align-items: baseline; gap: 10px;
  padding-bottom: 8px; border-bottom: var(--hairline) solid var(--bd-fuerte);
}
.sec-num { font: 600 19px/1 var(--fuente); color: var(--acc); font-variant-numeric: var(--num); text-align: right; }
.sec-cab h2 { margin: 0; font-size: 17.5px; font-weight: 600; letter-spacing: -.15px; color: var(--tx); }
.sec-cab .pg { font-size: var(--t-micro); color: var(--tenue); text-transform: uppercase; letter-spacing: var(--ls-micro); }
.sec-lead { margin: 10px 0 0 44px !important; color: var(--mut) !important; font-size: 12.2px !important; }
.sec-cuerpo { padding-left: 44px; }

h3.sub {
  margin: 22px 0 0; font-size: var(--t-rotulo); font-weight: 700; color: var(--mut);
  text-transform: uppercase; letter-spacing: var(--ls-rotulo);
  padding-bottom: 5px; border-bottom: var(--hairline) solid var(--bd);
}
h3.sub .n { color: var(--acc); margin-right: 6px; font-variant-numeric: var(--num); }
h4.sub2 { margin: 16px 0 0; font-size: 12.6px; font-weight: 600; color: var(--tx); }

.corte-pagina {
  display: flex; align-items: center; gap: 12px; margin: 34px 0 0;
  font-size: 9.6px; letter-spacing: var(--ls-micro); text-transform: uppercase; color: var(--tenue);
  font-variant-numeric: var(--num);
}
.corte-pagina::before, .corte-pagina::after { content: ''; flex: 1; height: var(--hairline); background: var(--bd); }

/* ── Portada ──────────────────────────────────────────────────────────── */
.portada { padding: 34px 0 4px; }
.portada .rot { font-size: var(--t-micro); text-transform: uppercase; letter-spacing: 1.4px; color: var(--mut); font-weight: 700; }
.portada h1 { margin: 6px 0 0; font-size: 33px; font-weight: 600; letter-spacing: -.6px; font-variant-numeric: var(--num); }
.portada h1 small { font-size: 15px; font-weight: 400; color: var(--mut); letter-spacing: 0; margin-left: 10px; }
.portada .desc { margin: 6px 0 0; font-size: 13px; color: var(--tx2); max-width: var(--medida-prosa); }

.veredicto {
  display: flex; gap: 14px; align-items: flex-start; margin: 18px 0 0; padding: 14px 16px;
  border-radius: var(--r-lg); border: var(--hairline) solid #6b2b2b;
  background: linear-gradient(135deg, #2a1616 0%, #241a14 100%);
  box-shadow: var(--luz-arriba), var(--sombra-1);
}
.veredicto.ok { border-color: #33502c; background: linear-gradient(135deg, var(--t-verde) 0%, #141f14 100%); }
.veredicto-icono {
  flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  background: #d64545; color: #fff; font-size: 17px; font-weight: 700;
  box-shadow: 0 0 0 4px rgba(214,69,69,.16);
}
.veredicto.ok .veredicto-icono { background: #4e9b3c; box-shadow: 0 0 0 4px rgba(127,201,106,.16); }
.veredicto-t { font-size: 15px; font-weight: 600; color: #fff; }
.veredicto-c { margin: 4px 0 0 !important; font-size: 12.4px !important; color: #e8c9c9 !important; max-width: 92ch !important; }
.veredicto.ok .veredicto-c { color: #cfe8c2 !important; }
.veredicto-c b { color: #fff !important; }

.banda-estado { display: grid; grid-template-columns: repeat(auto-fit, minmax(218px, 1fr)); gap: 8px; margin: 12px 0 0; }
.estado-ficha {
  display: flex; align-items: flex-start; gap: 10px;
  background: var(--pnl-alto); border: var(--hairline) solid var(--bd);
  border-radius: var(--r-lg); padding: 10px 12px;
  box-shadow: var(--luz-arriba), var(--sombra-1);
}
.estado-punto { flex: none; margin-top: 4px; width: 9px; height: 9px; border-radius: 50%; background: var(--mut); box-shadow: 0 0 0 3px rgba(139,152,165,.14); }
.estado-ficha.bien .estado-punto { background: var(--gr); box-shadow: 0 0 0 3px rgba(127,201,106,.16); }
.estado-ficha.atender .estado-punto { background: var(--acc); box-shadow: 0 0 0 3px rgba(240,165,0,.18); }
.estado-ficha.critico .estado-punto { background: var(--rd); box-shadow: 0 0 0 3px rgba(224,82,82,.2); }
.estado-ficha.critico { border-color: rgba(224,82,82,.28); }
.estado-t { display: block; font-size: 9.6px; text-transform: uppercase; letter-spacing: var(--ls-micro); color: var(--mut); }
.estado-v { display: block; font-size: 12.6px; font-weight: 600; color: var(--tx); margin-top: 2px; line-height: 1.38; }
.estado-ficha.critico .estado-v { color: #ff9c9c; }
.estado-ficha.atender .estado-v { color: var(--acc); }
.estado-ficha.bien .estado-v { color: #bfe6b0; }
.estado-s { display: block; font-size: 10.6px; color: var(--tenue); margin-top: 3px; line-height: 1.45; }

.identidad { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0 26px; margin: 16px 0 0; }
.identidad dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 0 14px; }
.identidad dt, .identidad dd {
  font-size: 11.8px; padding: 4px 0; border-bottom: var(--hairline) solid var(--bd-suave);
}
.identidad dt { color: var(--mut); white-space: nowrap; }
.identidad dd { margin: 0; color: var(--tx); text-align: right; font-variant-numeric: var(--num); }

/* ── Indicadores ──────────────────────────────────────────────────────── */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 8px; margin-top: 11px; }
.kpis.k6 { grid-template-columns: repeat(6, 1fr); }
.kpis.k5 { grid-template-columns: repeat(5, 1fr); }
.kpis.k4 { grid-template-columns: repeat(4, 1fr); }
.kpi {
  background: linear-gradient(180deg, #16283a 0%, var(--t-azul) 70%);
  border: var(--hairline) solid var(--b-azul); border-radius: var(--r-lg); padding: 9px 11px;
  box-shadow: var(--luz-arriba), var(--sombra-1); min-width: 0;
}
.kpi-v { font-size: var(--t-cifra); font-weight: 600; color: var(--acc); line-height: 1.14; letter-spacing: -.3px; }
.kpi-v small { font-size: 12px; font-weight: 500; color: var(--mut); letter-spacing: 0; }
.kpi-v.rojo { color: #f08585; } .kpi-v.verde { color: #a3dd8f; } .kpi-v.azul { color: #86aae3; }
.kpi-v.hueco { color: var(--hueco); font-weight: 400; }
.kpi-l { margin-top: 2px; font-size: var(--t-micro); color: var(--mut); text-transform: uppercase; letter-spacing: var(--ls-micro); }
.kpi-s { margin-top: 4px; font-size: 10.6px; color: var(--tenue); line-height: 1.45; }

/* ── Paneles, avisos y sellos ─────────────────────────────────────────── */
.panel {
  margin: 12px 0 0; padding: 12px 14px 14px;
  background: var(--pnl-alto); border: var(--hairline) solid var(--bd); border-radius: var(--r-lg);
  box-shadow: var(--luz-arriba), var(--sombra-1);
}
.panel > h4 { margin: 0 0 6px; font-size: var(--t-rotulo); font-weight: 700; color: var(--mut); text-transform: uppercase; letter-spacing: var(--ls-rotulo); }
.panel p { max-width: 96ch; }

.aviso, .alerta, .ok, .nota {
  margin: 11px 0 0; padding: 9px 12px; border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: 12.2px; line-height: 1.58; max-width: 100ch;
}
.aviso  { background: var(--acc-tinte); border-left: 3px solid var(--acc); color: #e8d9b8; }
.alerta { background: var(--t-rojo);  border-left: 3px solid var(--rd);  color: #f0c9c9; }
.ok     { background: var(--t-verde); border-left: 3px solid var(--gr);  color: #cfe8c2; }
.nota   { background: var(--t-azul);  border-left: 3px solid var(--az);  color: #cfe0ef; }
.aviso b { color: var(--acc); } .alerta b { color: #ffb4b4; } .ok b { color: #d6f0c8; } .nota b { color: #d6e6f5; }

.fine { color: var(--mut); font-size: var(--t-fino); line-height: 1.6; margin: 7px 0 0; max-width: var(--medida-prosa); }
.fine b { color: var(--tx2); }
.sello-calculo {
  display: block; margin-top: 7px; font-size: 10.4px; color: #7d8b98; font-variant-numeric: var(--num);
  border-left: 2px solid var(--bd-fuerte); padding-left: 8px;
}
.sello-calculo b { color: var(--mut); font-weight: 600; }

.sello {
  display: inline-block; font-size: 10px; font-weight: 700; border-radius: var(--r-pastilla);
  padding: 2px 8px; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap;
}
.sello.ambar { background: #3a2c0c; color: var(--acc); border: var(--hairline) solid var(--acc-borde); }
.sello.azul  { background: var(--t-azul); color: #86aae3; border: var(--hairline) solid var(--b-azul); }
.sello.gris  { background: #232c35; color: var(--mut); border: var(--hairline) dashed var(--bd-fuerte); }
.sello.verde { background: var(--t-verde); color: #bfe6b0; border: var(--hairline) solid #33502c; }
.sello.rojo  { background: #3a1414; color: #ff9c9c; border: var(--hairline) solid #6b2b2b; }

/* ── Tablas ───────────────────────────────────────────────────────────── */
.tabla-caja { overflow-x: auto; border: var(--hairline) solid var(--bd); border-radius: var(--r-lg); margin-top: 10px; background: var(--pnl); }
.tabla { width: 100%; border-collapse: collapse; font-size: var(--t-tabla); }
.tabla caption { text-align: left; color: var(--mut); font-size: var(--t-fino); padding: 9px 11px 8px; line-height: 1.5; }
.tabla th {
  background: #1b242c; color: var(--mut); font-weight: 600; font-size: 9.8px;
  text-transform: uppercase; letter-spacing: .5px; white-space: nowrap;
  padding: 6px 8px; text-align: left; border-bottom: var(--hairline) solid var(--bd-fuerte);
  position: sticky; top: 0; z-index: 2;
}
.tabla td { padding: var(--pad-celda); border-bottom: var(--hairline) solid var(--bd-suave); color: var(--tx2); }
.tabla tbody tr:last-child td { border-bottom: 0; }
.tabla .num { text-align: right; }
.tabla .destaca { color: var(--acc); font-weight: 600; }
.tabla .hueco { color: var(--hueco); }
.tabla tbody tr:hover td { background: rgba(255,255,255,.028); }
.tabla tr.fuera td { background: rgba(240,165,0,.07); }
.tabla tr.excede td { background: rgba(224,82,82,.10); }
.tabla tr.refer td { background: rgba(91,141,217,.10); }
.tabla tr.refer td:first-child { box-shadow: inset 2px 0 0 var(--az); }
.tabla .porq { color: var(--tenue); font-size: 10.8px; line-height: 1.45; white-space: normal; }
.tabla-nota { font-size: 10.6px; color: var(--tenue); padding: 7px 11px; border-top: var(--hairline) solid var(--bd-suave); }

.matriz-caja { overflow: auto; max-height: 58vh; border: var(--hairline) solid var(--bd); border-radius: var(--r-lg); margin-top: 10px; background: var(--pnl); }
.matriz { border-collapse: collapse; font-size: var(--t-matriz); font-variant-numeric: var(--num); }
.matriz th, .matriz td { padding: 3px 6px; text-align: right; border: var(--hairline) solid rgba(255,255,255,.04); white-space: nowrap; }
.matriz thead th { position: sticky; top: 0; background: #1b242c; color: var(--mut); z-index: 2; font-weight: 600; font-size: 9.4px; }
.matriz .pegado { position: sticky; left: 0; background: #1b242c; color: var(--mut); z-index: 1; text-align: left; font-weight: 600; }
.matriz thead .pegado { z-index: 3; }
.matriz td { cursor: pointer; color: var(--tx2); }
.matriz td:hover { background: #2b3b48 !important; color: var(--acc); }
.matriz td.diag { color: var(--tenue); background: rgba(0,0,0,.22) !important; cursor: default; }
.matriz td.sel { outline: 2px solid var(--acc); outline-offset: -2px; color: var(--acc); font-weight: 700; }

/* ── Barras de distribución ───────────────────────────────────────────── */
.dist-barras { margin-top: 10px; display: flex; flex-direction: column; gap: 2px; }
.barra-fila { display: grid; grid-template-columns: 118px 1fr 92px; gap: 9px; align-items: center; }
.barra-nombre { font-size: 10.2px; color: var(--mut); text-align: right; white-space: nowrap; font-variant-numeric: var(--num); }
.barra-pista { position: relative; height: 13px; background: var(--lienzo-hond); border-radius: 3px; overflow: hidden; }
.barra-valor { position: absolute; inset: 0 auto 0 0; background: var(--acc); border-radius: 3px; min-width: 2px; opacity: .85; }
.barra-valor.fuera { background: #d98a1e; }
.barra-promedio { position: absolute; top: -2px; bottom: -2px; width: 1.5px; background: var(--tx); opacity: .55; }
.barra-cifra { font-size: 10.2px; color: var(--tx2); text-align: right; font-variant-numeric: var(--num); }
.barra-cifra i { font-style: normal; color: var(--tenue); }
.barra-cifra i.fuera { color: var(--acc); }

/* ── Lista de hallazgos ───────────────────────────────────────────────── */
.hallazgos { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 5px; }
.hallazgos li {
  padding: 8px 11px; border-radius: 0 var(--r-sm) var(--r-sm) 0; font-size: 12px; line-height: 1.55;
  border-left: 3px solid var(--bd-fuerte); background: var(--pnl2); color: var(--tx2); max-width: 108ch;
}
.hallazgos li.atencion { border-left-color: var(--rd); background: var(--t-rojo); color: #f0c9c9; }
.hallazgos li.aviso    { border-left-color: var(--acc); background: var(--acc-tinte); color: #e8d9b8; }
.hallazgos li.info     { color: var(--mut); }
.hallazgos li b { color: var(--tx); }
.hallazgos li.aviso b { color: var(--acc); }
.hallazgos li.atencion b { color: #ffb4b4; }

/* ── Figuras / láminas ────────────────────────────────────────────────── */
.lamina { margin: 12px 0 0; border: var(--hairline) solid var(--bd); border-radius: var(--r-lg); background: var(--lienzo-hond); overflow: hidden; }
.lamina svg { display: block; width: 100%; height: auto; }
.lamina figcaption, .fig-pie {
  padding: 8px 12px; font-size: var(--t-fino); color: var(--mut); line-height: 1.5;
  border-top: var(--hairline) solid var(--bd-suave); background: var(--pnl);
}
.lamina figcaption b { color: var(--tx2); }
.leyenda { display: flex; flex-wrap: wrap; gap: 5px 16px; padding: 8px 12px; font-size: 10.8px; color: var(--mut); border-top: var(--hairline) solid var(--bd-suave); }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: var(--num); }
.li { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.li.ancla { background: var(--acc); } .li.susp { background: var(--mut); width: 6px; height: 6px; }
.li.term { border-radius: 1px; border: 1.4px solid var(--tx); width: 8px; height: 8px; }
.li.emp { background: var(--tenue); width: 6px; height: 6px; border-radius: 1px; }
.li.tramo { width: 16px; height: 3.5px; border-radius: 2px; }

.figura { margin: 11px 0 0; background: var(--lienzo-hond); border: var(--hairline) solid var(--bd); border-radius: var(--r-lg); padding: 12px; overflow-x: auto; }
.figura svg { display: block; margin: 0 auto; max-width: 620px; width: 100%; height: auto; }

/* ── Fórmulas ─────────────────────────────────────────────────────────── */
.formula {
  margin: 11px 0 0; background: var(--lienzo-hond); border: var(--hairline) solid var(--bd);
  border-radius: var(--r-lg); padding: 13px 18px; text-align: center; overflow-x: auto;
  font-family: "Times New Roman", "Iowan Old Style", Georgia, serif; font-size: 17px; color: var(--tx);
}
.formula math { font-size: 17px; }
.formula i { font-style: italic; }
.formula sub, .formula sup { font-size: 11px; }
.formula .op { color: var(--mut); padding: 0 3px; }

.dos-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 11px; }
.mini {
  background: var(--pnl2); border: var(--hairline) solid var(--bd); border-radius: var(--r-lg); padding: 10px 12px;
}
.mini h5 { margin: 0 0 5px; font-size: 9.8px; font-weight: 700; color: var(--mut); text-transform: uppercase; letter-spacing: var(--ls-micro); }
.mini p { margin: 0 !important; font-size: 11.8px !important; line-height: 1.55; }

.vivo {
  margin: 11px 0 0; padding: 9px 12px; border-radius: 0 var(--r-sm) var(--r-sm) 0;
  background: var(--t-azul); border-left: 3px solid var(--az); color: #cfe0ef;
  font-size: 12.2px; line-height: 1.6; max-width: 104ch;
}
.vivo b { color: #fff; }
.vivo .rot { display: block; font-size: 9.4px; text-transform: uppercase; letter-spacing: var(--ls-micro); color: #7fa8d6; font-weight: 700; margin-bottom: 2px; }

/* ── Fichas ───────────────────────────────────────────────────────────── */
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
.chip {
  appearance: none; cursor: pointer; font: 400 11px/1 var(--fuente);
  background: rgba(255,255,255,.05); color: var(--tx2);
  border: var(--hairline) solid var(--bd); border-radius: var(--r-pastilla);
  padding: 5px 9px; white-space: nowrap; font-variant-numeric: var(--num);
  transition: background var(--rapido) var(--curva), border-color var(--rapido) var(--curva);
}
.chip:hover { border-color: var(--bd-fuerte); background: rgba(255,255,255,.08); }
.chip.ancla { color: var(--acc); }
.chip.term { color: #f08585; }
.chip.emp { color: var(--tenue); border-style: dashed; }
.chip.act { background: var(--acc); border-color: var(--acc); color: var(--acc-tx); font-weight: 700; }
.chip.act.term { background: #d64545; border-color: #d64545; color: #fff; }
.chip.act.emp { background: #3a444e; border-color: var(--bd-fuerte); color: var(--tx); }

.ficha-grilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(268px, 1fr)); gap: 9px; margin-top: 11px; }
.ficha-bloque { background: var(--pnl2); border: var(--hairline) solid var(--bd); border-radius: var(--r-lg); padding: 10px 12px; }
.ficha-bloque h5 { margin: 0 0 7px; font-size: 9.6px; font-weight: 700; color: var(--mut); text-transform: uppercase; letter-spacing: var(--ls-micro); }
.ficha-bloque dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 0 12px; }
.ficha-bloque dt, .ficha-bloque dd { font-size: 11.6px; padding: 3px 0; border-bottom: var(--hairline) solid var(--bd-suave); }
.ficha-bloque dl > *:nth-last-child(-n+2) { border-bottom: 0; }
.ficha-bloque dt { color: var(--mut); white-space: nowrap; }
.ficha-bloque dd { margin: 0; color: var(--tx); text-align: right; font-variant-numeric: var(--num); }
.pend { color: var(--hueco); font-style: italic; font-size: 11px; }
.reservado { color: var(--hueco); font-size: 11px; }

.galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 11px; }
.galeria figure { margin: 0; }
.galeria .hueco-foto {
  aspect-ratio: 4/3; border: var(--hairline) dashed var(--bd-fuerte); border-radius: var(--r-lg);
  background: repeating-linear-gradient(45deg, rgba(255,255,255,.014) 0 8px, transparent 8px 16px), var(--pnl2);
  display: grid; place-items: center; color: var(--tenue); font-size: 10.4px; text-align: center; padding: 8px;
}
.galeria figcaption { margin-top: 5px; font-size: 10.6px; line-height: 1.45; color: var(--tenue); }

/* ── Expediente de falla ──────────────────────────────────────────────── */
.falla-banda {
  margin: 12px 0 0; padding: 14px 16px;
  background: linear-gradient(135deg, #2a1616, #3a1f10);
  border: var(--hairline) solid #6b2b2b; border-left: 3px solid #ff6b6b;
  border-radius: 0 var(--r-lg) var(--r-lg) 0; box-shadow: var(--luz-arriba), var(--sombra-1);
}
.falla-rot { font-size: 9.4px; letter-spacing: 1.3px; color: #ff6b6b; font-weight: 700; text-transform: uppercase; }
.falla-tit { margin: 3px 0 0; font-size: 18px; font-weight: 600; color: #fff; }
.falla-sub { margin: 4px 0 0 !important; font-size: 11.8px !important; color: #e8c9c9 !important; }
.falla-geo { margin: 7px 0 0 !important; font-size: 11px !important; color: #c9b3b3 !important; font-variant-numeric: var(--num); }
.hip { background: var(--pnl2); border: var(--hairline) solid var(--bd); border-left: 3px solid var(--bd-fuerte);
  border-radius: 0 var(--r-lg) var(--r-lg) 0; padding: 11px 13px; margin-top: 8px; }
.hip.alta { border-left-color: #ff6b6b; background: linear-gradient(180deg, #241a1a 0%, var(--pnl2) 70%); }
.hip.media { border-left-color: var(--acc); }
.hip.baja { border-left-color: #4a5560; }
.hip-cab { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.hip-cab h5 { margin: 0; font-size: 12.8px; font-weight: 600; color: var(--tx); flex: 1; min-width: 180px; }
.hip-orden { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
  background: #243039; border: var(--hairline) solid var(--bd-fuerte); color: var(--mut); font-size: 10.4px; font-weight: 700; }
.hip.alta .hip-orden { background: #d64545; border-color: #d64545; color: #fff; }

/* ── Exportar ─────────────────────────────────────────────────────────── */
.descargas { display: grid; grid-template-columns: repeat(auto-fit, minmax(268px, 1fr)); gap: 7px; margin-top: 10px; }
.descarga {
  appearance: none; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px;
  font: 400 12.2px/1.35 var(--fuente); color: var(--tx2);
  background: rgba(255,255,255,.045); border: var(--hairline) solid var(--bd); border-radius: var(--r-sm);
  padding: 9px 12px; transition: background var(--rapido) var(--curva), border-color var(--rapido) var(--curva), color var(--rapido) var(--curva);
}
.descarga:hover { background: rgba(255,255,255,.075); border-color: var(--acc-borde); color: var(--tx); }
.descarga:disabled { opacity: .38; cursor: not-allowed; }
.descarga .fmt { font-family: var(--fuente-mono); font-size: 9.6px; color: var(--acc); border: var(--hairline) solid var(--acc-borde);
  border-radius: 4px; padding: 2px 5px; flex: none; }
.descarga b { display: block; color: var(--tx); font-weight: 600; font-size: 12.4px; }
.descarga i { font-style: normal; font-size: 10.6px; color: var(--tenue); }

/* ── Estado «sección no evaluable» ────────────────────────────────────── */
.no-eval {
  margin: 12px 0 0; padding: 16px 18px; border-radius: var(--r-lg);
  border: var(--hairline) dashed var(--bd-fuerte); background: rgba(255,255,255,.018);
}
.no-eval .rot { font-size: 9.6px; text-transform: uppercase; letter-spacing: var(--ls-micro); color: var(--tenue); font-weight: 700; }
.no-eval h4 { margin: 5px 0 0; font-size: 14px; font-weight: 600; color: var(--tx2); }
.no-eval p { margin-top: 6px !important; }
.no-eval ul { margin: 9px 0 0; padding-left: 18px; }
.no-eval li { font-size: 12px; color: var(--mut); margin-bottom: 3px; }
.no-eval li b { color: var(--tx2); }

/* ── Pie ──────────────────────────────────────────────────────────────── */
.pie-doc { margin-top: 34px; padding: 16px 0 0; border-top: var(--hairline) solid var(--bd); }
.pie-doc details { font-size: 12px; }
.pie-doc summary {
  cursor: pointer; color: var(--mut); font-size: 11.4px; list-style: none;
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 0;
}
.pie-doc summary::-webkit-details-marker { display: none; }
.pie-doc summary::before { content: '▸'; color: var(--tenue); font-size: 9px; transition: transform var(--rapido) var(--curva); }
.pie-doc details[open] summary::before { transform: rotate(90deg); }
.pie-doc summary:hover { color: var(--tx2); }
.pie-doc .cuerpo-pie { margin-top: 8px; padding: 12px 14px; background: var(--pnl); border: var(--hairline) solid var(--bd); border-radius: var(--r-lg); max-width: 96ch; }
.pie-doc .cuerpo-pie p { font-size: 12.2px; color: var(--tx2); }
.pie-doc .cuerpo-pie p:first-child { margin-top: 0; }
.pie-legal { margin-top: 14px; font-size: 10.4px; color: var(--tenue); line-height: 1.6; max-width: 100ch; }

/* ── Adaptación ───────────────────────────────────────────────────────── */
@media (max-width: 1500px) {
  :root { --sidebar-ancho: 230px; --indice-ancho: 196px; }
  .hoja { padding: 0 26px; }
}
/* Con tres paneles abiertos en una pantalla de 1280-1460 el documento se queda
   en ~800 px: seis indicadores en fila dejarían de caber y la cifra grande se
   partiría. Antes de que eso pase, se reparten en dos filas. */
@media (max-width: 1460px) {
  .kpis.k6, .kpis.k5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kpis.k4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  :root { --t-cifra: 19px; }
}
@media (max-width: 1240px) {
  .cuerpo { grid-template-columns: var(--sidebar-ancho) 0px minmax(0, 1fr); }
  .indice { display: none; }
  .kpis.k6 { grid-template-columns: repeat(3, 1fr); }
  .kpis.k5 { grid-template-columns: repeat(3, 1fr); }
  .dos-col { grid-template-columns: 1fr; }
  .sec-cuerpo { padding-left: 0; }
  .sec-lead { margin-left: 0 !important; }
}
@media (max-width: 900px) {
  .cuerpo { grid-template-columns: 0px 0px minmax(0, 1fr); }
  .sidebar { display: none; }
  .hoja { padding: 0 16px; }
}

/* ── Modo claro de macOS ──────────────────────────────────────────────────
   Oscuro por DEFECTO, pase lo que pase con el ajuste del sistema: el Ingeniero
   pidió «muy oscuro» y un archivo que se abre con doble clic tiene que
   cumplirlo. El claro está entero, a un botón de la barra. */
:root[data-tema="claro"] {
  color-scheme: light;
  --lienzo:#f2f4f7; --lienzo-hond:#e8ebef; --pnl:#ffffff; --pnl2:#f6f8fa;
  --pnl-alto: linear-gradient(180deg,#fff 0%,#fbfcfd 62%);
  --sidebar-fondo: rgba(246,248,250,.72); --indice-fondo: rgba(242,244,247,.7);
  --barra-fondo: rgba(250,251,252,.80); --flotante-fondo: rgba(255,255,255,.92);
  --bd: rgba(0,0,0,.09); --bd-suave: rgba(0,0,0,.06); --bd-fuerte: rgba(0,0,0,.18); --bd-solido:#d6dce2;
  --tx:#111a22; --tx2:#39485a; --mut:#5d6b78; --tenue:#8894a0;
  --acc:#a86f00; --acc-tx:#fff; --acc-suave: rgba(240,165,0,.18); --acc-tinte:#fff6e0;
  --t-verde:#eefaea; --t-rojo:#fdeeee; --t-azul:#eef4fb; --b-azul:#cfdcea;
  --hueco:#8894a0;
  --luz-arriba: inset 0 1px 0 rgba(255,255,255,.8);
  --sombra-1: 0 1px 2px rgba(16,24,32,.08);
  --sombra-2: 0 6px 20px -6px rgba(16,24,32,.16);
}
:root[data-tema="claro"] .tabla th,
:root[data-tema="claro"] .matriz thead th,
:root[data-tema="claro"] .matriz .pegado { background: #eef1f4; }
:root[data-tema="claro"] .veredicto,
:root[data-tema="claro"] .falla-banda { background: linear-gradient(135deg,#fdeeee,#fdf4ec); border-color: #eccaca; }
:root[data-tema="claro"] .veredicto-t,
:root[data-tema="claro"] .falla-tit { color: #7a1f1f; }

<script>
'use strict';
/* ============================================================================
   MAQUETA «EXPEDIENTE NAVEGABLE» — la línea es un DOCUMENTO.
   Todas las cifras de esta página se CALCULAN aquí (catenaria, VIR, ecuación
   de cambio de estado por bisección, quiebre 2·sen(a/2), cargas por vano
   viento). No hay ni un número escrito a mano en las tablas: si se cambia la
   hipótesis, cambia el documento entero. Eso es lo que se está maquetando.
   Ningún dato de cliente: ni coordenadas ni fotografías.
   ========================================================================= */

const nf = (v, d = 0) => (v == null || !isFinite(v)) ? '—'
  : Number(v).toLocaleString('es-CO', { minimumFractionDigits: d, maximumFractionDigits: d });
const H_ = '<span class="hueco">—</span>';
const gr = (v, d = 1) => nf(v, d) + '°';

/* ── Motor de cálculo (equivalente al núcleo del proyecto) ──────────────── */
const M = {
  vir(vanos) { const s3 = vanos.reduce((a, x) => a + x ** 3, 0), s = vanos.reduce((a, x) => a + x, 0); return Math.sqrt(s3 / s); },
  flechaCat(w, a, H) { const C = H / w; return C * (Math.cosh(a / (2 * C)) - 1); },
  flechaPar(w, a, H) { return w * a * a / (8 * H); },
  longCat(w, a, H) { const C = H / w; return 2 * C * Math.sinh(a / (2 * C)); },
  /* Ecuación de cambio de estado, forma parabólica, resuelta por bisección. */
  cambioEstado(H1, w1, t1, w2, t2, a, c) {
    const ES = c.E * c.seccion;
    const A = -H1 + c.alfa * ES * (t2 - t1) + (w1 * w1 * a * a * ES) / (24 * H1 * H1);
    const B = (w2 * w2 * a * a * ES) / 24;
    const f = (H) => H * H * (H + A) - B;
    let lo = 1, hi = Math.max(10, H1);
    while (f(hi) < 0 && hi < 1e7) hi *= 2;
    for (let i = 0; i < 200; i++) { const m = (lo + hi) / 2; if (f(m) < 0) lo = m; else hi = m; }
    return (lo + hi) / 2;
  },
  presionViento(v_kmh, cx, rho) {          /* kgf/m² */
    const v = v_kmh / 3.6; return 0.5 * rho * v * v * cx / 9.80665;
  },
};

/* ── Conductor e hipótesis de LN-627 ───────────────────────────────────── */
const COND = {
  codigo: 'Darien', material: 'AAAC', mcm: 559.5, hilos: 19,
  seccion: 283.5, diametro: 0.02179, rts: 8528, masa: 0.7797,
  E: 6300, Ealt: 7000, alfa: 23e-6, tMaxMaterial: 90, r20: 0.1182, beta: 0.00347,
  procedencia: 'catálogo genérico AAAC — ficha del proveedor PENDIENTE',
};
const HIP = {
  nombre: 'Hipótesis del módulo de campo (SIN VALIDAR)', procedencia: 'supuesto', congelada: false,
  eds: 20, tEds: 25, tMax: 75, tMin: 20, viento: 100, tViento: 25, cx: 1.0, rho: 1.205,
  revision: 'r3', fecha: '2026-07-31',
};
const TOPE_MOTOR = 0.50, TOPE_DOCTRINA = 0.25;

/* ── Geometría declarada de LN-627 (derivada, sin coordenadas) ──────────── */
const VANOS_627 = [168.4, 40.0, 197.7, 46.2, 165.2, 247.8, 191.4, 175.6, 96.2, 88.4, 79.5,
  102.7, 71.3, 118.6, 84.9, 93.1, 67.2, 76.4, 67.2, 13.4, 336.7, 294.8, 106.3];
const DEFLEX_627 = [null, 64.7, 2.1, 50.2, 3.5, 118.2, 0.0, 1.4, 5.6, 0.8, 11.2, 3.3, 0.6, 2.9,
  7.4, 1.1, 4.8, 0.3, 9.6, 76.0, 58.6, 2.4, 1.7, null];
/* Los empalmes NO son apoyos: cuelgan a mitad de vano y no doblan la línea. */
const EMPALMES_627 = [{ nom: 'EMP TUB', vano: 5, frac: 0.42 }, { nom: 'EMP RAM', vano: 13, frac: 0.55 }];

const TRAMO_COLOR = ['#f0a500', '#5b8dd9', '#7fc96a', '#b47ee0', '#4fc3c7', '#e07a5f'];

const funcionDe = (d, i, n) => {
  if (i === 0 || i === n - 1) return 'Terminal';
  if (d == null) return 'Sin declarar';
  if (d >= 30) return 'Retención';
  if (d >= 15) return 'Ángulo';
  if (d >= 3) return 'Suspensión angular';
  return 'Suspensión';
};
const claseFuncion = (f) => f === 'Terminal' ? 'term' : (f === 'Retención' || f === 'Ángulo') ? 'ancla' : '';

/* ── Modelo completo de una línea ──────────────────────────────────────── */
function modelar(L) {
  const vanos = L.vanos, defl = L.deflex, n = defl.length;
  const nombres = Array.from({ length: n }, (_, i) => 'E' + String(i + 1).padStart(2, '0'));
  const func = defl.map((d, i) => funcionDe(d, i, n));

  /* Cortes de tramo: terminales y anclajes (retención/ángulo). */
  const cortes = [];
  func.forEach((f, i) => { if (f === 'Terminal' || f === 'Retención' || f === 'Ángulo') cortes.push(i); });

  /* Planta esquemática por acimut acumulado (geometría relativa, no GPS). */
  const pts = [{ x: 0, y: 0 }]; let rumbo = 0, signo = 1;
  for (let i = 0; i < vanos.length; i++) {
    if (i > 0 && defl[i] != null) { rumbo += signo * defl[i] * Math.PI / 180; signo *= -1; }
    const p = pts[i]; pts.push({ x: p.x + vanos[i] * Math.cos(rumbo), y: p.y + vanos[i] * Math.sin(rumbo) });
  }
  const dist = (a, b) => Math.hypot(pts[a].x - pts[b].x, pts[a].y - pts[b].y);
  const progres = [0]; vanos.forEach((v, i) => progres.push(progres[i] + v));

  const c = L.conductor, h = L.hipotesis;
  let tramos = [], cargasT = [], cargasL = [], vanoAvano = [], q = 0, w2 = 0, balanceo = 0, presion = 0;

  if (c && h) {
    presion = M.presionViento(h.viento, h.cx, h.rho);
    q = presion * c.diametro;
    w2 = Math.hypot(c.masa, q);
    balanceo = Math.atan2(q, c.masa) * 180 / Math.PI;
    const Heds = c.rts * h.eds / 100;
    for (let t = 0; t < cortes.length - 1; t++) {
      const a = cortes[t], b = cortes[t + 1], vv = vanos.slice(a, b);
      const vir = M.vir(vv), vmax = Math.max(...vv);
      const hTMax = M.cambioEstado(Heds, c.masa, h.tEds, c.masa, h.tMax, vir, c);
      const hVien = M.cambioEstado(Heds, c.masa, h.tEds, w2, h.tViento, vir, c);
      const hTMin = M.cambioEstado(Heds, c.masa, h.tEds, c.masa, h.tMin, vir, c);
      const pico = Math.max(Heds, hTMax, hVien, hTMin);
      tramos.push({
        n: t + 1, desde: nombres[a], hasta: nombres[b], iDesde: a, iHasta: b,
        nVanos: vv.length, vanos: vv, vmax, vir, Heds, hTMax, hVien, hTMin, pico,
        pct: pico / c.rts * 100, flecha: M.flechaCat(c.masa, vmax, hTMax),
        flechaViento: M.flechaCat(w2, vmax, hVien),
      });
      vv.forEach((v, k) => vanoAvano.push({
        i: a + k, de: nombres[a + k], al: nombres[a + k + 1], vano: v, tramo: t + 1, vir,
        rel: v / vir, fuera: (v / vir < 0.7 || v / vir > 1.3),
        flecha: M.flechaCat(c.masa, v, hTMax), long: M.longCat(c.masa, v, Heds),
      }));
    }
    const tramoDeApoyo = (i) => {
      const r = []; tramos.forEach(t => { if (i >= t.iDesde && i <= t.iHasta) r.push(t); }); return r;
    };
    for (let i = 0; i < n; i++) {
      const ts = tramoDeApoyo(i), T = Math.max(...ts.map(t => t.hVien));
      const d = defl[i], fac = d == null ? 0 : 2 * Math.sin(d * Math.PI / 360);
      const vAnt = i > 0 ? vanos[i - 1] : 0, vSig = i < n - 1 ? vanos[i] : 0;
      const vViento = (i === 0) ? vSig / 2 : (i === n - 1) ? vAnt / 2 : (vAnt + vSig) / 2;
      const quiebre = fac * T, viento = q * vViento;
      cargasT.push({
        i, nom: nombres[i], func: func[i], defl: d, fac, vViento, T, quiebre, viento,
        total: quiebre + viento, vAnt, vSig,
      });
      /* Eje longitudinal: NUNCA se suma con el transversal. */
      const esTerminal = func[i] === 'Terminal';
      const esAncla = esTerminal || func[i] === 'Retención' || func[i] === 'Ángulo';
      const cosm = d == null ? 1 : Math.cos(d * Math.PI / 360);
      const tAtras = i > 0 ? (tramos.find(t => t.iHasta === i) || tramos.find(t => i > t.iDesde && i <= t.iHasta)) : null;
      const tAdel = i < n - 1 ? (tramos.find(t => t.iDesde === i) || tramos.find(t => i >= t.iDesde && i < t.iHasta)) : null;
      const Ha = tAtras ? tAtras.pico * cosm : 0, Hd = tAdel ? tAdel.pico * cosm : 0;
      cargasL.push({
        i, nom: nombres[i], func: func[i], defl: d, cosm, esAncla, esTerminal,
        atras: Ha, adelante: Hd, delta: esTerminal ? Math.max(Ha, Hd) : Math.abs(Ha - Hd),
        sentido: esTerminal ? 'hacia la línea' : (Math.abs(Ha - Hd) < 10 ? 'no concluyente' : (Ha > Hd ? 'hacia atrás' : 'hacia adelante')),
      });
    }
    /* El terminal carga con el tiro entero de la línea, no con un desequilibrio. */
    const picoLinea = Math.max(...tramos.map(t => t.pico));
    cargasL.forEach(x => { if (x.esTerminal) { x.delta = picoLinea; x.tiroEntero = true; } });
  }

  const suma = vanos.reduce((a, x) => a + x, 0);
  const stats = {
    total: suma, prom: suma / vanos.length, min: Math.min(...vanos), max: Math.max(...vanos),
    mediana: [...vanos].sort((a, b) => a - b)[Math.floor(vanos.length / 2)],
    sigma: Math.sqrt(vanos.reduce((a, x) => a + (x - suma / vanos.length) ** 2, 0) / vanos.length),
    directa: dist(0, n - 1),
  };
  stats.rodeo = suma / stats.directa;
  stats.largos = vanos.filter(v => v > 2 * stats.prom).length;

  return { L, nombres, func, defl, vanos, cortes, pts, dist, progres, tramos, cargasT, cargasL, vanoAvano, stats, q, w2, balanceo, presion };
}

/* ── Cartera: 20 líneas. Códigos sintéticos salvo LN-627. ──────────────── */
function rng(seed) { let s = seed; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function vanosSinteticos(seed, nVanos, total) {
  const r = rng(seed), v = [];
  for (let i = 0; i < nVanos; i++) v.push(0.35 + r() * (r() < 0.12 ? 2.6 : 1.1));
  const s = v.reduce((a, x) => a + x, 0);
  return v.map(x => Math.round(x / s * total * 10) / 10);
}
function deflexSinteticas(seed, n) {
  const r = rng(seed + 77), d = [null];
  for (let i = 1; i < n - 1; i++) d.push(r() < 0.14 ? Math.round((32 + r() * 70) * 10) / 10 : Math.round(r() * 11 * 10) / 10);
  d.push(null); return d;
}

/* ══ LÁMINA 1 — planta esquemática (geometría relativa, sin coordenadas) ══ */
function svgPlanta(m) {
  const W = 1040, Hh = 330, pad = 30;
  /* Se gira la planta sobre su eje principal para que llene la lámina. El norte
     ya está declarado como RELATIVO (la orientación absoluta es dato de cliente),
     así que la flecha de norte gira con ella y sigue diciendo la verdad. */
  const cxm = m.pts.reduce((a, p) => a + p.x, 0) / m.pts.length;
  const cym = m.pts.reduce((a, p) => a + p.y, 0) / m.pts.length;
  let sxx = 0, syy = 0, sxy = 0;
  m.pts.forEach(p => { const dx = p.x - cxm, dy = p.y - cym; sxx += dx * dx; syy += dy * dy; sxy += dx * dy; });
  const giro = -0.5 * Math.atan2(2 * sxy, sxx - syy);
  const cg = Math.cos(giro), sg = Math.sin(giro);
  const R = m.pts.map(p => ({ x: (p.x - cxm) * cg - (p.y - cym) * sg, y: (p.x - cxm) * sg + (p.y - cym) * cg }));
  const xs = R.map(p => p.x), ys = R.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const k = Math.min((W - 2 * pad) / Math.max(1, x1 - x0), (Hh - 2 * pad) / Math.max(1, y1 - y0));
  const cx = (W - (x1 - x0) * k) / 2, cy = (Hh - (y1 - y0) * k) / 2;
  const P = R.map(p => ({ X: cx + (p.x - x0) * k, Y: Hh - (cy + (p.y - y0) * k) }));

  let s = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Planta esquemática de ${m.L.cod}">`;
  s += `<rect width="${W}" height="${Hh}" fill="#0b0f13"/>`;
  for (let gx = 0; gx <= W; gx += 52) s += `<line x1="${gx}" y1="0" x2="${gx}" y2="${Hh}" stroke="rgba(255,255,255,.028)" stroke-width="1"/>`;
  for (let gy = 0; gy <= Hh; gy += 52) s += `<line x1="0" y1="${gy}" x2="${W}" y2="${gy}" stroke="rgba(255,255,255,.028)" stroke-width="1"/>`;

  /* Traza por tramo de tensión, cada uno con su color */
  if (m.tramos.length) {
    m.tramos.forEach((t, ti) => {
      const d = P.slice(t.iDesde, t.iHasta + 1).map((p, i) => (i ? 'L' : 'M') + p.X.toFixed(1) + ' ' + p.Y.toFixed(1)).join(' ');
      s += `<path d="${d}" fill="none" stroke="${TRAMO_COLOR[ti % 6]}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>`;
    });
  } else {
    const d = P.map((p, i) => (i ? 'L' : 'M') + p.X.toFixed(1) + ' ' + p.Y.toFixed(1)).join(' ');
    s += `<path d="${d}" fill="none" stroke="#52606d" stroke-width="2.2" stroke-linejoin="round"/>`;
  }

  /* Empalmes: cuelgan a mitad de vano, no doblan nada */
  (m.L.empalmes || []).forEach(e => {
    const a = P[e.vano], b = P[e.vano + 1]; if (!a || !b) return;
    const X = a.X + (b.X - a.X) * e.frac, Y = a.Y + (b.Y - a.Y) * e.frac;
    s += `<rect x="${(X - 3).toFixed(1)}" y="${(Y - 3).toFixed(1)}" width="6" height="6" fill="#6f7d8a" transform="rotate(45 ${X.toFixed(1)} ${Y.toFixed(1)})"/>`;
  });

  /* Apoyos. Las etiquetas se alternan arriba/abajo cuando dos anclajes caen
     cerca — con un vano de 13,4 m se pisarían. */
  let ult = null;
  P.forEach((p, i) => {
    const f = m.func[i];
    if (f === 'Terminal') s += `<rect x="${(p.X - 4.5).toFixed(1)}" y="${(p.Y - 4.5).toFixed(1)}" width="9" height="9" fill="#0b0f13" stroke="#e6edf3" stroke-width="1.8"/>`;
    else if (f === 'Retención' || f === 'Ángulo') s += `<circle cx="${p.X.toFixed(1)}" cy="${p.Y.toFixed(1)}" r="4.6" fill="#f0a500" stroke="#0b0f13" stroke-width="1.2"/>`;
    else s += `<circle cx="${p.X.toFixed(1)}" cy="${p.Y.toFixed(1)}" r="2.6" fill="#8b98a5"/>`;
    if (f === 'Terminal' || f === 'Retención' || f === 'Ángulo') {
      const cerca = ult && Math.hypot(p.X - ult.X, p.Y - ult.Y) < 52;
      const dy = cerca ? (ult.dy < 0 ? 17 : -8) : -8;
      s += `<text x="${(p.X + 7).toFixed(1)}" y="${(p.Y + dy).toFixed(1)}" fill="${f === 'Terminal' ? '#e6edf3' : '#f0a500'}" font-size="10.5" font-family="ui-monospace,SF Mono,Menlo,monospace">${m.nombres[i]}</text>`;
      ult = { X: p.X, Y: p.Y, dy };
    }
  });

  /* Marcador del evento de falla, por encima de todo */
  if (m.L.rico) {
    const p = P[1];
    s += `<circle cx="${p.X.toFixed(1)}" cy="${p.Y.toFixed(1)}" r="7" fill="rgba(214,69,69,.35)">
      <animate attributeName="r" values="7;17;7" dur="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;0;.5" dur="2.1s" repeatCount="indefinite"/></circle>`;
    s += `<circle cx="${p.X.toFixed(1)}" cy="${p.Y.toFixed(1)}" r="6.4" fill="#d64545" stroke="#0b0f13" stroke-width="1.6"/>`;
    s += `<text x="${(p.X + 11).toFixed(1)}" y="${(p.Y + 13).toFixed(1)}" fill="#ff8b8b" font-size="10" font-family="-apple-system,system-ui,sans-serif">evento de falla</text>`;
  }

  /* Norte + escala */
  s += `<g transform="translate(${W - 46} 34)"><g transform="rotate(${(-giro * 180 / Math.PI).toFixed(1)})">
    <line x1="0" y1="14" x2="0" y2="-6" stroke="#8b98a5" stroke-width="1.2"/>
    <path d="M0 -11 L4 -3 L-4 -3 Z" fill="#8b98a5"/></g>
    <text x="0" y="30" fill="#8b98a5" font-size="10" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif">N*</text></g>`;
  const esc = 200 * k;
  s += `<g transform="translate(28 ${Hh - 20})"><line x1="0" y1="0" x2="${esc.toFixed(1)}" y2="0" stroke="#8b98a5" stroke-width="1.4"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#8b98a5" stroke-width="1.4"/><line x1="${esc.toFixed(1)}" y1="-4" x2="${esc.toFixed(1)}" y2="4" stroke="#8b98a5" stroke-width="1.4"/>
    <text x="${(esc / 2).toFixed(1)}" y="-7" fill="#8b98a5" font-size="10" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif">200 m</text></g>`;
  return s + '</svg>';
}

/* ══ Barras de distribución de vanos ═══════════════════════════════════ */
function barrasVanos(m) {
  const max = m.stats.max, prom = m.stats.prom;
  return `<div class="dist-barras">` + m.vanos.map((v, i) => {
    const va = m.vanoAvano[i];
    const fuera = va ? va.fuera : false;
    return `<div class="barra-fila">
      <span class="barra-nombre">${m.nombres[i]} → ${m.nombres[i + 1]}</span>
      <span class="barra-pista"><span class="barra-valor${fuera ? ' fuera' : ''}" style="width:${(v / max * 100).toFixed(2)}%"></span>
        <span class="barra-promedio" style="left:${(prom / max * 100).toFixed(2)}%"></span></span>
      <span class="barra-cifra">${nf(v, 1)} m ${va ? `<i class="${fuera ? 'fuera' : ''}">·${nf(va.rel, 2)}</i>` : ''}</span>
    </div>`;
  }).join('') + `</div>`;
}

function secPortada(m) {

  else semaforos.push(['bien', 'Eventos de falla', 'Ninguno registrado', 'Es el estado de la línea, no un hueco de la aplicación']);

  semaforos.push(['atender', 'Calidad del levantamiento',
    'Precisión GPS ±' + (L.rico ? 8 : 11) + ' m',
    'No sirve para flecha, gálibo ni distancias de seguridad']);

  if (!c) semaforos.push(['sin', 'Cálculo mecánico', 'No evaluable', 'No hay conductor declarado en esta línea']);
  else {
    const fuera = m.vanoAvano.filter(v => v.fuera).length;
    semaforos.push([fuera ? 'atender' : 'bien', 'Cálculo mecánico',
      m.tramos.length + ' tramos calculados',
      fuera + ' de ' + m.vanoAvano.length + ' vanos fuera de la banda 0,7–1,3 del VIR']);
  }

  semaforos.push([h && h.congelada ? 'bien' : 'critico', 'Hipótesis de cálculo',
    h ? (h.congelada ? 'Congelada' : 'SIN VALIDAR') : 'No declarada',
    h ? ('Procedencia: ' + h.procedencia + (h.congelada ? '' : ' · no congelada')) : 'Sin ella no hay cálculo mecánico']);

  const topeMotor = c ? c.rts * TOPE_MOTOR : 0, topeDoc = c ? c.rts * TOPE_DOCTRINA : 0;

  /* Contraste entre lo que dice el RESUMEN GUARDADO (que ordena la cartera) y
     lo que acaba de calcular la pantalla. Si no coinciden, la lista miente y
     hay que decirlo en la portada, no en una nota al pie. */
  const fueraVivo = c ? m.vanoAvano.filter(v => v.fuera).length : 0;
  const discrepa = L.estado === 'bien' && fueraVivo > 0;

  return `<div class="portada" id="s0" data-n="" data-tit="Portada" data-pg="1">
    <div class="rot">Informe de estado de línea · ${firmable ? 'revisión ' + (h ? h.revision : '—') + ' · hipótesis congelada' : 'borrador'}</div>

      mismas cifras. Revisar en pantalla y revisar el papel son el mismo trabajo.</p>

    <div class="veredicto${firmable ? ' ok' : ''}">
      <div class="veredicto-icono">${firmable ? '✓' : '!'}</div>
      <div>
        <div class="veredicto-t">¿Está lista para firmar? ${firmable ? 'SÍ, con las reservas declaradas.' : 'NO.'}</div>
        <p class="veredicto-c">${firmable
      ? `La hipótesis está congelada y no hay hallazgos abiertos. Aun así, <b>el sistema no certifica nada</b>: certifica el ingeniero que firma. Lo que hace el sistema es hacer barato comprobar que ese ingeniero tiene razón.`
      : `${h ? `La hipótesis vigente es «<b>${h.nombre}</b>», procedencia <b>${h.procedencia}</b>, y <b>no está congelada</b>.` : 'Esta línea <b>no tiene hipótesis de cálculo declarada</b>.'}
             ${c ? `Además, el tope de tiro sigue sin decidir: el motor calcula contra el <b>${nf(TOPE_MOTOR * 100)} % de la RTS</b> (${nf(topeMotor)} kgf) y la doctrina interna pide el <b>${nf(TOPE_DOCTRINA * 100)} %</b> (${nf(topeDoc)} kgf).` : ''}
             Mientras eso siga así, <b>ninguna cifra de este documento es un dictamen firmable</b>.`}</p>
      </div>
    </div>

    <div class="banda-estado">
      ${semaforos.map(([cl, t, v, s]) => `<div class="estado-ficha ${cl}"><span class="estado-punto"></span>
        <span><span class="estado-t">${t}</span><span class="estado-v">${v}</span><span class="estado-s">${s}</span></span></div>`).join('')}

        <dt>Tramos de tensión</dt><dd>${m.tramos.length || H_}</dd>
      </dl>
      <dl>
        <dt>Conductor</dt><dd>${c ? c.material + ' ' + c.codigo : '<span class="pend">no declarado</span>'}</dd>

        <dt>RTS</dt><dd>${c ? nf(c.rts) + ' kgf' : H_}</dd>
        <dt>Procedencia del conductor</dt><dd>${c ? '<span class="pend">' + c.procedencia + '</span>' : H_}</dd>

      </dl>
    </div>

    ${discrepa ? `<p class="aviso"><b>El resumen guardado clasifica esta línea como «Al día»; el cálculo que corre en esta

      ${L.fechaResumen}. Mientras no se recalcule, <b>la posición de esta línea en la lista es una foto vieja</b> — y una lista

    ${L.motorViejo ? `<p class="aviso"><b>El resumen de esta línea se calculó con ${L.motor}</b> y la pantalla corre v0.9.4.

      hasta recalcularlo, el semáforo de la lista es <b>una foto vieja</b>, no el estado de hoy.</p>` : ''}

    <p class="fine">Este sistema no certifica nada. Certifica el ingeniero que firma. El trabajo del sistema
      es hacer barato comprobar que ese ingeniero tiene razón.</p>
    ${corte(1)}</div>`;
}

/* ══ 1 · RESUMEN EJECUTIVO ═════════════════════════════════════════════ */
function sec1(m) {
  const L = m.L, s = m.stats;
  const fuera = m.vanoAvano.filter(v => v.fuera).length;
  const anclajes = m.func.map((f, i) => ({ f, i })).filter(x => x.f === 'Retención' || x.f === 'Ángulo');
  const ampl = m.cargasT.filter(c => c.fac > 1);
  const peor = m.cargasT.length ? m.cargasT.reduce((a, b) => b.total > a.total ? b : a) : null;

  const hallazgos = [];
  hallazgos.push(['atencion', 'Precisión GPS declarada ±' + (L.rico ? 8 : 11) + ' m',
    'Las cotas salen de un GPS de mano. Sirven para ubicar y para medir en planta; <b>no</b> para flecha, gálibo ni distancia de seguridad. Todo lo que dependa de la cota queda declarado, no calculado.']);
  if (m.tramos.length) hallazgos.push(['aviso', 'Quiebre de ' + gr(Math.max(...m.defl.filter(d => d != null))) + ' en ' + m.cargasT.reduce((a, b) => (b.fac > a.fac ? b : a)).nom,
    'Amplifica la carga transversal por <b>×' + nf(Math.max(...m.cargasT.map(c => c.fac)), 3) + '</b>: ' + nf((Math.max(...m.cargasT.map(c => c.fac)) - 1) * 100, 1) + ' % más que el propio tiro del conductor, con viento y sin él.']);
  if (s.largos) hallazgos.push(['aviso', s.largos + ' vano' + (s.largos > 1 ? 's' : '') + ' de más del doble del promedio',
    'El mayor es de <b>' + nf(s.max, 1) + ' m</b> frente a un promedio de ' + nf(s.prom, 1) + ' m. Son los que mandan la flecha y el tiro del tramo.']);
  hallazgos.push(['info', 'Ninguna estructura declara su función',
    'Las ' + L.estr + ' se dedujeron por deflexión con el criterio del módulo original (&lt;3° suspensión · &lt;15° suspensión angular · &lt;30° ángulo · ≥30° retención). <b>Deducir no es declarar</b>: el veredicto de coherencia no se puede emitir.']);
  if (L.rico) hallazgos.push(['info', '103 fotografías · 12 puntos sin ninguna',
    '4 del expediente de falla y 99 de estructura repartidas en 14 puntos. Los 12 puntos restantes declaran que no tienen fotografía: el hueco se cuenta, no se disimula.']);

  return sec('s1', '1', 'Resumen ejecutivo', 2,
    'Lo que hay que saber de esta línea antes de abrir ninguna tabla: cuánta línea es, qué exige acción y qué no se demuestra.',
    `<figure class="lamina">${svgPlanta(m)}

        <span><i class="li emp"></i> Empalme (no es apoyo)</span>
        ${m.tramos.map((t, i) => `<span><i class="li tramo" style="background:${TRAMO_COLOR[i % 6]}"></i> Tramo ${t.n}: ${t.desde}–${t.hasta} · ${t.nVanos} vano${t.nVanos > 1 ? 's' : ''}</span>`).join('')}
      </div>
      <figcaption><b>Lámina 1 — Planta esquemática.</b> Geometría relativa derivada del levantamiento,
        coloreada por tramo de tensión. Se dibuja sin coordenadas absolutas: en el sistema real este
        recuadro es el mapa, y el esquema es el respaldo que responde cuando el mapa tarda.
        <span class="reservado">*Norte relativo — la orientación absoluta es dato de cliente y no se publica aquí.</span></figcaption>
    </figure>

    <h3 class="sub" data-idx="1.1" id="s1-1"><span class="n">1.1</span> Cuánta línea es</h3>
    <div class="kpis k6">
      <div class="kpi"><div class="kpi-v">${nf(L.largo, 0)}<small> m</small></div><div class="kpi-l">Longitud por la línea</div><div class="kpi-s">Suma de los ${m.vanos.length} vanos</div></div>
      <div class="kpi"><div class="kpi-v">${nf(s.directa, 0)}<small> m</small></div><div class="kpi-l">Distancia directa</div><div class="kpi-s">Factor de rodeo ${nf(s.rodeo, 2)}</div></div>
      <div class="kpi"><div class="kpi-v">${L.estr}</div><div class="kpi-l">Estructuras</div><div class="kpi-s">+ ${L.emp} empalme${L.emp === 1 ? '' : 's'}, que no son apoyos</div></div>
      <div class="kpi"><div class="kpi-v">${m.vanos.length}</div><div class="kpi-l">Vanos</div><div class="kpi-s">${m.tramos.length || '—'} tramos de tensión</div></div>
      <div class="kpi"><div class="kpi-v">${nf(s.prom, 1)}<small> m</small></div><div class="kpi-l">Vano promedio</div><div class="kpi-s">Mediana ${nf(s.mediana, 1)} m · σ ${nf(s.sigma, 1)} m</div></div>
      <div class="kpi"><div class="kpi-v">${nf(s.min, 1)} / ${nf(s.max, 1)}</div><div class="kpi-l">Vano mín / máx (m)</div><div class="kpi-s">${s.largos} por encima del doble del promedio</div></div>
    </div>
    <p class="fine">Los <b>${L.emp} empalme${L.emp === 1 ? '' : 's'}</b> se cuentan aparte a propósito: un empalme cuelga a mitad de vano y no
      sostiene el conductor. Contarlo como apoyo partiría un vano real${L.rico ? ' de <b>' + nf(m.vanos[5], 1) + ' m</b>' : ''} en dos falsos
      y movería la deflexión de sus vecinos.</p>

    ${L.rico ? `<div class="falla-banda"><div class="falla-rot">Exige acción hoy</div>
      <div class="falla-tit">Expediente de falla abierto en ${m.nombres[1]}</div>
      <p class="falla-sub">Apertura de línea · cadena de amarre y grapa de retención · <b>4 verificaciones pendientes sin resolver</b></p>
      <p class="falla-geo">Deflexión ${gr(m.defl[1])} · progresiva ${nf(m.progres[1], 1)} m · función deducida ${m.func[1]} · 4 fotografías en el expediente</p>
      <p class="falla-sub">El detalle completo va en la sección 4. Las verificaciones pendientes son literalmente
        lo que separa un informe defendible de uno que solo suena convincente.</p></div>` : ''}

    <h3 class="sub" data-idx="1.2" id="s1-2"><span class="n">1.2</span> Calidad del levantamiento — hallazgos calculados, no redactados</h3>

      <div class="kpi"><div class="kpi-v">${nf(s.prom, 1)}<small> m</small></div><div class="kpi-l">Promedio</div></div>
      <div class="kpi"><div class="kpi-v">${nf(s.mediana, 1)}<small> m</small></div><div class="kpi-l">Mediana</div></div>
      <div class="kpi"><div class="kpi-v">${nf(s.sigma, 1)}<small> m</small></div><div class="kpi-l">Desviación típica</div></div>
      <div class="kpi"><div class="kpi-v rojo">${nf(s.max, 1)}<small> m</small></div><div class="kpi-l">Máximo</div><div class="kpi-s">×${nf(s.max / s.prom, 2)} el promedio</div></div>
      <div class="kpi"><div class="kpi-v azul">${nf(s.min, 1)}<small> m</small></div><div class="kpi-l">Mínimo</div><div class="kpi-s">×${nf(s.min / s.prom, 2)} el promedio</div></div>
      <div class="kpi"><div class="kpi-v ${fuera ? 'rojo' : 'verde'}">${m.tramos.length ? fuera + ' / ' + m.vanoAvano.length : H_}</div><div class="kpi-l">Vanos fuera de banda</div><div class="kpi-s">Respecto al VIR de su tramo (0,7–1,3)</div></div>
    </div>

      es la relación <b>vano / VIR de su tramo</b>: en ámbar cuando cae fuera de la banda 0,7–1,3, que es donde

/* ══ 2 · DISTANCIAS ════════════════════════════════════════════════════ */
function sec2(m) {
  const n = m.nombres.length;
  let filas = '';
  for (let i = 0; i < n; i++) {
    filas += `<tr><th class="pegado">${m.nombres[i]}</th>`;
    for (let j = 0; j < n; j++) {
      if (i === j) { filas += `<td class="diag">—</td>`; continue; }
      const d = m.dist(i, j);
      const t = Math.max(0, Math.min(1, 1 - d / 900));
      filas += `<td data-i="${i}" data-j="${j}" style="background:rgba(240,165,0,${(t * 0.30).toFixed(3)})">${nf(d, 0)}</td>`;
    }
    filas += `</tr>`;
  }
  const opts = m.nombres.map((x, i) => `<option value="${i}">${x}</option>`).join('');
  return sec('s2', '2', 'Distancias entre estructuras', 4,
    'Distancia directa entre cualquier par de apoyos y recorrido por la línea. Las cotas no entran: con ±8 m de precisión vertical, el desnivel se declara pero no se firma.',
    `<div class="panel"><h4>Calculadora de dos extremos</h4>
      <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:8px">
        <label style="display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px">Desde
          <select id="calc-a" style="background:var(--lienzo-hond);color:var(--tx);border:var(--hairline) solid var(--bd);border-radius:6px;padding:6px 9px;font:400 12.5px var(--fuente);min-width:150px;text-transform:none;letter-spacing:0">${opts}</select></label>
        <button class="chip" id="calc-inv" style="padding:8px 12px">⇄ Invertir</button>
        <label style="display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px">Hasta
          <select id="calc-b" style="background:var(--lienzo-hond);color:var(--tx);border:var(--hairline) solid var(--bd);border-radius:6px;padding:6px 9px;font:400 12.5px var(--fuente);min-width:150px;text-transform:none;letter-spacing:0">${opts}</select></label>
      </div>
      <div class="kpis k4" id="calc-kpis"></div>
      <p class="fine">La distancia directa se resuelve con <b>Vincenty sobre WGS84</b> en el sistema real; aquí, sobre la
        misma geometría relativa que dibuja la lámina 1. El desnivel se muestra en gris y rotulado
        <b>«no firmable»</b>: sale de cotas GPS de mano con ±8 m declarados.</p></div>

    <h3 class="sub" data-idx="2.1" id="s2-1"><span class="n">2.1</span> Matriz completa ${n} × ${n}</h3>
    <p>Las ${nf(n * n)} celdas están tintadas en ámbar por proximidad: cuanto más oscuro el ámbar, más cerca
      están las dos estructuras. Haz clic en cualquier celda y el par sube a la calculadora.</p>
    <div class="matriz-caja"><table class="matriz" id="matriz"><thead><tr><th class="pegado">m</th>${m.nombres.map(x => `<th>${x}</th>`).join('')}</tr></thead>
      <tbody>${filas}</tbody></table></div>
    <p class="fine">Distancias en metros, en planta. <b>No son distancias de seguridad</b>: eso exige cota, y la cota
      de este levantamiento no la soporta.</p>
    ${corte(5)}`);
}

/* ══ 3 · FICHAS ════════════════════════════════════════════════════════ */
function sec3(m) {
  const L = m.L;
  const chips = m.nombres.map((x, i) => `<button class="chip ${claseFuncion(m.func[i])}" data-ficha="${i}">${x}</button>`).join('')
    + (L.empalmes || []).map((e, k) => `<button class="chip emp" data-ficha="emp${k}">${e.nom}</button>`).join('');
  return sec('s3', '3', 'Fichas de estructura', 6,
    'Una ficha por punto. Cada hueco se pinta como hueco —«pendiente, se captura en campo»— y nunca como cero: un cero se suma, un hueco se ve.',
    `<div class="chips" id="chips-ficha">${chips}</div>
     <div id="ficha-cuerpo"></div>
     ${corte(8)}`);
}
/* ── Fotografías por punto (LN-627: 99 de estructura en 14 de 26 puntos) ── */
const FOTOS_627 = [0, 4, 0, 9, 0, 12, 7, 0, 0, 6, 0, 8, 0, 5, 0, 11, 0, 7, 0, 9, 10, 0, 3, 6, 2, 0];

function renderFicha(m, sel) {
  const L = m.L, cont = document.getElementById('ficha-cuerpo'); if (!cont) return;
  const esEmp = String(sel).startsWith('emp');
  const uuid = (s) => 'a7f' + String(s).padStart(2, '0') + 'c2-' + (4100 + Number(String(s).replace(/\D/g, '') || 0) * 7) + '-4b1e-9d' + String(s).padStart(2, '0');

  if (esEmp) {
    const k = Number(sel.slice(3)), e = (L.empalmes || [])[k] || { nom: 'EMP', vano: 0, frac: .5 };
    cont.innerHTML = `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px">
      <h4 class="sub2" style="margin:0">${e.nom}</h4><span class="sello gris">Empalme — no es apoyo</span>
      <span class="sello azul">no sostiene el conductor</span></div>
      <div class="ficha-grilla">
        <div class="ficha-bloque"><h5>Identidad</h5><dl>
          <dt>Nombre</dt><dd>${e.nom}</dd><dt>Tipo de punto</dt><dd>Empalme</dd>
          <dt>Vano que lo contiene</dt><dd>${m.nombres[e.vano]} → ${m.nombres[e.vano + 1]}</dd>
          <dt>Vano real</dt><dd>${nf(m.vanos[e.vano], 1)} m</dd>
          <dt>Posición en el vano</dt><dd>${nf(e.frac * 100, 0)} %</dd></dl></div>
        <div class="ficha-bloque"><h5>Por qué va aparte</h5>
          <p style="font-size:11.8px;margin:0;color:var(--tx2);line-height:1.6">Un empalme cuelga a mitad de vano: no dobla la línea ni recibe carga de quiebre.
          Contarlo como apoyo partiría este vano de <b>${nf(m.vanos[e.vano], 1)} m</b> en dos falsos y movería la deflexión
          de sus vecinos${L.rico ? ' — que es justo el error que traía el módulo original en ' + m.nombres[5] : ''}.</p></div>
        <div class="ficha-bloque"><h5>Trazabilidad del dato</h5><dl>
          <dt>UUID</dt><dd class="mono">${uuid(90 + k)}</dd><dt>Revisión</dt><dd>r2</dd>
          <dt>Capturado por</dt><dd class="pend">pendiente (F4)</dd><dt>Fecha</dt><dd class="pend">pendiente (F4)</dd></dl></div>
      </div>`;
    return;
  }

  const i = Number(sel), c = L.conductor;
  const cT = m.cargasT[i], cL = m.cargasL[i];
  const nFotos = L.rico ? FOTOS_627[i] : (i % 4 === 1 ? 5 : 0);
  const crit = [];

  /* Criterio 1 — coherencia función declarada vs deflexión medida */
  crit.push({
    et: 'Coherencia función / deflexión', val: m.defl[i] == null ? '—' : gr(m.defl[i]), ver: 'no_evaluable',
    cri: '&lt;3° suspensión · &lt;15° suspensión angular · &lt;30° ángulo · ≥30° retención',
    det: `La ficha <b>no declara función estructural</b>. La que aparece («${m.func[i]}») está <b>deducida de la geometría</b>, no declarada: no hay dos valores que confrontar, así que el criterio no se puede aplicar.`
  });
  crit.push({
    et: 'Distancia de fuga específica', val: '—', ver: 'no_evaluable',
    cri: '≥ 25 mm/kV sobre Um (ambiente costero) — RETIE',
    det: 'No hay cadena declarada: sin número de unidades ni fuga por unidad no hay fuga total. <b>No es un hueco de la aplicación: es un dato que nadie ha capturado.</b>'
  });
  crit.push({
    et: 'Resistencia de puesta a tierra', val: '—', ver: 'no_evaluable',
    cri: '≤ 20 Ω (criterio adoptado por el proyecto)',
    det: 'Sin medición de tierra. Es el valor que decide si una descarga se drena al terreno o eleva el potencial de la estructura hasta cebar el arco hacia el conductor.'
  });
  crit.push({
    et: 'Vano viento', val: cT ? nf(cT.vViento, 1) + ' m' : '—', ver: 'entrada',
    cri: 'ENTRADA del cálculo de carga transversal, no criterio de aceptación',
    det: `Media de los vanos adyacentes: (${nf(cT ? cT.vAnt : 0, 1)} + ${nf(cT ? cT.vSig : 0, 1)}) / 2. Se muestra porque alimenta la sección 9, no porque haya un umbral que cumplir.`
  });
  crit.push({
    et: 'Vano peso', val: '—', ver: 'no_evaluable',
    cri: 'Sin criterio aplicable mientras falte el dato',
    det: 'Exige la <b>cota de sujeción</b> del conductor en cada apoyo, que este levantamiento no trae. Sin vano peso no hay carga vertical y no hay verificación de arrancamiento.'
  });

  cont.innerHTML = `<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:12px">
    <h4 class="sub2" style="margin:0">${m.nombres[i]}</h4>
    <span class="sello ${m.func[i] === 'Terminal' ? 'rojo' : (m.func[i] === 'Retención' || m.func[i] === 'Ángulo') ? 'ambar' : 'gris'}">${m.func[i]} (deducida)</span>
    <span class="sello gris">función no declarada</span>
    ${i === 1 && L.rico ? '<span class="sello rojo">expediente de falla</span>' : ''}</div>

  <div class="ficha-grilla">
    <div class="ficha-bloque"><h5>Identidad</h5><dl>

      <dt>Orden en la línea</dt><dd>${i + 1} de ${m.nombres.length}</dd>

      <dt>Placa</dt><dd class="pend">pendiente — se captura en campo (F4)</dd>
      <dt>Material</dt><dd class="pend">pendiente — se captura en campo (F4)</dd>

      <dt>Longitud</dt><dd class="reservado">reservado — dato de cliente</dd>

      <dt>Cota de sujeción</dt><dd class="pend">pendiente — se captura en campo (F4)</dd></dl></div>

    <div class="ficha-bloque"><h5>Geometría derivada</h5><dl>
      <dt>Deflexión</dt><dd>${m.defl[i] == null ? H_ : gr(m.defl[i], 1)}</dd>
      <dt>Factor 2·sen(α/2)</dt><dd>${cT && m.defl[i] != null ? '×' + nf(cT.fac, 3) : H_}</dd>
      <dt>Vano anterior</dt><dd>${i > 0 ? nf(m.vanos[i - 1], 1) + ' m' : H_}</dd>
      <dt>Vano siguiente</dt><dd>${i < m.vanos.length ? nf(m.vanos[i], 1) + ' m' : H_}</dd>
      <dt>Vano viento</dt><dd>${cT ? nf(cT.vViento, 1) + ' m' : H_}</dd>
      <dt>Vano peso</dt><dd class="pend">falta la cota de sujeción</dd></dl></div>

    <div class="ficha-bloque"><h5>Inventario del apoyo</h5><dl>
      <dt>Altura total</dt><dd class="pend">pendiente (F4)</dd>
      <dt>Altura libre</dt><dd class="pend">pendiente (F4)</dd>
      <dt>Carga de rotura</dt><dd class="pend">no declarada</dd>
      <dt>Capacidad longitudinal</dt><dd class="pend">no declarada</dd>
      <dt>Crucetas</dt><dd class="pend">pendiente (F4)</dd>
      <dt>Retenidas</dt><dd class="pend">pendiente (F4)</dd></dl></div>

    <div class="ficha-bloque"><h5>Aislamiento y puesta a tierra</h5><dl>
      <dt>Tipo de cadena</dt><dd class="pend">pendiente (F4)</dd>
      <dt>Unidades por cadena</dt><dd class="pend">pendiente (F4)</dd>
      <dt>Fuga por unidad</dt><dd class="pend">pendiente (F4)</dd>
      <dt>Fuga específica</dt><dd>${H_}</dd>
      <dt>Resistencia de tierra</dt><dd class="pend">sin medición</dd>
      <dt>Bajante</dt><dd class="pend">pendiente (F4)</dd></dl></div>

    <div class="ficha-bloque"><h5>Trazabilidad del dato</h5><dl>
      <dt>UUID</dt><dd class="mono">${uuid(i + 1)}</dd>
      <dt>Revisión</dt><dd>r${1 + (i % 3)}</dd>
      <dt>Origen</dt><dd>levantamiento de campo</dd>
      <dt>Capturado por</dt><dd class="pend">pendiente (F4)</dd>
      <dt>Fecha de captura</dt><dd class="pend">pendiente (F4)</dd>
      <dt>Motor que lo calculó</dt><dd>${L.motor}</dd></dl></div>
  </div>

  <h4 class="sub2">Semáforo de criterios de ${m.nombres[i]}</h4>
  <div class="tabla-caja"><table class="tabla">
    <caption>Cinco criterios, y ninguno se llama «incumple»: el sistema señala, dictamina quien firma.
      <b>«No evaluable» no es un fallo de la aplicación: es un hecho sobre los datos</b>, y se muestra con la misma dignidad que un verde.</caption>
    <thead><tr><th>Criterio</th><th>Valor</th><th>Estado</th><th>Contra qué se comparó · qué significa</th></tr></thead>
    <tbody>${crit.map(k => `<tr><td><b>${k.et}</b></td><td class="num ${k.val === '—' ? 'hueco' : 'destaca'}">${k.val}</td>
      <td><span class="sello ${k.ver === 'entrada' ? 'azul' : 'gris'}">${k.ver === 'entrada' ? 'entrada' : 'no evaluable'}</span></td>
      <td class="porq"><b style="color:var(--mut)">${k.cri}</b><br>${k.det}</td></tr>`).join('')}</tbody></table>
    <div class="tabla-nota">0 de 5 criterios evaluables en este apoyo. En toda la línea: <b>0 de ${m.nombres.length} apoyos con veredicto</b> en los dos ejes.</div></div>

  <h4 class="sub2">Evidencia fotográfica de ${m.nombres[i]}</h4>
  ${nFotos ? `<div class="galeria">${Array.from({ length: Math.min(nFotos, 6) }, (_, k) => `<figure>
      <div class="hueco-foto">fotografía ${k + 1}<br>no se incrusta en la maqueta</div>
      <figcaption>${m.nombres[i]} · vista ${['general', 'cruceta', 'base', 'cadena', 'herraje', 'bajante'][k]} · ${nFotos} en total</figcaption></figure>`).join('')}</div>`
      : `<p class="aviso"><b>Este punto declara que no tiene fotografía.</b> No es un fallo de carga: es un hueco del
         levantamiento, y por eso se cuenta${L.rico ? ' — 12 de los 26 puntos están así' : ''}.</p>`}`;
}

/* ══ 4 · EXPEDIENTE DE FALLA ═══════════════════════════════════════════ */
function sec4(m) {
  const L = m.L;
  if (!L.rico && !L.evento) return sec('s4', '4', 'Expediente de falla', 9,
    'Los eventos que abrieron la línea, con la evidencia separada de la conclusión.',
    `<p class="ok"><b>Esta línea no tiene ningún expediente de falla registrado.</b> No es un hueco de la
      aplicación: es el estado de la línea, y por eso se afirma en positivo en vez de dejar la sección en blanco.</p>${corte(10)}`);

  const cron = [
