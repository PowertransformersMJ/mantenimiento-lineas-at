/* ══ Figuras de Fundamentos — dibujadas con los datos REALES de la línea ══ */
const SV = (w, h, inner) => `<svg viewBox="0 0 ${w} ${h}" role="img">${inner}</svg>`;
const TXT = (x, y, t, c = '#8b98a5', s = 10.5, an = 'middle') =>
  `<text x="${x}" y="${y}" fill="${c}" font-size="${s}" text-anchor="${an}" font-family="-apple-system,system-ui,sans-serif">${t}</text>`;

function figCatenaria(m) {
  const t = m.tramos[m.tramos.length - 1], a = t.vmax, f = t.flecha, c = m.L.conductor;
  const W = 620, Hh = 200, x0 = 70, x1 = W - 70, yTop = 40, esc = 108 / f;
  let d = '';
  for (let k = 0; k <= 40; k++) {
    const u = k / 40, X = x0 + (x1 - x0) * u, xr = (u - 0.5) * a;
    const C = t.hTMax / c.masa, y = C * (Math.cosh(xr / C) - Math.cosh(a / (2 * C)));
    d += (k ? 'L' : 'M') + X.toFixed(1) + ' ' + (yTop - y * esc).toFixed(1);
  }
  return SV(W, Hh, `
    <line x1="${x0}" y1="${yTop}" x2="${x1}" y2="${yTop}" stroke="#3a444e" stroke-dasharray="4 3"/>
    <path d="${d}" fill="none" stroke="#f0a500" stroke-width="2.2"/>
    <rect x="${x0 - 9}" y="${yTop}" width="9" height="${Hh - yTop - 26}" fill="#2b353f"/>
    <rect x="${x1}" y="${yTop}" width="9" height="${Hh - yTop - 26}" fill="#2b353f"/>
    <line x1="${(x0 + x1) / 2}" y1="${yTop}" x2="${(x0 + x1) / 2}" y2="${yTop + f * esc}" stroke="#e6edf3" stroke-width="1.2"/>
    <line x1="${(x0 + x1) / 2 - 5}" y1="${yTop + f * esc}" x2="${(x0 + x1) / 2 + 5}" y2="${yTop + f * esc}" stroke="#e6edf3" stroke-width="1.2"/>
    ${TXT((x0 + x1) / 2 + 34, yTop + f * esc / 2 + 4, 'f = ' + nf(f, 2) + ' m', '#e6edf3')}
    ${TXT((x0 + x1) / 2, yTop - 12, 'vano a = ' + nf(a, 1) + ' m')}
    ${TXT(x0 - 14, yTop + 4, 'H', '#f0a500', 11, 'end')}
    ${TXT(x1 + 16, yTop + 4, 'H', '#f0a500', 11, 'start')}
    ${TXT(W / 2, Hh - 8, 'catenaria real con el tiro del estado de ' + m.L.hipotesis.tMax + ' °C · C = H/w = ' + nf(t.hTMax / c.masa, 0) + ' m', '#6f7d8a', 9.6)}`);
}

function figVIR(m) {
  const t = m.tramos.reduce((a, b) => b.nVanos > a.nVanos ? b : a);
  const W = 620, Hh = 168, max = Math.max(...t.vanos), bw = (W - 80) / t.vanos.length;
  let g = '';
  t.vanos.forEach((v, i) => {
    const h = (v / max) * 96, X = 46 + i * bw, dentro = v / t.vir >= 0.7 && v / t.vir <= 1.3;
    g += `<rect x="${(X + 1).toFixed(1)}" y="${(120 - h).toFixed(1)}" width="${(bw - 3).toFixed(1)}" height="${h.toFixed(1)}"
      fill="${dentro ? '#5b8dd9' : '#f0a500'}" opacity=".85" rx="2"/>`;
  });
  const yv = 120 - (t.vir / max) * 96, yhi = 120 - (Math.min(max, t.vir * 1.3) / max) * 96, ylo = 120 - (t.vir * 0.7 / max) * 96;
  return SV(W, Hh, `
    <rect x="42" y="${yhi.toFixed(1)}" width="${W - 78}" height="${(ylo - yhi).toFixed(1)}" fill="rgba(91,141,217,.10)"/>
    ${g}
    <line x1="42" y1="120" x2="${W - 36}" y2="120" stroke="#3a444e"/>
    <line x1="42" y1="${yv.toFixed(1)}" x2="${W - 36}" y2="${yv.toFixed(1)}" stroke="#e6edf3" stroke-width="1.3" stroke-dasharray="5 3"/>
    ${TXT(W - 34, yv - 5, 'VIR ' + nf(t.vir, 1) + ' m', '#e6edf3', 10, 'end')}
    ${TXT(W - 34, yhi - 4, 'banda 0,7 – 1,3 · VIR', '#7fa8d6', 9.6, 'end')}
    ${TXT(W / 2, 142, 'Tramo ' + t.n + ' (' + t.desde + '–' + t.hasta + '): ' + t.nVanos + ' vanos · en ámbar los que caen fuera de banda', '#8b98a5', 10)}
    ${TXT(W / 2, 158, 'un vano fuera de banda invalida la hipótesis del VIR para ese vano', '#6f7d8a', 9.4)}`);
}

function figDeflexion(m) {
  const c = m.cargasT.reduce((a, b) => b.fac > a.fac ? b : a);
  const W = 620, Hh = 210, O = { x: 310, y: 118 }, R = 118;
  const al = (180 - c.defl) / 2, ra = al * Math.PI / 180;
  const A = { x: O.x - R * Math.cos(ra), y: O.y - R * Math.sin(ra) };
  const B = { x: O.x + R * Math.cos(ra), y: O.y - R * Math.sin(ra) };
  const Ln = 92;
  return SV(W, Hh, `
    <line x1="${A.x.toFixed(1)}" y1="${A.y.toFixed(1)}" x2="${O.x}" y2="${O.y}" stroke="#f0a500" stroke-width="2.2"/>
    <line x1="${O.x}" y1="${O.y}" x2="${B.x.toFixed(1)}" y2="${B.y.toFixed(1)}" stroke="#f0a500" stroke-width="2.2"/>
    <path d="M ${(O.x - 40 * Math.cos(ra)).toFixed(1)} ${(O.y - 40 * Math.sin(ra)).toFixed(1)}
             A 40 40 0 0 1 ${(O.x + 40 * Math.cos(ra)).toFixed(1)} ${(O.y - 40 * Math.sin(ra)).toFixed(1)}"
          fill="none" stroke="#5b8dd9" stroke-width="1.3"/>
    ${TXT(O.x, O.y - 50, 'α = ' + gr(c.defl, 1), '#86aae3', 11)}
    <line x1="${O.x}" y1="${O.y}" x2="${O.x}" y2="${(O.y + Ln).toFixed(1)}" stroke="#e05252" stroke-width="2.6" marker-end="url(#fl)"/>
    <defs><marker id="fl" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e05252"/></marker></defs>
    <circle cx="${O.x}" cy="${O.y}" r="6" fill="#f0a500" stroke="#0b0f13" stroke-width="1.6"/>
    ${TXT(O.x + 12, O.y + Ln - 6, 'resultante = 2·T·sen(α/2) = ' + nf(c.quiebre, 0) + ' kgf', '#f08585', 10.5, 'start')}
    ${TXT(A.x - 8, A.y - 6, 'T = ' + nf(c.T, 0) + ' kgf', '#f0a500', 10, 'end')}
    ${TXT(B.x + 8, B.y - 6, 'T = ' + nf(c.T, 0) + ' kgf', '#f0a500', 10, 'start')}
    ${TXT(W / 2, 196, c.nom + ': el quiebre multiplica el tiro por ×' + nf(c.fac, 3) + ' — permanente, con viento y sin él', '#8b98a5', 10)}`);
}

function figBalanceo(m) {
  const W = 560, Hh = 200, O = { x: 250, y: 42 }, esc = 96;
  const ang = m.balanceo * Math.PI / 180;

  return SV(W, Hh, `
    <line x1="${O.x}" y1="${O.y}" x2="${O.x}" y2="${O.y + esc}" stroke="#3a444e" stroke-dasharray="4 3"/>
    <line x1="${O.x}" y1="${O.y}" x2="${P.x.toFixed(1)}" y2="${P.y.toFixed(1)}" stroke="#8b98a5" stroke-width="1.6" stroke-dasharray="3 3"/>
    <line x1="${O.x}" y1="${O.y}" x2="${O.x}" y2="${(O.y + esc * 0.72).toFixed(1)}" stroke="#5b8dd9" stroke-width="2.6"/>
    <line x1="${O.x}" y1="${O.y}" x2="${(O.x + esc * 0.72 * m.q / m.L.conductor.masa).toFixed(1)}" y2="${O.y}" stroke="#f0a500" stroke-width="2.6"/>
    <circle cx="${P.x.toFixed(1)}" cy="${P.y.toFixed(1)}" r="7" fill="#171d24" stroke="#e6edf3" stroke-width="1.6"/>
    <path d="M ${O.x} ${O.y + 44} A 44 44 0 0 0 ${(O.x + 44 * Math.sin(ang)).toFixed(1)} ${(O.y + 44 * Math.cos(ang)).toFixed(1)}" fill="none" stroke="#e05252" stroke-width="1.3"/>
    ${TXT(O.x + 58, O.y + 40, 'φ = ' + gr(m.balanceo, 1), '#f08585', 11, 'start')}
    ${TXT(O.x - 8, O.y + esc * 0.72 + 4, 'peso ' + nf(m.L.conductor.masa, 4) + ' kg/m', '#86aae3', 10, 'end')}
    ${TXT(O.x + esc * 0.72 * m.q / m.L.conductor.masa + 8, O.y - 6, 'empuje ' + nf(m.q, 4) + ' kgf/m', '#f0a500', 10, 'start')}
    ${TXT(W / 2, 172, 'resultante ' + nf(m.w2, 4) + ' kg/m · relación empuje/peso ' + nf(m.q / m.L.conductor.masa, 3), '#8b98a5', 10)}

  const T = (nn, tit, cuerpo) => `<h3 class="sub" data-idx="5.${nn}" id="s5-${nn}"><span class="n">5.${nn}</span> ${tit}</h3>${cuerpo}`;
  const dc = (a, b) => `<div class="dos-col"><div class="mini"><h5>Cómo se calcula</h5><p>${a}</p></div>
    <div class="mini"><h5>Qué vigilar</h5><p>${b}</p></div></div>`;
  const vivo = (t) => `<p class="vivo"><span class="rot">En esta línea, hoy</span>${t}</p>`;

  return sec('s5', '5', 'Fundamentos de cálculo', 12,
    'Nueve conceptos, cada uno con su figura dibujada con los datos de ESTA línea y el valor vivo que sale del mismo motor que produce las tablas. Si la cifra de aquí no coincide con la de la tabla, el error está en el motor, no en la redacción.',
    `${T(1, 'Catenaria — cómo cuelga de verdad el conductor',
      `<p>Un cable colgado entre dos puntos no describe una parábola: describe una <b>catenaria</b>, la curva que
        adopta un hilo flexible bajo su propio peso. La parábola es su aproximación de primer orden y a los vanos

      <div class="figura">${figCatenaria(m)}</div>
      <div class="formula"><i>C</i> <span class="op">=</span> <i>H</i> / <i>w</i>
        <span class="op" style="padding:0 14px">·</span>
        <math><mi>f</mi><mo>=</mo><mi>C</mi><mo>(</mo><mi>cosh</mi><mo>(</mo><mfrac><mi>a</mi><mrow><mn>2</mn><mi>C</mi></mrow></mfrac><mo>)</mo><mo>−</mo><mn>1</mn><mo>)</mo></math></div>
      ${dc('El parámetro <b>C = H/w</b> gobierna la curva: tiro horizontal dividido por masa lineal. Con C y el vano, la flecha sale directa.',

      ${vivo(`En el vano más largo (<b>${nf(tL.vmax, 1)} m</b>, tramo ${tL.n}) el parámetro vale <b>C = ${nf(tL.hTMax / c.masa, 0)} m</b>.

        <b>${nf(m.tramos.reduce((a, b) => b.flecha > a.flecha ? b : a).flechaViento, 2)} m</b> en la dirección de la resultante.`)}`)}

    ${T(3, 'Vano ideal de regulación (VIR) — el vano que representa a todo un tramo',
      `<p>Un tramo de tensión son varios vanos entre dos anclajes, y el conductor se regula de una vez para todos.
        El VIR es el vano único que se comporta como el conjunto: <b>√(Σa³ / Σa)</b>. Cada tramo se calcula con el
        suyo, jamás con uno solo para toda la línea.</p>
      <div class="figura">${figVIR(m)}</div>
      <div class="formula"><math><msub><mi>a</mi><mi>r</mi></msub><mo>=</mo><msqrt><mfrac><mrow><mo>∑</mo><msup><mi>a</mi><mn>3</mn></msup></mrow><mrow><mo>∑</mo><mi>a</mi></mrow></mfrac></msqrt></math></div>
      ${dc('Los cortes de tramo los ponen los anclajes: terminal, retención y ángulo. Los empalmes no cortan nada porque no sostienen el conductor.',
        'Si un vano se sale de la banda <b>0,7 – 1,3 · VIR</b>, la hipótesis pierde validez para ese vano y el tramo debería subdividirse.')}
      ${vivo(`Los VIR de esta línea van de <b>${nf(Math.min(...m.tramos.map(t => t.vir)), 1)} m</b> (tramo ${m.tramos.reduce((a, b) => b.vir < a.vir ? b : a).n})
        a <b>${nf(Math.max(...m.tramos.map(t => t.vir)), 1)} m</b> (tramo ${m.tramos.reduce((a, b) => b.vir > a.vir ? b : a).n}) — un factor de
        <b>${nf(Math.max(...m.tramos.map(t => t.vir)) / Math.min(...m.tramos.map(t => t.vir)), 1)}</b>. Un VIR único de línea sería de ${nf(virLinea, 2)} m
        y daría flechas y tiros equivocados en los dos extremos. <b>${fuera} de ${m.vanoAvano.length} vanos</b> caen fuera de banda.`)}`)}

    ${T(4, 'Tensiones y estados — las cuatro fotografías que hay que tomar',
      `<p>El conductor no tiene un tiro: tiene uno por cada condición. Se evalúan siempre cuatro, y cada una vigila
        una cosa distinta. Confundirlas es el error clásico: la flecha se saca del estado caliente y el tiro de diseño del frío o del viento.</p>
      <div class="tabla-caja"><table class="tabla"><thead><tr><th>Estado</th><th>Condición</th><th>Qué vigila</th></tr></thead><tbody>
        <tr><td><b>EDS</b></td><td>${h.tEds} °C, sin viento</td><td class="porq">Tensión de servicio permanente: fatiga y vibración eólica.</td></tr>
        <tr><td><b>Máxima temperatura</b></td><td>${h.tMax} °C, sin viento</td><td class="porq"><b>Flecha máxima</b> → distancia mínima al terreno.</td></tr>
        <tr><td><b>Máximo viento</b></td><td>${h.viento} km/h a ${h.tViento} °C</td><td class="porq"><b>Tiro máximo</b> → carga sobre estructuras y herrajes.</td></tr>
        <tr><td><b>Mínima temperatura</b></td><td>${h.tMin} °C, sin viento</td><td class="porq">Tiro en frío: esfuerzos en retenciones y anclajes.</td></tr>
      </tbody></table></div>
      ${vivo(`El EDS se fija en el <b>${h.eds} % de la RTS = ${nf(c.rts * h.eds / 100)} kgf</b> y sale idéntico en los
        ${m.tramos.length} tramos: no es que no haya desequilibrio, es que <b>el modelo usa un solo EDS por línea</b>.
        Ese cero es del modelo, no del terreno.`)}`)}

    ${T(5, 'Ecuación de cambio de estado — pasar de un estado a otro',
      `<p>Es el corazón del cálculo: conocido un estado (H₁, w₁, t₁), predice el tiro H₂ en cualquier otro. No tiene
        solución cerrada útil —es una cúbica— y se resuelve numéricamente.</p>
      <div class="formula"><i>H</i><sub>2</sub><sup>2</sup> <span class="op">·</span> (<i>H</i><sub>2</sub> <span class="op">+</span> <i>A</i>) <span class="op">=</span> <i>B</i></div>
      ${dc('Por <b>bisección</b>, hasta 200 iteraciones, con expansión previa del extremo superior hasta acotar la raíz. El vano que entra es el <b>VIR del tramo</b>, no un vano cualquiera.',
        'Los términos A y B llevan dentro el módulo elástico <b>E</b> y la sección <b>S</b>. Si E está en duda, todo el resto lo está.')}
      ${vivo(`Aquí se calcula con <b>E = ${nf(c.E)} kg/mm²</b>, pero la documentación del conductor trae también
        <b>${nf(c.Ealt)} kg/mm²</b>. <b>Ese conflicto no es académico:</b> decide si un tramo cumple o no, y por eso la
        ficha real del proveedor está en la lista de verificaciones pendientes de la sección 4.`)}`)}

    ${T(6, 'Deflexión y quiebre — por qué un ángulo cuesta tanto',
      `<p>Cuando la línea cambia de dirección, los dos tiros que llegan al apoyo no se cancelan: dejan una resultante
        que apunta hacia el interior del ángulo. Su tamaño es <b>2·T·sen(α/2)</b>, y no depende del viento: está ahí
        siempre, día y noche.</p>
      <div class="figura">${figDeflexion(m)}</div>
      <div class="formula"><i>R</i> <span class="op">=</span> 2 <span class="op">·</span> <i>T</i> <span class="op">·</span> sen(<i>α</i>/2)</div>
      ${dc('α es la deflexión: cuánto se desvía la línea respecto a seguir recta. El factor <b>2·sen(α/2)</b> vale 1 justo en 60°.',
        'Por encima de 60° el apoyo recibe <b>más carga que el propio tiro del conductor</b>. Un apoyo así dimensionado «por el tiro» está dimensionado por poco más de la mitad.')}
      ${vivo(`El mayor quiebre es <b>${cMax.nom} con ${gr(cMax.defl, 1)}</b>: factor <b>×${nf(cMax.fac, 3)}</b>, o sea
        <b>${nf((cMax.fac - 1) * 100, 1)} % más carga transversal</b> que el tiro. En toda la línea hay
        <b>${m.cargasT.filter(x => x.fac > 1).length} apoyos</b> que amplifican por encima de 1 y
        <b>${m.defl.filter(d => d != null && d >= 30).length} anclajes</b> deducidos por geometría.`)}`)}

    ${T(7, 'Vanos característicos — el de viento y el de peso',
      `<p>Para repartir cargas no sirve «el vano»: sirven dos vanos ficticios. El <b>vano viento</b> es la media de los
        dos adyacentes y reparte el empuje horizontal. El <b>vano peso</b> es la distancia entre los puntos más bajos

        'El vano peso <b>exige la cota de sujeción</b>. Sin ella no hay carga vertical, no hay verificación de arrancamiento y no hay veredicto.')}
      ${vivo(`El mayor vano viento es <b>${nf(Math.max(...m.cargasT.map(x => x.vViento)), 1)} m</b> en

    ${T(8, 'Ampacidad — cuánta corriente aguanta de verdad',

      <div class="formula"><i>I</i> <span class="op">=</span> √( (<i>q</i><sub>c</sub> <span class="op">+</span> <i>q</i><sub>r</sub> <span class="op">−</span> <i>q</i><sub>s</sub>) / <i>R</i>(<i>T</i><sub>c</sub>) )</div>
      ${dc('IEEE Std 738, régimen permanente. La convección toma <b>el mayor</b> de tres correlaciones (viento bajo, viento alto, natural) corregidas por altitud.',
        'El viento pesa más que la temperatura ambiente. Un día en calma le quita al conductor cerca de un cuarto de su capacidad.')}

        El Niño con viento en calma baja a <b>544 A</b>. La tabla completa está en la sección 7.`)}`)}

    ${T(9, 'Distancia al terreno — el criterio que este levantamiento no puede cerrar',
      `<p>El despeje mínimo depende de la tensión, del uso del suelo bajo la línea y de la flecha en la condición más
        desfavorable. Es el criterio con más consecuencias del informe y, a la vez, el único que aquí no se puede emitir.</p>
      <div class="figura">${figGalibo(m)}</div>
      ${dc('Se compara la cota del conductor en el punto más bajo del vano contra la cota del terreno bajo él, en el estado de ' + h.tMax + ' °C.',
        'Con cotas de <b>±8 m</b> declarados, el margen de error es varias veces el propio criterio. Declararlo verificado sería fabricar confianza.')}
      ${vivo(`<b>El despeje al terreno queda sin verificar en los ${m.vanos.length} vanos.</b> No por falta de fórmula:
        por falta de cota firmable. Es el ejemplo más claro de lo que este sistema no demuestra — y de por qué tiene

    <h3 class="sub" data-idx="5.10" id="s5-10"><span class="n">5.10</span> Marco normativo aplicado</h3>
    <div class="tabla-caja"><table class="tabla"><thead><tr><th>Asunto</th><th>Referencia</th><th>Cómo se usa aquí</th></tr></thead><tbody>
      <tr><td><b>Distancias mínimas al terreno</b></td><td class="destaca">RETIE Libro 3, Tabla 3.10.2.a</td><td class="porq">Fuente del criterio de despeje. No se aplica todavía: falta cota firmable.</td></tr>
      <tr><td><b>Ampacidad</b></td><td class="destaca">IEEE Std 738</td><td class="porq">Balance térmico en régimen permanente, escenario a escenario.</td></tr>
      <tr><td><b>Distancia de fuga</b></td><td class="destaca">RETIE / IEC 60815</td><td class="porq">Criterio de fuga específica por ambiente. Sin cadena declarada, no evaluable.</td></tr>
      <tr><td><b>Tope de tiro</b></td><td><span class="sello ambar">sin decidir</span></td><td class="porq">El motor calcula contra el ${nf(TOPE_MOTOR * 100)} % de la RTS; la doctrina interna pide el ${nf(TOPE_DOCTRINA * 100)} %. <b>Mientras no se decida, el veredicto viaja siempre con su criterio.</b></td></tr>
      <tr><td><b>Geodesia</b></td><td class="destaca">WGS84 · Vincenty</td><td class="porq">Verificado contra constantes publicadas (1° de latitud = 110.574,389 m).</td></tr>
    </tbody></table></div>
    ${corte(16)}`);

const SIN_COND = ['Falta el <b>conductor</b> declarado: sección, diámetro, masa lineal, RTS, módulo elástico y coeficiente de dilatación.',

  'Con eso capturado, esta sección se llena sola: no hay nada más que hacer en la aplicación.'];

/* ══ 6 · CÁLCULO MECÁNICO ══════════════════════════════════════════════ */
function sec6(m) {
  const c = m.L.conductor, h = m.L.hipotesis;
  if (!c) return sec('s6', '6', 'Cálculo mecánico', 17, 'Tiros y flechas tramo a tramo, y la relación de cada vano con el VIR que lo representa.',
    noEval('Sección no evaluable', 'No se puede calcular ni un tiro en esta línea.',
      'No es que el resultado sea malo: es que no hay entrada. Se declara en vez de ocultarse, para que el hueco siga contando cuando haya veinte líneas en cartera.', SIN_COND) + corte(18));

  const topeMotor = c.rts * TOPE_MOTOR, topeDoc = c.rts * TOPE_DOCTRINA;
  const excMotor = m.tramos.filter(t => t.pico > topeMotor), excDoc = m.tramos.filter(t => t.pico > topeDoc);
  const fuera = m.vanoAvano.filter(v => v.fuera);
  const tL = m.tramos.reduce((a, b) => b.vmax > a.vmax ? b : a);
  const parab = M.flechaPar(c.masa, tL.vmax, tL.hTMax), cat = M.flechaCat(c.masa, tL.vmax, tL.hTMax);
  const anclajes = m.func.filter(f => f === 'Retención' || f === 'Ángulo').length;
  const sello = `<span class="sello-calculo"><b>Sello de trazabilidad:</b> motor ${m.L.motor} · hipótesis «${h.nombre}» (${h.revision}, ${h.fecha}) ·
    conductor ${c.material} ${c.codigo}, procedencia ${c.procedencia} · E = ${nf(c.E)} kg/mm² · calculado en pantalla al abrir.</span>`;

  return sec('s6', '6', 'Cálculo mecánico', 17,
    'Tiros y flechas tramo a tramo, y la relación de cada vano con el VIR que lo representa. Todo sale del mismo motor que alimenta las cifras vivas de la sección 5.',
    `<div class="kpis k5">
      <div class="kpi"><div class="kpi-v" style="font-size:15px">${c.material} ${c.codigo}</div><div class="kpi-l">Conductor</div><div class="kpi-s">${nf(c.mcm, 1)} MCM · ${c.hilos} hilos · ${nf(c.seccion, 1)} mm²</div></div>
      <div class="kpi"><div class="kpi-v">${nf(c.rts)}<small> kgf</small></div><div class="kpi-l">RTS</div><div class="kpi-s">Tope motor ${nf(topeMotor)} · doctrina ${nf(topeDoc)}</div></div>
      <div class="kpi"><div class="kpi-v">${nf(M.vir(m.vanos), 1)}<small> m</small></div><div class="kpi-l">VIR de línea (referencia)</div><div class="kpi-s">No se usa: cada tramo va con el suyo</div></div>
      <div class="kpi"><div class="kpi-v">${m.tramos.length} / ${anclajes}</div><div class="kpi-l">Tramos / anclajes</div><div class="kpi-s">Reparto ${m.tramos.map(t => t.nVanos).join('-')}</div></div>
      <div class="kpi"><div class="kpi-v">718<small> A</small></div><div class="kpi-l">Ampacidad IEEE 738</div><div class="kpi-s">Escenario de referencia, ${c.tMaxMaterial} °C</div></div>
    </div>

    <h3 class="sub" data-idx="6.1" id="s6-1"><span class="n">6.1</span> Estados mecánicos por tramo de tensión</h3>
    <div class="tabla-caja"><table class="tabla">
      <caption>Conductor ${c.material} ${c.codigo} · RTS ${nf(c.rts)} kgf · EDS ${h.eds} % a ${h.tEds} °C ·
        viento ${h.viento} km/h a ${h.tViento} °C. Tiros en kgf; la flecha es la del vano más largo del tramo, por catenaria exacta.</caption>
      <thead><tr><th>#</th><th>Tramo</th><th>Vanos</th><th>Vano máx (m)</th><th>VIR (m)</th>
        <th>EDS</th><th>${h.tMax} °C</th><th>Viento</th><th>${h.tMin} °C</th><th>Pico</th><th>% RTS</th><th>Flecha (m)</th></tr></thead>
      <tbody>${m.tramos.map(t => `<tr class="${t.pico > topeDoc ? 'fuera' : ''}">
        <td class="num">${t.n}</td><td><b>${t.desde} → ${t.hasta}</b></td><td class="num">${t.nVanos}</td>
        <td class="num">${nf(t.vmax, 1)}</td><td class="num">${nf(t.vir, 1)}</td>
        <td class="num">${nf(t.Heds)}</td><td class="num">${nf(t.hTMax)}</td><td class="num">${nf(t.hVien)}</td><td class="num">${nf(t.hTMin)}</td>
        <td class="num destaca">${nf(t.pico)}</td><td class="num ${t.pico > topeDoc ? 'destaca' : ''}">${nf(t.pct, 1)} %</td>
        <td class="num">${nf(t.flecha, 2)}</td></tr>`).join('')}</tbody></table>
      <div class="tabla-nota">Las filas tintadas superan el <b>${nf(TOPE_DOCTRINA * 100)} %</b> de la doctrina interna, no el ${nf(TOPE_MOTOR * 100)} % con el que calcula el motor.</div></div>
    ${sello}

    <p class="${excMotor.length ? 'alerta' : 'ok'}"><b>Contra el criterio del motor (${nf(TOPE_MOTOR * 100)} % de la RTS = ${nf(topeMotor)} kgf):</b>
      ${excMotor.length ? excMotor.length + ' tramo(s) por encima — ' + excMotor.map(t => t.n).join(', ') + '.' : 'ningún tramo lo supera. El máximo es ' + nf(Math.max(...m.tramos.map(t => t.pct)), 1) + ' %.'}</p>
    <p class="${excDoc.length ? 'alerta' : 'ok'}"><b>Contra la doctrina interna (${nf(TOPE_DOCTRINA * 100)} % de la RTS = ${nf(topeDoc)} kgf):</b>
      ${excDoc.length ? excDoc.length + ' tramo(s) por encima — ' + excDoc.map(t => 'tramo ' + t.n + ' con ' + nf(t.pct, 1) + ' %').join(', ') + '.' : 'ningún tramo lo supera.'}</p>
    <p class="aviso"><b>Esta es la razón por la que el tope no puede quedar sin decidir.</b> La misma tabla, con las mismas
      cifras, dice «todo dentro» o «hay tramos fuera» según cuál de los dos criterios se adopte. Por eso en este sistema

    <h3 class="sub" data-idx="6.2" id="s6-2"><span class="n">6.2</span> Vano a vano</h3>

        <td class="num">${nf(v.vano, 1)}</td><td class="num">${nf(v.vir, 1)}</td>
        <td class="num ${v.fuera ? 'destaca' : ''}">${nf(v.rel, 3)}</td>
        <td class="num">${nf(v.flecha, 2)}</td><td class="num">${nf(v.long, 2)}</td>
        <td><span class="sello ${v.fuera ? 'ambar' : 'verde'}">${v.fuera ? 'fuera de banda' : 'en banda'}</span></td></tr>`).join('')}</tbody></table>
      <div class="tabla-nota"><b>${fuera.length} de ${m.vanoAvano.length} vanos fuera de banda.</b> Es el aviso de ingeniería más repetido de la línea:
        lo que distingue una línea calculada de una línea calculada bien.</div></div>

    <h3 class="sub" data-idx="6.3" id="s6-3"><span class="n">6.3</span> Control: catenaria contra parábola</h3>

      <thead><tr><th>Vano de control</th><th>Tiro (kgf)</th><th>Flecha parábola (m)</th><th>Flecha catenaria (m)</th><th>Diferencia</th><th>Lectura</th></tr></thead>
      <tbody><tr><td><b>${tL.desde} → ${tL.hasta}, ${nf(tL.vmax, 1)} m</b></td><td class="num">${nf(tL.hTMax)}</td>

        <td class="num">${nf(Math.abs(cat - parab) / cat * 100, 3)} %</td>
        <td class="porq">A estos vanos la parábola es perfectamente utilizable. La catenaria se reserva para vanos largos y para auditar.</td></tr></tbody></table></div>

    <h3 class="sub" data-idx="6.4" id="s6-4"><span class="n">6.4</span> Umbrales y criterios</h3>
    <div class="tabla-caja"><table class="tabla">

        <tr><td><b>Distancia al terreno</b></td><td class="hueco">—</td><td class="hueco">—</td><td><span class="sello gris">no evaluable</span></td>
          <td class="porq">Cotas de GPS de mano con ±8 m declarados. <span class="umbral-fuente">RETIE Libro 3, Tabla 3.10.2.a</span></td></tr>
        <tr><td><b>Capacidad de los apoyos</b></td><td class="hueco">—</td><td class="hueco">—</td><td><span class="sello gris">no evaluable</span></td>
          <td class="porq">0 de ${m.nombres.length} apoyos declaran carga de rotura o capacidad longitudinal. <span class="umbral-fuente">ficha del fabricante del apoyo</span></td></tr>

    ${corte(19)}`);

/* ══ 7 · TÉRMICA ═══════════════════════════════════════════════════════ */
const ESCEN = [
  { et: 'Noche fresca', ta: 24, v: 0.61, sol: 0, amp: 838, nota: 'Sin sol y con el ambiente abajo: la mejor hora del conductor. Sirve de techo, no de criterio de despacho.' },
  { et: 'Día típico', ta: 32, v: 0.61, sol: 1000, amp: 718, ref: true, nota: 'Escenario de REFERENCIA: contra este se mide todo lo que la línea pierde en los demás.' },
  { et: 'Día caluroso', ta: 38, v: 0.61, sol: 1000, amp: 676, nota: 'Seis grados más de ambiente. Ni un día raro: una tarde de verano cualquiera.' },
  { et: 'El Niño, viento en calma', ta: 40, v: 0.20, sol: 1000, amp: 544, nota: 'Ambiente arriba Y aire quieto a la vez. Coincide con los meses de mayor demanda: la capacidad cae justo cuando hace falta.' },
];
function sec7(m) {
  const c = m.L.conductor, kv = m.L.kv;
  if (!c) return sec('s7', '7', 'Comportamiento térmico', 20, 'Cuánta corriente aguanta la línea según el clima, y cuánto pierde en el peor escenario.',
    noEvalCorto('No se puede calcular la capacidad de transporte.',
      'La ampacidad es un balance térmico: depende del material, la sección y el diámetro del conductor.') + corte(21));

  const ref = ESCEN.find(e => e.ref), mej = ESCEN.reduce((a, b) => b.amp > a.amp ? b : a), peor = ESCEN.reduce((a, b) => b.amp < a.amp ? b : a);
  const mva = (a) => Math.sqrt(3) * kv * a / 1000;
  const R = (T) => c.r20 * (1 + c.beta * (T - 20));
  const notaT = { 20: 'Temperatura de catálogo. Es la única fila confrontable con la ficha del fabricante.', 50: 'Conductor cargado en un día corriente.', 75: 'Límite continuo del ACSR: por encima, el aluminio se recuece y no vuelve.', 90: 'Límite continuo de las aleaciones (AAAC / ACAR). Para un ACSR ya es zona de daño permanente.' };

  return sec('s7', '7', 'Comportamiento térmico', 20,
    'Cuánta corriente aguanta esta línea según el clima. La ampacidad de placa es engañosa: aquí se calcula contra condiciones declaradas, escenario a escenario.',
    `<p class="alerta"><b>De la mejor hora a la peor, la línea pierde el ${nf((mej.amp - peor.amp) / mej.amp * 100, 1)} % de su capacidad</b>
      (${nf(mej.amp)} A en «${mej.et}» frente a ${nf(peor.amp)} A en «${peor.et}»). Y el peor escenario coincide con los meses
      de mayor demanda: la capacidad cae justo cuando hace falta.</p>

    <h3 class="sub" data-idx="7.1" id="s7-1"><span class="n">7.1</span> Escenarios de clima adoptados</h3>
    <div class="tabla-caja"><table class="tabla">
      <caption>Conductor a ${c.tMaxMaterial} °C · ε = α = 0,5 · nivel del mar. La fila azul es la de referencia: contra ella se mide el derrateo.</caption>
      <thead><tr><th>Escenario</th><th>Ambiente</th><th>Viento</th><th>Sol</th><th>Ampacidad</th><th>Potencia</th><th>Pierde</th><th>Qué es este escenario</th></tr></thead>
      <tbody>${ESCEN.map(e => `<tr class="${e.ref ? 'refer' : ''}">
        <td><b>${e.et}</b>${e.ref ? ' <span class="sello azul">referencia</span>' : ''}</td>
        <td class="num">${nf(e.ta)} °C</td><td class="num">${nf(e.v, 2)} m/s</td><td class="num">${nf(e.sol)} W/m²</td>
        <td class="num destaca">${nf(e.amp)} A</td><td class="num">${nf(mva(e.amp), 1)} MVA</td>
        <td class="num ${e.amp < ref.amp ? 'destaca' : ''}">${e.amp === ref.amp ? '—' : (e.amp > ref.amp ? '+' : '−') + nf(Math.abs(e.amp - ref.amp) / ref.amp * 100, 1) + ' %'}</td>
        <td class="porq">${e.nota}</td></tr>`).join('')}</tbody></table>
      <div class="tabla-nota">Los escenarios son <b>adoptados por este proyecto</b>, no cifras de norma. Están declarados fuera del cálculo para que se puedan discutir sin tocar el motor.</div></div>

    <h3 class="sub" data-idx="7.2" id="s7-2"><span class="n">7.2</span> Resistencia en corriente continua por temperatura</h3>
    <div class="tabla-caja"><table class="tabla">
      <caption>R(T) = R₂₀ · (1 + β·(T − 20)), con β = ${nf(c.beta, 5)} 1/°C para ${c.material}. Verificado contra tabla de fabricante: 1,3 % de desviación.</caption>
      <thead><tr><th>Temperatura</th><th>Resistencia</th><th>Qué representa esa temperatura</th></tr></thead>
      <tbody>${[20, 50, 75, 90].map(T => `<tr class="${T === c.tMaxMaterial ? 'excede' : ''}">
        <td class="num"><b>${T} °C</b>${T === c.tMaxMaterial ? ' <span class="sello rojo">límite del material</span>' : ''}</td>
        <td class="num destaca">${nf(R(T), 4)} Ω/km</td><td class="porq">${notaT[T]}</td></tr>`).join('')}</tbody></table></div>

    <ul class="hallazgos">
      <li class="atencion"><b>Peor escenario «${peor.et}» (${nf(peor.ta)} °C, viento ${nf(peor.v, 2)} m/s).</b>
        La capacidad baja a ${nf(peor.amp)} A, o sea ${nf(mva(peor.amp), 1)} MVA. No es un fallo del cálculo: es que en calma
        la refrigeración depende casi solo de la radiación.</li>
      <li class="aviso"><b>El viento pesa más que el ambiente.</b> Pasar de 0,61 a 0,20 m/s cuesta más capacidad que subir
        ocho grados el ambiente. Por eso el escenario en calma se muestra aparte y no se promedia con los otros.</li>
      <li class="info"><b>El límite de ${c.tMaxMaterial} °C del ${c.material} es de material, no de catálogo.</b>

      <li class="info"><b>La emisividad y la absortividad se toman en 0,5</b>, el punto medio del rango documentado
        (0,23 nuevo … 0,91 envejecido). No es una cobardía: es la hipótesis honesta mientras nadie mida.</li>
    </ul>
    ${corte(21)}`);
}

/* ══ 9 · CARGAS SOBRE ESTRUCTURAS ══════════════════════════════════════ */
function sec9(m) {
  const c = m.L.conductor, h = m.L.hipotesis;
  if (!c) return sec('s9', '9', 'Cargas sobre las estructuras', 24, 'Los dos ejes de carga que recibe cada apoyo, que nunca se suman entre sí.',
    noEvalCorto('No se puede repartir ninguna carga sobre los apoyos.',
      'La transversal sale del tiro y del empuje del viento; la longitudinal, de la diferencia de tiros entre tramos.') +
    `<p class="aviso"><b>Ojo con lo que esto NO significa.</b> Que no haya carga calculada no quiere decir que los apoyos

  const anclas = Lg.filter(x => x.esAncla && !x.esTerminal).length;
  const noConcl = Lg.filter(x => x.sentido === 'no concluyente' && x.esAncla && !x.esTerminal).length;
  const tendido = Math.max(...m.tramos.map(t => t.pico));

  const notasT = [
    ['aviso', T.length + ' de ' + T.length + ' apoyos sin capacidad declarada',
      'El sistema sabe cuánta carga <b>recibe</b> cada apoyo, pero no cuánto <b>aguanta</b>: ninguna ficha declara carga de rotura ni las dos alturas. Es el hueco más caro que tiene esta línea, y es un hecho sobre los datos, no un fallo de la aplicación.'],
    ['aviso', 'El quiebre y el viento se suman como escalares, no como vectores',
      'No son exactamente colineales. La suma es conservadora en la mayoría de los casos y no lo es en todos: se declara para que quien firme sepa qué está leyendo.'],
    ['info', 'La carga transversal del quiebre es permanente',
      'No depende del viento. Está ahí de noche, en calma y en mantenimiento. Los ' + ampl + ' apoyos que amplifican por encima de 1 la reciben siempre.'],
  ];
  const notasL = [
    ['aviso', 'El desequilibrio en el estado EDS sale cero exacto en todas las fronteras',
      'Es un <b>cero del modelo</b>, no una medición: el proyecto usa un solo EDS por línea. Se declara para que nadie lo lea como «aquí no hay desequilibrio».'],
    ['atencion', noConcl + ' anclaje con sentido no concluyente',

    ['info', 'El eje longitudinal NO se suma con el transversal',

  const K = (v, l, s, cl) => `<div class="kpi"><div class="kpi-v ${cl || ''}">${v}</div><div class="kpi-l">${l}</div><div class="kpi-s">${s}</div></div>`;

  return sec('s9', '9', 'Cargas sobre las estructuras', 24,
    'La sección más pesada del informe, y la que más disciplina exige: son DOS ejes de carga y no se suman nunca. Arriba el transversal; abajo el longitudinal.',

        <th>Tiro (kgf)</th><th>Quiebre (kgf)</th><th>Viento (kgf)</th><th>Total (kgf)</th><th>Utilización</th><th>Estado</th></tr></thead>
      <tbody>${T.map((x, i) => `<tr class="${x.fac > 1 ? 'fuera' : ''}">
        <td class="num">${i + 1}</td><td><b>${x.nom}</b></td><td>${x.func}</td>

  const avisos = [
    ['Conductores por circuito', 'No está declarado cuántos conductores lleva el circuito. Sin ese número, la longitud NO se multiplica: un factor 3 inventado son kilómetros de cable que alguien compra.'],
    ['Crucetas', 'Exige inventario por apoyo (tipo, longitud, material). Se captura en campo (F4).'],
    ['Retenidas y anclajes de tierra', 'Exige inventario por apoyo y geometría de la retenida. Se captura en campo (F4).'],
    ['Herrajes y grapas', 'Exige el tipo de cadena y el esquema de amarre por apoyo. Se captura en campo (F4).'],
    ['Aisladores', 'Exige número de unidades por cadena, que hoy no está declarado en ninguna ficha.'],
    ['Excavación y cimentación', 'Depende del tipo de apoyo y del terreno. Ninguno de los dos está declarado.'],
  ];

  const cuerpoCont = c ? (() => {
    const recto = m.vanos.reduce((a, x) => a + x, 0);
    const real = m.vanoAvano.reduce((a, v) => a + v.long, 0);
    return `<tr><td><b>Longitud de conductor por catenaria</b></td><td class="num destaca">${nf(real, 1)}</td><td>m por conductor</td>
      <td class="porq">Suma de la longitud de catenaria de cada vano con el tiro EDS de SU tramo — no la suma de vanos rectos.</td></tr>
      <tr><td><b>Suma de vanos rectos</b></td><td class="num">${nf(recto, 1)}</td><td>m</td>
      <td class="porq">Referencia. Es la cifra que sale si se ignora la curva: se queda corta justo en los vanos largos, que son los que más cable llevan.</td></tr>
      <tr><td><b>Sobrelargo por catenaria</b></td><td class="num destaca">${nf(real - recto, 2)}</td><td>m (${nf((real / recto - 1) * 100, 3)} %)</td>
      <td class="porq">La diferencia entre las dos filas anteriores. Pequeña en porcentaje, real en metros.</td></tr>
      <tr><td><b>Longitud total a comprar</b></td><td class="num hueco">—</td><td class="hueco">—</td>
      <td class="porq"><b>No se publica.</b> Falta el número de conductores por circuito, y multiplicar por un 3 supuesto sería fabricar un pedido.</td></tr>`;
  })() : '';

  return sec('s10', '10', 'Memoria de cantidades', 28,
    'Lo que se puede cuantificar con la geometría, y —con el mismo peso— lo que todavía no. Un BOM inventado es peor que no tener BOM, porque alguien compra con él.',
    `${c ? `<h3 class="sub" data-idx="10.1" id="s10-1"><span class="n">10.1</span> Cantidades continuas</h3>
    <div class="tabla-caja"><table class="tabla">
      <caption>Materiales que se miden en longitud. Con el tiro EDS de cada tramo, calculado en esta misma página.</caption>
      <thead><tr><th>Concepto</th><th>Cantidad</th><th>Unidad</th><th>De dónde sale</th></tr></thead>
      <tbody>${cuerpoCont}</tbody></table></div>` : `<h3 class="sub" data-idx="10.1" id="s10-1"><span class="n">10.1</span> Cantidades continuas</h3>
    ${noEvalCorto('La longitud real de conductor no se puede calcular.',
      'La longitud por catenaria necesita el tiro de cada tramo. Sin él solo queda la suma de vanos rectos, que se queda corta justo donde más cable hay.')}`}

    <h3 class="sub" data-idx="10.2" id="s10-2"><span class="n">10.2</span> Conteos por función de apoyo</h3>
    <div class="tabla-caja"><table class="tabla">
      <caption>Elementos que se cuentan. Los empalmes van aparte a propósito.</caption>
      <thead><tr><th>Concepto</th><th>Cantidad</th><th>Unidad</th><th>De dónde sale</th></tr></thead>
      <tbody>${cuerpoConteos}</tbody></table></div>

    <h3 class="sub" data-idx="10.3" id="s10-3"><span class="n">10.3</span> Lo que todavía NO se puede cuantificar</h3>
    <p>Esta lista no es un apéndice: pesa lo mismo que la tabla de arriba. Es lo que falta y por qué —no una estimación—,
      porque una cantidad inventada entra en una orden de compra y ya no vuelve.</p>
    <ul class="hallazgos">${avisos.map(([t, d]) => `<li class="aviso"><b>${t}.</b> ${d}</li>`).join('')}</ul>
    ${corte(29)}`);
}

/* ══ 11 · EXPORTACIÓN ══════════════════════════════════════════════════ */
function sec11(m) {
  const L = m.L, c = L.conductor;
  const B = (fmt, tit, sub, off) => `<button class="descarga"${off ? ' disabled' : ''} data-desc="${tit}">
    <span class="fmt">${fmt}</span><span><b>${tit}</b><i>${sub}</i></span></button>`;
  return sec('s11', '11', 'Exportación y anexos', 30,
    'Los mismos datos, en el formato que pide cada destino. Cada archivo lleva pegada su procedencia: de dónde sale, con qué hipótesis y con qué versión del motor.',
    `<h3 class="sub" data-idx="11.1" id="s11-1"><span class="n">11.1</span> Levantamiento</h3>
    <div class="descargas">
      ${B('GPX 1.1', 'Puntos y traza', 'Para GPS de mano y aplicaciones de campo')}
      ${B('KML', 'Traza para Google Earth', 'Con los tramos coloreados y las etiquetas de apoyo')}
      ${B('CSV', 'Tabla para Excel es-CO', 'Coma decimal y punto y coma: abre sin pelear con el idioma')}
      ${B('CSV', 'Crudo RFC 4180', 'Punto decimal y coma separadora, para procesar')}
    </div>
    <h3 class="sub" data-idx="11.2" id="s11-2"><span class="n">11.2</span> Cálculo</h3>
    <div class="descargas">
      ${B('CSV', 'Verificación mecánica', 'Tramos, estados, % RTS y flechas', !c)}
      ${B('CSV', 'Memoria de cantidades', 'Continuas, conteos y lo que falta', false)}
      ${B('HTML', 'Informe completo imprimible', 'Este mismo documento, entero, y se abre sin internet')}
      ${B('PDF', 'Informe firmado', 'Requiere la hipótesis congelada', !(L.hipotesis && L.hipotesis.congelada))}
    </div>
    ${!(L.hipotesis && L.hipotesis.congelada) ? `<p class="aviso"><b>El informe firmado está deshabilitado a propósito.</b>
      Mientras la hipótesis no esté congelada, un PDF con aspecto de definitivo es exactamente lo que este sistema
      no se permite producir. El botón no se oculta: se muestra apagado, con el motivo al lado.</p>` : ''}

    <h3 class="sub" data-idx="11.3" id="s11-3"><span class="n">11.3</span> Procedencia y completitud del dato</h3>
    <div class="tabla-caja"><table class="tabla">
      <thead><tr><th>Comprobación</th><th>Resultado</th><th>Qué implica</th></tr></thead><tbody>
        <tr><td><b>Puntos con coordenada</b></td><td class="num destaca">${m.nombres.length} / ${m.nombres.length}</td><td class="porq">Todos ubicados. La precisión declarada es ±${L.rico ? 8 : 11} m.</td></tr>
        <tr><td><b>Puntos con cota utilizable</b></td><td class="num" style="color:#f08585">0 / ${m.nombres.length}</td><td class="porq">GPS de mano: no sirve para flecha, gálibo ni distancia de seguridad.</td></tr>
        <tr><td><b>Puntos con hora de captura</b></td><td class="num destaca">${m.nombres.length} / ${m.nombres.length}</td><td class="porq">Permite reconstruir el recorrido de la cuadrilla.</td></tr>
        <tr><td><b>Puntos sin nombre canónico</b></td><td class="num destaca">0</td><td class="porq">Todos numerados. La identidad real es el UUID, no el número «E07».</td></tr>
        <tr><td><b>Fichas con función declarada</b></td><td class="num" style="color:#f08585">0 / ${m.nombres.length}</td><td class="porq">Las funciones del informe están deducidas por geometría.</td></tr>
        <tr><td><b>Hipótesis congelada</b></td><td>${L.hipotesis && L.hipotesis.congelada ? '<span class="sello verde">sí</span>' : '<span class="sello rojo">no</span>'}</td>
          <td class="porq">${L.hipotesis && L.hipotesis.congelada ? 'Los exportes llevan la hipótesis sellada.' : 'Todo exporte sale marcado como BORRADOR, en la cabecera y en cada página.'}</td></tr>
      </tbody></table></div>

    <p class="nota"><b>Qué cambia frente al módulo original.</b> El original exportaba lo que se veía en pantalla; aquí cada
      archivo lleva dentro la hipótesis, la versión del motor y la fecha con que se produjo. Si mañana un número se
      discute, la discusión es sobre el cálculo — no sobre quién exportó qué.</p>
    <div id="acuse"></div>

    <div class="pie-doc">
      <details>
        <summary>Qué propone este diseño</summary>
        <div class="cuerpo-pie">
          <p><b>La línea es un documento, no once pestañas.</b> Al elegir LN-627 en la barra lateral, todo lo consolidado
            baja de una vez en el mismo orden en que se firma: portada, resumen, distancias, fichas, falla, fundamentos,
            cálculo, térmica, viento, cargas, cantidades y exportación. El índice de la izquierda marca dónde estás,
            como Vista Previa con un PDF. Lo que ves en pantalla es exactamente lo que sale por la impresora —pruébalo
            con ⌘P—, así que revisar en pantalla y revisar el papel son el mismo trabajo.</p>
          <p><b>Qué ganas.</b> Nada queda escondido detrás de una pestaña que nadie abre: el hueco de los 24 apoyos sin
            capacidad y las cuatro verificaciones sin resolver aparecen en el recorrido normal de lectura, no hay que
            ir a buscarlos. La barra lateral se queda con una sola pregunta —«¿cuál línea?»— y aguanta veinte o
            doscientas; la sección activa sobrevive al cambio de línea, así que comparar Cargas de dos líneas es un clic.</p>
          <p><b>Qué pierdes.</b> Un documento se recorre, no se salta: para llegar a Cargas hay que usar el índice o el
            teclado, mientras que once pestañas te dejan en cualquier sitio con un solo clic. Y el mapa a pantalla
            completa no cabe en una hoja: aquí es una lámina numerada, ancha pero acotada. Si lo tuyo es vivir dentro
            del mapa, esta no es tu maqueta; si lo tuyo es firmar informes, sí lo es.</p>
        </div>
      </details>
      <p class="pie-legal">Maqueta de interfaz. Las cifras se calculan en esta misma página con el motor real
        (catenaria, VIR, cambio de estado por bisección, quiebre y vano viento) sobre una geometría reconstruida:
        <b>no contiene coordenadas, fotografías ni ningún dato de cliente</b>. Los códigos de línea distintos de LN-627
        son sintéticos. Sin dependencias externas: un solo archivo, abre con doble clic.</p>
    </div>`);
}

/* ══ Ensamblado del documento ══════════════════════════════════════════ */
function construir(m) {
  return secPortada(m) + sec1(m) + sec2(m) + sec3(m) + sec4(m) + sec5(m)
    + sec6(m) + sec7(m) + sec8(m) + sec9(m) + sec10(m) + sec11(m);
}

/* ══ INTERFAZ ══════════════════════════════════════════════════════════ */
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
let actual = null, modelo = null, orden = 'estado', filtro = '', secActiva = 's0', fichaSel = 0;

function pintarLista() {
  const cont = $('#lista-lineas');
  const f = filtro.trim().toLowerCase();
  const visible = CARTERA.filter(L => !f || L.cod.toLowerCase().includes(f) || L.resumen.toLowerCase().includes(f));
  let html = '';
  const fila = (L) => `<button class="fila-linea ${L.cod === actual ? 'sel' : ''}" data-linea="${L.cod}"
      title="${L.cod} · ${ROTULO_ESTADO[L.estado]} — ${L.resumen.replace(/"/g, '')} · resumen guardado ${L.fechaResumen}, motor ${L.motor}">
      <span class="pt ${L.estado}"></span><span class="cod">${L.cod}</span><span class="meta">${nf(L.kv, L.kv % 1 ? 1 : 0)} kV</span></button>`;

  if (orden === 'estado') {
    GRUPOS.forEach(g => {
      const xs = visible.filter(L => L.estado === g.est);
      if (!xs.length) return;
      html += `<div class="grupo-rotulo"><span class="pt ${g.est}"></span>${g.rot}<span class="cuenta">${xs.length}</span></div>`;
      html += xs.map(fila).join('');
    });
  } else {
    const xs = [...visible].sort((a, b) => orden === 'codigo' ? a.cod.localeCompare(b.cod) : (b.kv - a.kv) || a.cod.localeCompare(b.cod));
    html += `<div class="grupo-rotulo">${orden === 'codigo' ? 'Todas, por código' : 'Todas, por tensión'}<span class="cuenta">${xs.length}</span></div>` + xs.map(fila).join('');
  }
  if (!visible.length) html = `<div class="grupo-rotulo">Sin resultados</div><p class="sidebar-pie">Ninguna línea coincide con «${filtro}».</p>`;
  cont.innerHTML = html;
  cont.querySelectorAll('[data-linea]').forEach(b => b.onclick = () => seleccionar(b.dataset.linea));

  const conEvento = CARTERA.filter(L => L.rico || L.evento).length;
  const sinEval = CARTERA.filter(L => L.estado === 'sin').length;
  const viejas = CARTERA.filter(L => L.motorViejo).length;
  $('#sidebar-pie').innerHTML = `<b>${CARTERA.length} líneas · ${conEvento} con expediente abierto ·
    ${sinEval} sin evaluar · ${viejas} con el resumen calculado por un motor viejo.</b>
    El orden por estado usa el <b>resumen guardado</b> de cada línea, no un cálculo de apertura —
    con veinte líneas, recalcularlo todo al abrir costaría miles de lecturas. Y cada semáforo se
    emitió contra la hipótesis de SU línea: <b>dos verdes de líneas distintas no significan lo mismo</b>.`;
}

function pintarIndice() {
  const cont = $('#indice'), L = CARTERA.find(x => x.cod === actual);
  let html = `<div class="indice-cab"><div class="rot">Documento</div><div class="nom">${L.cod}</div>
    <div class="est">${L.hipotesis && L.hipotesis.congelada ? 'Firmable con reservas' : 'Borrador — no firmable'} · 31 páginas</div></div>`;
  $$('#hoja .seccion, #hoja .portada').forEach(s => {
    html += `<button class="idx" data-goto="${s.id}"><span class="n">${s.dataset.n || '·'}</span><span>${s.dataset.tit}</span><span class="pg">${s.dataset.pg}</span></button>`;
    s.querySelectorAll('h3.sub[data-idx]').forEach(h => {
      /* En el índice manda el reconocimiento, no la descripción: se corta el
         subtítulo largo, que ya está entero en el documento. */
      const corto = h.textContent.replace(/^\s*[\d.]+\s*/, '').split(' — ')[0].trim();
      html += `<button class="idx hijo" data-goto="${h.id}"><span class="n">${h.dataset.idx}</span><span>${corto}</span></button>`;
    });
  });
  cont.innerHTML = html;
  cont.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => irA(document.getElementById(b.dataset.goto)));
}

/* Desplazamiento propio: el `scroll-behavior: smooth` del navegador no responde
   en todos los contextos, y una maqueta que no navega no demuestra nada. */
let animScroll = null;
function irA(el, suave = true) {
  if (!el) return;
  const d = $('#doc');
  const dest = Math.max(0, Math.min(d.scrollHeight - d.clientHeight,
    d.scrollTop + el.getBoundingClientRect().top - d.getBoundingClientRect().top - 8));
  cancelAnimationFrame(animScroll);
  if (!suave || matchMedia('(prefers-reduced-motion: reduce)').matches) { d.scrollTop = dest; actualizarSalto(); return; }
  const ini = d.scrollTop, dif = dest - ini, t0 = performance.now();
  const dur = Math.min(620, 190 + Math.abs(dif) * 0.11);
  const paso = (t) => {
    const u = Math.min(1, (t - t0) / dur);
    const e = u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    d.scrollTop = ini + dif * e;
    if (u < 1) animScroll = requestAnimationFrame(paso); else actualizarSalto();
  };
  animScroll = requestAnimationFrame(paso);
  /* Red de seguridad: si el navegador congela los fotogramas (pestaña en
     segundo plano), la navegación tiene que llegar igual a su destino. */
  clearTimeout(irA._t);
  irA._t = setTimeout(() => { if (Math.abs(d.scrollTop - dest) > 2) { d.scrollTop = dest; actualizarSalto(); } }, dur + 90);
}

function actualizarSalto() {
  const doc = $('#doc'), y0 = doc.getBoundingClientRect().top + 72;
  const secs = $$('#hoja .seccion, #hoja .portada');
  let cur = secs[0];
  secs.forEach(s => { if (s.getBoundingClientRect().top <= y0) cur = s; });
  if (cur && cur.id !== secActiva) {
    secActiva = cur.id;
    $('#miga-sec').textContent = (cur.dataset.n ? cur.dataset.n + ' · ' : '') + cur.dataset.tit;
    $('#prog').textContent = 'pág. ' + cur.dataset.pg + ' / 31';
    $$('#indice .idx').forEach(b => b.classList.toggle('act', b.dataset.goto === cur.id && !b.classList.contains('hijo')));
  }
}

function calcDistancias() {
  const a = Number($('#calc-a').value), b = Number($('#calc-b').value);
  const d = modelo.dist(a, b);
  const rec = Math.abs(modelo.progres[b] - modelo.progres[a]);
  const dx = modelo.pts[b].x - modelo.pts[a].x, dy = modelo.pts[b].y - modelo.pts[a].y;
  let az = (90 - Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
  const rumbos = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
  $('#calc-kpis').innerHTML = `
    <div class="kpi"><div class="kpi-v">${nf(d, 1)}<small> m</small></div><div class="kpi-l">Distancia directa</div><div class="kpi-s">Vincenty sobre WGS84</div></div>
    <div class="kpi"><div class="kpi-v">${nf(rec, 1)}<small> m</small></div><div class="kpi-l">Recorrido por la línea</div><div class="kpi-s">Factor de rodeo ${nf(rec / d, 2)}</div></div>
    <div class="kpi"><div class="kpi-v">${nf(az, 1)}<small>°</small></div><div class="kpi-l">Acimut relativo</div><div class="kpi-s">Rumbo ${rumbos[Math.round(az / 45) % 8]} · norte relativo</div></div>
    <div class="kpi"><div class="kpi-v hueco">—</div><div class="kpi-l">Desnivel GPS</div><div class="kpi-s">no firmable — ±8 m declarados</div></div>`;
  $$('#matriz td.sel').forEach(t => t.classList.remove('sel'));
  const cel = document.querySelector(`#matriz td[data-i="${a}"][data-j="${b}"]`);
  if (cel) cel.classList.add('sel');
}

function cablear() {
  /* Fichas */
  const chips = $('#chips-ficha');
  if (chips) {
    chips.querySelectorAll('[data-ficha]').forEach(b => b.onclick = () => {
      fichaSel = b.dataset.ficha;
      chips.querySelectorAll('.chip').forEach(x => x.classList.remove('act'));
      b.classList.add('act');
      renderFicha(modelo, fichaSel);
    });
    const primero = chips.querySelector('[data-ficha]');
    const elegido = chips.querySelector(`[data-ficha="${fichaSel}"]`) || primero;
    if (elegido) { elegido.classList.add('act'); renderFicha(modelo, elegido.dataset.ficha); }
  }
  /* Distancias */
  if ($('#calc-a')) {
    $('#calc-a').value = 0; $('#calc-b').value = modelo.nombres.length - 1;
    $('#calc-a').onchange = calcDistancias; $('#calc-b').onchange = calcDistancias;
    $('#calc-inv').onclick = () => { const t = $('#calc-a').value; $('#calc-a').value = $('#calc-b').value; $('#calc-b').value = t; calcDistancias(); };
    $('#matriz').onclick = (e) => {
      const td = e.target.closest('td[data-i]'); if (!td) return;
      $('#calc-a').value = td.dataset.i; $('#calc-b').value = td.dataset.j; calcDistancias();
      irA($('#s2'));
    };
    calcDistancias();
  }
  /* Acuse de descarga */
  $$('.descarga').forEach(b => b.onclick = () => {
    $('#acuse').innerHTML = `<p class="ok"><b>«${b.dataset.desc}» preparado.</b> En el sistema real el archivo baja aquí,
      sellado con la hipótesis «${modelo.L.hipotesis ? modelo.L.hipotesis.nombre : 'no declarada'}» y el motor ${modelo.L.motor}.
      Esto es una maqueta: no se descarga nada.</p>`;
  });
}

function seleccionar(cod) {
  const L = CARTERA.find(x => x.cod === cod); if (!L) return;
  const cambioDeLinea = actual !== cod;
  actual = cod;
  modelo = modelar(L);
  if (cambioDeLinea) fichaSel = 0;
  $('#hoja').innerHTML = construir(modelo);
  $('#titulo-barra').innerHTML = `Líneas AT <span>— ${L.cod}</span>`;
  $('#miga-linea').textContent = L.cod;
  $('#sello-barra').innerHTML = `motor <b>${L.motor}</b> · resumen <b>${L.fechaResumen}</b>`;
  document.title = `${L.cod} — Expediente · Líneas AT`;
  pintarLista(); cablear(); pintarIndice();
  /* La sección activa SOBREVIVE al cambio de línea: comparar dos líneas en la
     misma sección es el gesto que esto tiene que hacer barato. */
  const destino = document.getElementById(secActiva) || document.getElementById('s0');
  secActiva = '';
  $('#doc').scrollTop = 0;
  irA(destino, false);
}

/* Barra de herramientas y navegación */
$('#btn-sidebar').onclick = function () { $('#cuerpo').classList.toggle('sin-sidebar'); this.classList.toggle('activo'); };
$('#btn-indice').onclick = function () { $('#cuerpo').classList.toggle('sin-indice'); this.classList.toggle('activo'); };
$('#btn-imprimir').onclick = () => window.print();
$('#btn-tema').onclick = function () {
  const claro = document.documentElement.getAttribute('data-tema') === 'claro';
  document.documentElement.setAttribute('data-tema', claro ? 'oscuro' : 'claro');
  this.classList.toggle('activo', !claro);
  this.title = claro ? 'Cambiar a claro' : 'Volver a oscuro';
};
$('#buscador').oninput = (e) => { filtro = e.target.value; pintarLista(); };
$$('.segmentado button').forEach(b => b.onclick = () => {
  orden = b.dataset.orden; $$('.segmentado button').forEach(x => x.classList.toggle('activo', x === b)); pintarLista();
});
const irSeccion = (paso) => {
  const secs = $$('#hoja .seccion, #hoja .portada');
  let i = secs.findIndex(s => s.id === secActiva); if (i < 0) i = 0;
  irA(secs[Math.max(0, Math.min(secs.length - 1, i + paso))]);
};
$('#btn-prev').onclick = () => irSeccion(-1);
$('#btn-next').onclick = () => irSeccion(1);
$('#doc').addEventListener('scroll', actualizarSalto, { passive: true });
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'j' || e.key === 'ArrowDown' && e.metaKey) { irSeccion(1); e.preventDefault(); }
  if (e.key === 'k' || e.key === 'ArrowUp' && e.metaKey) { irSeccion(-1); e.preventDefault(); }
  if (e.key === 's' && e.altKey && e.metaKey) { $('#btn-sidebar').click(); e.preventDefault(); }
});

seleccionar('LN-627');
</script>
</body>
</html>
