<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero del activo — Mantenimiento Líneas AT</title>
<style>
/* ============================================================================
   TOKENS — la identidad del módulo de campo LN-627, llevada a macOS oscuro.
   ========================================================================= */
:root {
  color-scheme: dark;

  --lienzo:      #0f1419;
  --lienzo-hond: #0b0f13;
  --pnl:         #171d24;
  --pnl2:        #1e262f;
  --pnl-alto:    linear-gradient(180deg, #1a212a 0%, var(--pnl) 62%);

  --sidebar-fondo:  rgba(19, 25, 32, .62);
  --barra-fondo:    rgba(22, 28, 35, .72);
  --flotante-fondo: rgba(30, 38, 47, .82);
  --vibrante: saturate(180%) blur(30px);

  --bd:        rgba(255,255,255,.075);
  --bd-suave:  rgba(255,255,255,.05);
  --bd-fuerte: rgba(255,255,255,.13);
  --bd-solido: #2b353f;
  --hairline:  .5px;

  --tx:    #e6edf3;
  --tx2:   #c6d3de;
  --mut:   #8b98a5;
  --tenue: #6f7d8a;

  --acc:       #f0a500;
  --acc-tx:    #1a1200;
  --acc-suave: rgba(240,165,0,.14);
  --acc-borde: rgba(240,165,0,.32);
  --acc-tinte: #2a2113;
  --anillo-foco: 0 0 0 3px rgba(240,165,0,.32);

  --sel-fondo:    var(--acc-suave);
  --sel-tx:       var(--acc);
  --sel-inactiva: rgba(255,255,255,.06);

  --gr: #7fc96a;  --rd: #e05252;  --az: #5b8dd9;
  --t-verde: #16240f;  --t-rojo: #2a1616;  --t-azul: #12202c;  --b-azul: #24455e;
  --hueco: var(--tenue);

  --fuente:      -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --fuente-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --t-base:   13px;
  --t-prosa:  12px;
  --t-fino:   11.4px;
  --t-rotulo: 11.5px;
  --t-micro:  10px;
  --t-tabla:  11.8px;
  --t-matriz: 9.8px;
  --t-cifra:  21px;
  --ls-rotulo: 1px;
  --ls-micro:  .7px;
  --lh: 1.5;
  --num: tabular-nums;

  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 10px;
  --r-pastilla: 999px;

  --luz-arriba: inset 0 1px 0 rgba(255,255,255,.045);
  --sombra-1: 0 1px 2px rgba(0,0,0,.35);
  --sombra-2: 0 6px 20px -6px rgba(0,0,0,.55);
  --sombra-flotante: 0 14px 40px -10px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.4);

  --sidebar-ancho:   264px;
  --barra-alto:      38px;
  --fila-lista:      28px;
  --fila-tabla:      22px;
  --pad-panel: 14px 16px 18px;
  --pad-celda: 5px 8px;
  --gap: 8px;
  --gap-panel: 14px;
  --medida-prosa: 110ch;

  --curva: cubic-bezier(.2,.7,.3,1);
  --rapido: .12s;
  --medio:  .18s;

  --insp-ancho: 0px;
  --side-ancho: var(--sidebar-ancho);
}

@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  :root { --sidebar-fondo:#131920; --barra-fondo:#161c23; --flotante-fondo:#1e262f; }
}
@media (prefers-reduced-transparency: reduce) {
  :root { --sidebar-fondo:#131920; --barra-fondo:#161c23; --flotante-fondo:#1e262f; --vibrante: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

@media (prefers-color-scheme: light) {
  :root { color-scheme: light;
    --lienzo:#f2f4f7; --lienzo-hond:#e8ebef; --pnl:#ffffff; --pnl2:#f6f8fa;
    --pnl-alto: linear-gradient(180deg,#fff 0%,#fbfcfd 62%);
    --sidebar-fondo: rgba(246,248,250,.72); --barra-fondo: rgba(250,251,252,.80);
    --flotante-fondo: rgba(255,255,255,.90);
    --bd: rgba(0,0,0,.09); --bd-suave: rgba(0,0,0,.06);
    --bd-fuerte: rgba(0,0,0,.18); --bd-solido:#d6dce2;
    --tx:#111a22; --tx2:#39485a; --mut:#5d6b78; --tenue:#8894a0;
    --acc:#a86f00; --acc-tx:#fff; --acc-suave: rgba(240,165,0,.18); --acc-tinte:#fff6e0;
    --t-verde:#eef7ea; --t-rojo:#fdf0f0; --t-azul:#eef4fa; --b-azul:#c3d6e6;
    --luz-arriba: inset 0 1px 0 rgba(255,255,255,.8);
    --sombra-1: 0 1px 2px rgba(16,24,32,.08);
    --sombra-2: 0 6px 20px -6px rgba(16,24,32,.16);
  }
}

/* ── Base ─────────────────────────────────────────────────────────────── */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  font: 400 var(--t-base)/var(--lh) var(--fuente);
  background: var(--lienzo); color: var(--tx);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 6px;
  border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.27); background-clip: content-box; }
::-webkit-scrollbar-corner { background: transparent; }
:focus-visible { outline: none; box-shadow: var(--anillo-foco); border-radius: var(--r-sm); }
button { font-family: inherit; }

.num { font-variant-numeric: var(--num); }
.mono { font-family: var(--fuente-mono); font-size: .93em; }
.hueco { color: var(--hueco); }

/* ── Ventana ──────────────────────────────────────────────────────────── */
.ventana { display: grid; grid-template-rows: var(--barra-alto) minmax(0,1fr); height: 100vh; }
.cuerpo {
  display: grid; min-height: 0;
  grid-template-columns: var(--side-ancho) minmax(0,1fr) var(--insp-ancho);
  transition: grid-template-columns var(--medio) var(--curva);
}

/* ── Barra de herramientas ────────────────────────────────────────────── */
.barra {
  display: grid; grid-template-columns: var(--side-ancho) minmax(0,1fr) auto;
  align-items: center; gap: 0;
  background: var(--barra-fondo);
  -webkit-backdrop-filter: var(--vibrante); backdrop-filter: var(--vibrante);
  border-bottom: var(--hairline) solid var(--bd);
  transition: grid-template-columns var(--medio) var(--curva);
  position: relative; z-index: 40;
}
.barra-izq { display: flex; align-items: center; gap: 10px; padding: 0 10px 0 13px;
  height: 100%; border-right: var(--hairline) solid var(--bd); min-width: 0; }
.semaforo { display: flex; gap: 8px; flex: none; }
.semaforo i { width: 11px; height: 11px; border-radius: 50%; display: block; }
.semaforo i:nth-child(1) { background: #ff5f57; }
.semaforo i:nth-child(2) { background: #febc2e; }
.semaforo i:nth-child(3) { background: #28c840; }
@media (prefers-color-scheme: dark) { .semaforo i { filter: saturate(.92) brightness(.95); } }

.icobtn {
  appearance: none; background: none; border: 0; cursor: pointer;
  width: 25px; height: 21px; border-radius: var(--r-sm); color: var(--mut);
  display: grid; place-items: center; padding: 0; flex: none;
}
.icobtn:hover { background: rgba(255,255,255,.07); color: var(--tx); }
.icobtn svg { width: 15px; height: 15px; }

.barra-tit { display: flex; align-items: baseline; gap: 9px; padding: 0 14px; min-width: 0; }
.barra-tit b { font-size: 12.5px; font-weight: 600; letter-spacing: .1px; white-space: nowrap; }
.barra-tit span { font-size: var(--t-fino); color: var(--mut); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.barra-der { display: flex; align-items: center; gap: 6px; padding: 0 12px 0 8px; }

.bezel {
  appearance: none; cursor: pointer; font: 500 11.5px/1 var(--fuente);
  background: rgba(255,255,255,.055); color: var(--tx2);
  border: var(--hairline) solid var(--bd); border-radius: var(--r-sm);
  padding: 5px 9px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px;
  transition: background var(--rapido) var(--curva), color var(--rapido) var(--curva);
}
.bezel:hover { background: rgba(255,255,255,.1); color: var(--tx); }
.bezel.on { background: var(--acc-suave); color: var(--acc); border-color: var(--acc-borde); }
.bezel svg { width: 12px; height: 12px; }

.segmento { display: inline-flex; background: rgba(255,255,255,.055); border-radius: var(--r-sm);
  border: var(--hairline) solid var(--bd); padding: 1.5px; }
.segmento button { appearance: none; background: none; border: 0; cursor: pointer;
  font: 500 11.5px/1 var(--fuente); color: var(--mut); padding: 4px 10px; border-radius: 4.5px; }
.segmento button.on { background: rgba(255,255,255,.11); color: var(--tx); box-shadow: var(--sombra-1); }

/* ── Barra lateral ────────────────────────────────────────────────────── */
.sidebar {
  background: var(--sidebar-fondo);
  -webkit-backdrop-filter: var(--vibrante); backdrop-filter: var(--vibrante);
  border-right: var(--hairline) solid var(--bd);
  overflow-y: auto; overflow-x: hidden; min-width: 0;
  display: flex; flex-direction: column;
}
body.side-off .sidebar { visibility: hidden; }
.buscar-caja { padding: 9px 10px 6px; position: sticky; top: 0; z-index: 3;
  background: linear-gradient(180deg, rgba(19,25,32,.92) 70%, rgba(19,25,32,0)); }
.buscar { position: relative; }
.buscar svg { position: absolute; left: 7px; top: 50%; transform: translateY(-50%);
  width: 12px; height: 12px; color: var(--tenue); pointer-events: none; }
.buscar input {
  width: 100%; appearance: none; font: 400 12px/1 var(--fuente);
  background: var(--lienzo-hond); color: var(--tx);
  border: var(--hairline) solid var(--bd); border-radius: var(--r-sm);
  padding: 6px 8px 6px 24px;
}
.buscar input::placeholder { color: var(--tenue); }
.buscar input:focus { outline: none; border-color: var(--acc-borde); box-shadow: var(--anillo-foco); }

.grupo { padding: 0 8px; }
.grupo-tit {
  appearance: none; background: none; border: 0; cursor: pointer; width: 100%;
  display: flex; align-items: center; gap: 5px; padding: 9px 4px 4px;
  font: 600 var(--t-micro)/1 var(--fuente); color: var(--tenue);
  text-transform: uppercase; letter-spacing: var(--ls-micro);
}
.grupo-tit .tri { width: 8px; height: 8px; transition: transform var(--rapido) var(--curva); }
.grupo.cerrado .tri { transform: rotate(-90deg); }
.grupo.cerrado .grupo-lista { display: none; }
.grupo-tit .cuenta { margin-left: auto; font-variant-numeric: var(--num); letter-spacing: 0; }

.fila {
  appearance: none; background: none; border: 0; cursor: pointer; width: 100%; text-align: left;
  display: grid; grid-template-columns: 9px 1fr auto; align-items: center; gap: 8px;
  padding: 4px 8px 5px; border-radius: var(--r-md); color: var(--tx2);
  position: relative; margin-bottom: 1px;
}
.fila:hover { background: rgba(255,255,255,.045); }
.fila.sel { background: var(--sel-fondo); color: var(--sel-tx); }
.fila.sel::before { content: ""; position: absolute; left: 0; top: 5px; bottom: 5px;
  width: 2px; border-radius: 2px; background: var(--acc); }
.fila.sel .fila-cod { color: var(--acc); }
.fila-punto { width: 8px; height: 8px; border-radius: 50%; background: var(--mut); }
.fila-txt { min-width: 0; }
.fila-cod { display: block; font-size: 12.2px; font-weight: 600; letter-spacing: .1px;
  font-variant-numeric: var(--num); color: var(--tx); }
.fila.sel .fila-meta { color: var(--acc); opacity: .78; }
.fila-meta { display: block; font-size: 10.4px; color: var(--tenue); font-variant-numeric: var(--num);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fila-marca { font-size: 9.6px; font-weight: 700; font-variant-numeric: var(--num);
  padding: 1px 5px; border-radius: var(--r-pastilla); letter-spacing: .3px; }
.marca-rd { background: rgba(224,82,82,.16); color: #ff9d9d; }
.marca-am { background: rgba(240,165,0,.14); color: var(--acc); }

.p-rd { background: var(--rd); box-shadow: 0 0 0 3px rgba(224,82,82,.18); }
.p-am { background: var(--acc); box-shadow: 0 0 0 3px rgba(240,165,0,.16); }
.p-gr { background: var(--gr); box-shadow: 0 0 0 3px rgba(127,201,106,.14); }
.p-az { background: var(--az); box-shadow: 0 0 0 3px rgba(91,141,217,.14); }
.p-gs { background: #55626e; box-shadow: 0 0 0 3px rgba(139,152,165,.10); }

.side-pie { margin-top: auto; padding: 9px 12px 11px; border-top: var(--hairline) solid var(--bd);
  font-size: var(--t-micro); color: var(--tenue); font-variant-numeric: var(--num);
  line-height: 1.55; letter-spacing: .1px; }
.side-pie b { color: var(--mut); font-weight: 600; }

/* ── Contenido ────────────────────────────────────────────────────────── */
.main { overflow-y: auto; overflow-x: hidden; min-width: 0; padding: 0 0 40px; }
.zona { padding: 0 18px; }
.rotulo {
  display: flex; align-items: center; gap: 9px; margin: 20px 0 8px;
  font-size: var(--t-rotulo); font-weight: 600; text-transform: uppercase;
  letter-spacing: var(--ls-rotulo); color: var(--mut);
}
.rotulo::after { content: ""; flex: 1; height: var(--hairline); background: var(--bd); }
.rotulo .nota { text-transform: none; letter-spacing: 0; font-weight: 400;
  font-size: var(--t-fino); color: var(--tenue); }
.rotulo.urgente { color: #ff9d9d; }
.rotulo.urgente::after { background: rgba(224,82,82,.22); }

/* Cabecera del activo */
.activo {
  display: grid; grid-template-columns: minmax(0,1fr) minmax(320px, 440px);
  align-items: start; gap: 22px; padding: 14px 18px 13px;
  border-bottom: var(--hairline) solid var(--bd);
  background: linear-gradient(180deg, rgba(255,255,255,.022), transparent);
}
.activo h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: .2px;
  font-variant-numeric: var(--num); display: flex; align-items: center; gap: 10px; }
.activo h1 .zona-tag { font-size: var(--t-micro); font-weight: 600; color: var(--mut);
  text-transform: uppercase; letter-spacing: var(--ls-micro);
  border: var(--hairline) solid var(--bd); border-radius: var(--r-pastilla); padding: 2px 8px; }
.identidad { margin: 7px 0 0; display: flex; flex-wrap: wrap; gap: 4px 7px; }
.dato { font-size: var(--t-fino); color: var(--tx2); font-variant-numeric: var(--num);
  background: rgba(255,255,255,.04); border: var(--hairline) solid var(--bd);
  border-radius: var(--r-xs); padding: 2.5px 7px; }
.dato b { color: var(--tx); font-weight: 600; }
.dato.tenue { color: var(--tenue); border-style: dashed; }

.veredicto { flex: none; max-width: 430px; text-align: right; }
.veredicto-t { font-size: 9.6px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1.2px; color: var(--mut); }
.veredicto-v { margin: 3px 0 0; font-size: 16px; font-weight: 600; line-height: 1.25; }
.veredicto.no .veredicto-v { color: #ff8b8b; }
.veredicto.si .veredicto-v { color: #bfe6b0; }
.veredicto.parcial .veredicto-v { color: var(--acc); }
.veredicto.gris .veredicto-v { color: var(--mut); }
.veredicto-c { margin: 5px 0 0; font-size: var(--t-fino); color: var(--tx2); line-height: 1.55; }
.veredicto-c b { color: var(--tx); }
.criterio { margin: 6px 0 0; font-size: var(--t-micro); color: var(--tenue);
  border-top: var(--hairline) solid var(--bd); padding-top: 5px; line-height: 1.5; }
.criterio b { color: var(--mut); font-weight: 600; }

/* Banda de semáforos */
.banda { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: var(--gap);
  margin: 12px 0 0; }
.sem {
  appearance: none; text-align: left; cursor: pointer; width: 100%;
  display: flex; align-items: flex-start; gap: 10px; padding: 9px 11px 10px;
  background: var(--pnl-alto); border: var(--hairline) solid var(--bd);
  border-radius: var(--r-lg); box-shadow: var(--luz-arriba), var(--sombra-1);
  transition: border-color var(--rapido) var(--curva), transform var(--rapido) var(--curva);
  font-family: inherit;
}
.sem:hover { border-color: var(--bd-fuerte); transform: translateY(-1px); }
.sem-pt { flex: none; width: 9px; height: 9px; border-radius: 50%; margin-top: 4px; }
.sem-t { display: block; font-size: 9.4px; text-transform: uppercase; letter-spacing: var(--ls-micro);
  color: var(--mut); }
.sem-v { display: block; font-size: 13px; font-weight: 600; margin-top: 2px; line-height: 1.3;
  font-variant-numeric: var(--num); }
.sem-s { display: block; font-size: var(--t-micro); color: var(--tenue); margin-top: 3px; line-height: 1.5; }
.sem.rd { border-color: rgba(224,82,82,.28); } .sem.rd .sem-v { color: #ff8b8b; }
.sem.am .sem-v { color: var(--acc); }
.sem.gr .sem-v { color: #bfe6b0; }
.sem.gs .sem-v { color: var(--mut); }
.sem.az .sem-v { color: #86aae3; }

.orienta { margin: 11px 0 0; font-size: 12.5px; color: var(--tx2); line-height: 1.6;
  border-left: 2px solid var(--acc); padding-left: 10px; max-width: var(--medida-prosa); }
.orienta b { color: var(--tx); font-weight: 600; }

/* Panel genérico */
.panel { background: var(--pnl-alto); border: var(--hairline) solid var(--bd);
  border-radius: var(--r-lg); box-shadow: var(--luz-arriba), var(--sombra-1);
  padding: var(--pad-panel); }
.panel h3 { margin: 0 0 9px; font-size: var(--t-rotulo); font-weight: 600; color: var(--mut);
  text-transform: uppercase; letter-spacing: var(--ls-rotulo);
  border-bottom: var(--hairline) solid var(--bd); padding-bottom: 6px;
  display: flex; align-items: baseline; gap: 8px; }
.panel h3 .der { margin-left: auto; text-transform: none; letter-spacing: 0;
  font-weight: 400; font-size: var(--t-micro); color: var(--tenue);
  font-variant-numeric: var(--num); }
.rejilla { display: grid; gap: var(--gap-panel); }
.r-2 { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
.r-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.r-32 { grid-template-columns: minmax(0,1.9fr) minmax(0,1fr); }

/* Tarjetas de acción */
.accion {
  appearance: none; text-align: left; cursor: pointer; width: 100%; font-family: inherit;
  display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 11px; align-items: start;
  padding: 12px 13px 13px; border-radius: var(--r-lg);
  background: linear-gradient(180deg, #241a1a 0%, var(--pnl) 72%);
  border: var(--hairline) solid rgba(224,82,82,.3); border-left: 3px solid #ff6b6b;
  box-shadow: var(--luz-arriba), var(--sombra-1);
  transition: border-color var(--rapido) var(--curva), transform var(--rapido) var(--curva);
}
.accion:hover { transform: translateX(2px); border-color: rgba(224,82,82,.55); }
.accion.am { background: linear-gradient(180deg, #241f13 0%, var(--pnl) 72%);
  border-color: var(--acc-borde); border-left-color: var(--acc); }
.accion.am:hover { border-color: rgba(240,165,0,.6); }
.accion-ico { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  font-size: 13px; background: #d64545; color: #fff; box-shadow: 0 0 0 3px rgba(214,69,69,.18); }
.accion.am .accion-ico { background: var(--acc); color: var(--acc-tx); box-shadow: 0 0 0 3px rgba(240,165,0,.16); }
.accion-t { font-size: 13px; font-weight: 600; color: #fff; line-height: 1.35;
  font-variant-numeric: var(--num); }
.accion.am .accion-t { color: var(--tx); }
.accion-c { margin: 4px 0 0; font-size: var(--t-fino); color: var(--tx2); line-height: 1.55;
  font-variant-numeric: var(--num); }
.accion-c b { color: var(--tx); font-weight: 600; }
.accion-pie { margin: 7px 0 0; font-size: var(--t-micro); color: var(--tenue); display: flex;
  align-items: center; gap: 6px; flex-wrap: wrap; }
.accion-pie .ir { color: var(--acc); font-weight: 600; }

/* Cinta de la línea */
.cinta-caja { background: var(--lienzo-hond); border: var(--hairline) solid var(--bd);
  border-radius: var(--r-lg); padding: 10px 12px 8px; overflow-x: auto; }
.cinta-caja svg { display: block; width: 100%; min-width: 720px; height: auto; }
.leyenda { display: flex; flex-wrap: wrap; gap: 5px 16px; margin-top: 9px;
  font-size: var(--t-fino); color: var(--mut); font-variant-numeric: var(--num); }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; }
.li { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.li.barra { width: 18px; height: 4px; border-radius: 2px; }
.li.term { border-radius: 1px; border: 1.5px solid var(--tx); background: none; }
.li.ancla { background: var(--acc); border-radius: 1px; transform: rotate(45deg); width: 8px; height: 8px; }
.li.emp { background: none; border: 1px dashed var(--mut); }

"use strict";
/* ══════════════════════════════════════════════════════════════════════════
   MAQUETA «TABLERO DEL ACTIVO» — una sola pantalla densa por línea.
   Los números de LN-627 salen de docs/40-DOMINIO-LINEAS-AT.md y del motor
   (nucleo/mecanica). Las demás líneas son SINTÉTICAS: códigos inventados y

   ═══════════════════════════════════════════════════════════════════════ */

/* ── Formato es-CO ──────────────────────────────────────────────────────── */
const nf = (v, d = 0) => (v === null || v === undefined || Number.isNaN(v))
  ? "—" : v.toLocaleString("es-CO", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 1) => v === null ? "—" : nf(v, d) + " %";
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ── Motor mínimo: lo que el tablero necesita calcular de verdad ────────── */
const G = 9.80665;

/** VIR = √(Σaᵢ³ / Σaᵢ) — el vano único equivalente de un tramo. */
function vir(vanos) {
  const s3 = vanos.reduce((a, b) => a + b * b * b, 0);
  const s1 = vanos.reduce((a, b) => a + b, 0);
  return Math.sqrt(s3 / s1);
}

/** Cambio de estado (forma parabólica), resuelto por bisección. */
function cambioEstado(H1, w1, t1, w2, t2, a, ES, alfa) {
  const A = -H1 + alfa * ES * (t2 - t1) + (w1 * w1 * a * a * ES) / (24 * H1 * H1);
  const B = (w2 * w2 * a * a * ES) / 24;
  const f = (H) => H * H * (H + A) - B;
  let lo = 0.5, hi = Math.max(H1 * 4, 2000);
  let guardia = 0;
  while (f(hi) < 0 && guardia++ < 60) hi *= 2;
  for (let i = 0; i < 200; i++) { const m = (lo + hi) / 2; if (f(m) < 0) lo = m; else hi = m; }
  return (lo + hi) / 2;
}

/** Flecha por catenaria: f = C·(cosh(a/2C) − 1), C = H/w. */
const flechaCatenaria = (w, a, H) => { const C = H / w; return C * (Math.cosh(a / (2 * C)) - 1); };
/** Sobrelongitud de la catenaria sobre la cuerda (aprox. parabólica). */
const sobrelongitud = (w, a, H) => (w * w * a * a * a) / (24 * H * H);
/** Amplificación del quiebre: 2·sen(α/2). */
const factorAngulo = (gr) => 2 * Math.sin(gr * Math.PI / 360);
/** Presión dinámica y empuje del viento sobre el cable. */
const presionViento = (v_kmh, rho) => 0.5 * rho * Math.pow(v_kmh / 3.6, 2);
const empujeViento = (q, cx, d) => q * cx * d / G;

/* ── LN-627: los datos reales verificados ───────────────────────────────── */

  procedencia: "catálogo del módulo de campo — PENDIENTE ficha del proveedor",

const HIP_627 = {

  eds: 20, tEds: 28, tMax: 75, tMin: 22,
  viento: 100, tViento: 28, cx: 1.0, rho: 1.2,

/* ══════════════════════════════════════════════════════════════════════════
   CONSTRUCCIÓN DEL MODELO — todo lo que se ve se calcula aquí, no se escribe
   a mano. Sirve igual a LN-627 que a una línea sintética de 76 apoyos.
   ═══════════════════════════════════════════════════════════════════════ */

/** Función estructural que impone la geometría (mismo criterio del original). */
function funcionPorDeflexion(gr, extremo) {
  if (extremo) return "Terminal";
  if (gr === null || gr === undefined) return null;
  if (gr < 3) return "Suspensión";
  if (gr < 15) return "Suspensión angular";
  if (gr < 30) return "Ángulo";
  return "Retención / anclaje";
}
const ANCLA = (f) => f === "Terminal" || f === "Retención / anclaje" || f === "Ángulo" || f === "Derivación";

/** Arma estructuras, progresivas, vanos adyacentes y vano viento. */
function construirApoyos(vanos, deflex, prefijo) {
  const n = vanos.length + 1;
  const ap = []; let prog = 0;
  for (let i = 0; i < n; i++) {
    const id = prefijo + String(i + 1).padStart(2, "0");
    if (i > 0) prog += vanos[i - 1];
    const extremo = (i === 0 || i === n - 1);
    const d = extremo ? null : ((deflex && id in deflex) ? deflex[id] : 0);
    const f = funcionPorDeflexion(d, extremo);
    const vAnt = i > 0 ? vanos[i - 1] : null;
    const vSig = i < n - 1 ? vanos[i] : null;
    ap.push({
      i, id, prog: Math.round(prog * 100) / 100, extremo,
      deflexion: d, funcion: f, ancla: ANCLA(f),
      vanoAnt: vAnt, vanoSig: vSig,
      vanoViento: (vAnt !== null && vSig !== null) ? (vAnt + vSig) / 2
                 : (vAnt !== null ? vAnt / 2 : vSig / 2),
      factor: d === null ? null : factorAngulo(d),
    });
  }
  return ap;
}

/** Tramos de tensión: de anclaje a anclaje. Dentro, la tensión es común. */
function construirTramos(apoyos, vanos, cond, hip) {
  const cortes = apoyos.filter(a => a.ancla).map(a => a.i);
  const ES = cond.E * cond.seccion;
  const w = cond.masa;
  const Heds = (hip.eds / 100) * cond.rts;
  const q = presionViento(hip.viento, hip.rho);
  const wV = empujeViento(q, hip.cx, cond.diametro);
  const wTot = Math.sqrt(w * w + wV * wV);
  const salida = [];
  for (let k = 0; k < cortes.length - 1; k++) {
    const a = cortes[k], b = cortes[k + 1];
    const vs = vanos.slice(a, b);
    if (!vs.length) continue;
    const V = vir(vs);
    const est = {
      eds: Heds,
      tMax: cambioEstado(Heds, w, hip.tEds, w, hip.tMax, V, ES, cond.alfa),
      tMin: cambioEstado(Heds, w, hip.tEds, w, hip.tMin, V, ES, cond.alfa),
      viento: cambioEstado(Heds, w, hip.tEds, wTot, hip.tViento, V, ES, cond.alfa),
    };
    const pico = Math.max(est.eds, est.tMax, est.tMin, est.viento);
    const vMax = Math.max.apply(null, vs);
    salida.push({
      n: salida.length + 1, desde: apoyos[a].id, hasta: apoyos[b].id,
      iDesde: a, iHasta: b, vanos: vs, nVanos: vs.length,
      longitud: vs.reduce((x, y) => x + y, 0), vir: V, vanoMax: vMax,
      eds: est.eds, tMax: est.tMax, tMin: est.tMin, viento: est.viento,
      pico, pctRts: pico / cond.rts * 100,
      flechaMax: flechaCatenaria(w, vMax, est.tMax),
      fuera: vs.filter(v => v / V < 0.7 || v / V > 1.3).length,
    });
  }
  return { tramos: salida, q, wV, wTot, Heds };
}

/** Carga transversal sobre cada estructura. NO se suma con la longitudinal. */
function construirCargas(apoyos, tramos, cond, ctx) {
  const nCond = 3;
  return apoyos.map(a => {
    if (a.extremo) return Object.assign({}, a, {
      noEval: "Extremo de línea: su caso dominante es el LONGITUDINAL, otro eje.",
      estado: "no_evaluable" });
    const tr = tramos.filter(t => a.i >= t.iDesde && a.i <= t.iHasta);
    const H = Math.max.apply(null, tr.map(t => t.viento));
    const fq = nCond * H * a.factor;
    const fv = nCond * ctx.wV * a.vanoViento;
    return Object.assign({}, a, {
      tramosN: tr.map(t => t.n), tiro: H, fq, fv, ft: fq + fv,
      amplifica: a.factor > 1, capacidad: null, utilizacion: null,
      estado: "no_evaluable", noEval: null,
    });
  });
}

/** Eje longitudinal: terminales y desequilibrio entre tramos contiguos. */
function construirLongitudinal(apoyos, tramos, cond) {
  const nCond = 3;
  return apoyos.map(a => {
    const izq = tramos.find(t => t.iHasta === a.i);
    const der = tramos.find(t => t.iDesde === a.i);
    if (a.extremo) {
      const t = izq || der;
      return Object.assign({}, a, { porCond: t.viento, total: nCond * t.viento,
        sentido: "hacia la línea", concluyente: true,
        caso: "Tiro entero — no hay vano al otro lado", capacidad: null, utilizacion: null });
    }
    if (!izq || !der) return Object.assign({}, a, { porCond: null, total: null, sentido: null,
      concluyente: false, caso: "—", capacidad: null, utilizacion: null });
    const dif = Math.abs(izq.viento - der.viento);
    const conc = a.ancla && dif > 1;
    return Object.assign({}, a, {
      porCond: dif, total: nCond * dif,
      sentido: conc ? (izq.viento > der.viento ? "hacia " + izq.desde : "hacia " + der.hasta) : null,
      concluyente: conc,
      caso: a.ancla ? "Desequilibrio entre tramos" : "Suspensión: el conductor corre sobre la grapa",
      capacidad: null, utilizacion: null,
    });
  });
}

/* ── Geometría sintética, para las líneas que aún no están consolidadas ─── */
function rnd(seed) { let s = seed; return () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648; }
function geomSintetica(seed, nEst, totalM) {
  const r = rnd(seed), n = nEst - 1, brutos = [];
  for (let i = 0; i < n; i++) brutos.push(0.45 + r() * 1.5);
  const k = totalM / brutos.reduce((a, b) => a + b, 0);
  const vanos = brutos.map(v => Math.round(v * k * 10) / 10);
  const deflex = {}; const cada = Math.max(3, Math.round(n / 5));
  for (let i = 1; i < nEst - 1; i++) {
    const id = "E" + String(i + 1).padStart(2, "0");
    deflex[id] = (i % cada === 0) ? Math.round((32 + r() * 55) * 10) / 10
                                  : Math.round(r() * 112) / 10;
  }
  return { vanos, deflex };
}

/* ══════════════════════════════════════════════════════════════════════════
   SEMÁFOROS — cuatro preguntas, calculadas. Ninguno puede decir «sana» cuando
   lo que ocurre es que no se pudo evaluar: para eso existe el estado gris.
   ═══════════════════════════════════════════════════════════════════════ */
function semaforos(L) {
  const s = [];

  // 1 · Eventos de falla
  if (L.fallas > 0) s.push({ c: "rd", t: "Eventos de falla", v: L.fallas + (L.fallas === 1 ? " expediente abierto" : " expedientes abiertos"),
    s: L.verificaciones + " verificaciones pendientes sin resolver", ir: "falla" });
  else s.push({ c: "gr", t: "Eventos de falla", v: "Ninguno abierto",
    s: "Es un hecho de la línea, no un hueco de la aplicación.", ir: "falla" });

  // 2 · Calidad del levantamiento
  if (!L.gps) s.push({ c: "gs", t: "Calidad del levantamiento", v: "Sin levantar",
    s: "No hay puntos capturados: no hay nada que calificar.", ir: "resumen" });
  else {
    const prec = parseFloat(String(L.gps).replace(/[^\d,\.]/g, "").replace(",", "."));
    if (prec >= 8) s.push({ c: "am", t: "Calidad del levantamiento", v: "1 punto de atención",
      s: "Precisión GPS declarada " + L.gps + ": no sirve para flecha, gálibo ni distancias de seguridad.", ir: "resumen" });
    else s.push({ c: "gr", t: "Calidad del levantamiento", v: "Sin hallazgos",
      s: "Precisión GPS declarada " + L.gps + ". La cota sigue sin servir para gálibo.", ir: "resumen" });
  }

  // 3 · Cálculo mecánico
  if (!L.tramos) s.push({ c: "gs", t: "Cálculo mecánico", v: "No evaluable",
    s: L.cond === null ? "Sin conductor declarado no hay mecánico, térmica, viento ni cargas." : "Faltan datos de entrada.", ir: "mecanico" });
  else if (L.fuera > 0) s.push({ c: "am", t: "Cálculo mecánico", v: L.fuera + " de " + L.vanosN + " vanos fuera de banda",
    s: "Fuera de 0,7–1,3 del VIR de su tramo la hipótesis del vano ideal pierde validez.", ir: "mecanico" });
  else s.push({ c: "gr", t: "Cálculo mecánico", v: "Todos los vanos en banda",
    s: "Los " + L.vanosN + " vanos caen dentro de 0,7–1,3 del VIR de su tramo.", ir: "mecanico" });

  // 4 · Hipótesis
  if (!L.hip) s.push({ c: "gs", t: "Hipótesis de cálculo", v: "No declarada",
    s: "Sin hipótesis no hay criterio contra el que emitir ningún veredicto.", ir: "mecanico" });
  else if (!L.hip.congelada) s.push({ c: "rd", t: "Hipótesis de cálculo", v: "SIN congelar",
    s: "«" + L.hip.nombre + "» · procedencia: " + L.hip.procedencia + ".", ir: "mecanico" });
  else s.push({ c: "gr", t: "Hipótesis de cálculo", v: "Congelada",
    s: "«" + L.hip.nombre + "» · procedencia: " + L.hip.procedencia + ".", ir: "mecanico" });

  return s;
}

/** El veredicto de portada: ¿está lista para firmar, y contra qué criterio? */
function veredicto(L) {
  const razones = [];
  if (L.fallas > 0) razones.push(L.verificaciones + " verificaciones del expediente sin resolver");
  if (!L.hip) razones.push("no hay hipótesis declarada");
  else if (!L.hip.congelada) razones.push("la hipótesis no está congelada");
  if (!L.cond) razones.push("no hay conductor declarado");
  if (L.cargas) razones.push("0 de " + L.est + " apoyos con veredicto estructural");
  else razones.push("no hay cálculo de cargas");

  if (L.estado === "firmable")
    return { clase: "si", t: "¿Está lista para firmar?", v: "SÍ, con la hipótesis congelada",
      c: "Sin expedientes abiertos y con la hipótesis declarada y congelada. " +
         (L.fuera ? "Quedan <b>" + L.fuera + " de " + L.vanosN + " vanos fuera de banda</b> y s" : "S") +
         "igue faltando el <b>veredicto estructural</b>: 0 de " + L.est + " apoyos declaran capacidad." };
  if (L.estado === "sin-levantar")
    return { clase: "gris", t: "¿Está lista para firmar?", v: "No hay nada que firmar todavía",
      c: "La línea está inventariada pero <b>sin levantamiento de campo</b>. Ni un punto capturado, ni una ficha, ni una fotografía." };
  return { clase: L.estado === "atender" ? "parcial" : "no", t: "¿Está lista para firmar?",
    v: L.estado === "atender" ? "NO — quedan hallazgos abiertos" : "NO",
    c: "Bloquean: " + razones.slice(0, 3).join(" · ") + "." };
}

   BARRA LATERAL
   ═══════════════════════════════════════════════════════════════════════ */
function pintarSidebar() {
  const q = ST.filtro.trim().toLowerCase();
  const cont = document.getElementById("lista");
  let html = "";
  ZONAS.forEach(z => {
    let lineas = CARTERA.filter(L => L.zona === z);
    if (q) lineas = lineas.filter(L =>
      L.cod.toLowerCase().includes(q) || L.zona.toLowerCase().includes(q) ||
      String(L.kv).includes(q) || ETIQ_ESTADO[L.estado].toLowerCase().includes(q));
    if (!lineas.length) return;
    lineas.sort((a, b) => ST.orden === "sev" ? (a.sev - b.sev) || a.cod.localeCompare(b.cod)
                                             : a.cod.localeCompare(b.cod));
    const cerrado = ST.cerrados[z] ? " cerrado" : "";
    html += '<section class="grupo' + cerrado + '" data-zona="' + esc(z) + '">' +
      '<button class="grupo-tit" data-toggle="' + esc(z) + '">' +
        '<svg class="tri" viewBox="0 0 10 10" fill="currentColor"><path d="M2 1l6 4-6 4z"/></svg>' +
        esc(z) + '<span class="cuenta">' + lineas.length + '</span></button>' +
      '<div class="grupo-lista">';
    lineas.forEach(L => {
      const sel = L === ST.linea ? " sel" : "";
      const marca = L.fallas > 0
        ? '<span class="fila-marca marca-rd">' + L.fallas + ' ⚡</span>'
        : (L.estado === "atender" ? '<span class="fila-marca marca-am">!</span>' : '<span></span>');
      html += '<button class="fila' + sel + '" data-cod="' + L.cod + '" ' +
        'title="' + esc(L.cod + " · " + ETIQ_ESTADO[L.estado] + " · el semáforo se emite contra la hipótesis de ESTA línea") + '">' +
        '<span class="fila-punto ' + PUNTO[L.estado] + '"></span>' +
        '<span class="fila-txt"><b class="fila-cod">' + L.cod + '</b>' +
        '<span class="fila-meta">' + nf(L.kv, L.kv % 1 ? 1 : 0) + ' kV · ' + L.est + ' est · ' +
        nf(L.km, 2) + ' km</span></span>' + marca + '</button>';
    });
    html += '</div></section>';
  });
  if (!html) html = '<p style="padding:16px 14px;font-size:11.4px;color:var(--tenue);line-height:1.6">' +
    'Ninguna línea coincide con «' + esc(ST.filtro) + '».<br>El filtro busca por código, circuito, tensión y estado.</p>';
  cont.innerHTML = html;

  const tot = CARTERA.length;
  const estr = CARTERA.reduce((a, L) => a + L.est, 0);
  const km = CARTERA.reduce((a, L) => a + L.km, 0);
  const rojas = CARTERA.filter(L => L.estado === "no-firmable").length;
  const grises = CARTERA.filter(L => L.estado === "sin-levantar" || L.estado === "sin-conductor").length;
  document.getElementById("side-pie").innerHTML =
    '<b>' + tot + ' líneas</b> · ' + nf(estr) + ' estructuras · ' + nf(km, 2) + ' km<br>' +
    rojas + ' no firmables · ' + grises + ' no evaluables<br>' +
    '<span style="color:var(--tenue)">El orden por severidad usa el resumen guardado de cada línea, no un cálculo de apertura.</span>';
}

/* ══════════════════════════════════════════════════════════════════════════
   TABLERO — todo el estado del activo en una sola pantalla.
   Orden de lectura: lo que exige acción arriba, lo resuelto abajo.
   ═══════════════════════════════════════════════════════════════════════ */

/* ── La cinta: la línea entera dibujada por progresiva, sin geografía ───── */
function cinta(L) {
  const W = 1200, H = 108, m = 26;
  const total = L.longitud;
  const x = p => m + (p / total) * (W - 2 * m);
  const yL = 62;
  const COL = ["#e0a03c", "#6e9bd4", "#84b878", "#b892c9", "#5fb3ac", "#d9906b",
               "#c9a0bd", "#8aa8c4", "#a8b878"];
  const FT = ' font-family="-apple-system,system-ui,sans-serif"';
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Cinta de la línea">';

  // Bandas de tramo
  if (L.tramos) {
    let ultimoTxt = -999;
    L.tramos.forEach((t, i) => {
      const x1 = x(L.apoyos[t.iDesde].prog), x2 = x(L.apoyos[t.iHasta].prog);
      s += '<rect x="' + x1.toFixed(1) + '" y="30" width="' + Math.max(1.5, x2 - x1).toFixed(1) +
        '" height="4" rx="2" fill="' + COL[i % COL.length] + '" opacity=".92"/>';
      const txt = 'T' + t.n + ' · VIR ' + nf(t.vir, 1) + ' m';
      const anchoTxt = txt.length * 5.1;
      const cx = (x1 + x2) / 2;
      if (x2 - x1 > anchoTxt + 6 && cx - anchoTxt / 2 > ultimoTxt + 8) {
        s += '<text x="' + cx.toFixed(1) + '" y="24" fill="' + COL[i % COL.length] +
          '" font-size="10" text-anchor="middle"' + FT + '>' + txt + '</text>';
        ultimoTxt = cx + anchoTxt / 2;
      }
    });
  }
  // Conductor
  s += '<line x1="' + m + '" y1="' + yL + '" x2="' + (W - m) + '" y2="' + yL +
       '" stroke="#3c4854" stroke-width="1.6"/>';

  // Empalmes (no son apoyos): tick hueco bajo la línea
  L.empalmes.forEach(e => {
    const a = L.apoyos.find(a => a.id === e.entre[0]);
    const b = L.apoyos.find(a => a.id === e.entre[1]);
    if (!a || !b) return;
    const px = x(a.prog + (b.prog - a.prog) * e.f);
    s += '<circle cx="' + px.toFixed(1) + '" cy="' + yL + '" r="3" fill="none" stroke="#8b98a5" ' +
      'stroke-width="1" stroke-dasharray="1.6 1.4"/>';
    s += '<line x1="' + px.toFixed(1) + '" y1="' + (yL + 4) + '" x2="' + px.toFixed(1) +
      '" y2="' + (yL + 11) + '" stroke="#8b98a5" stroke-width=".8" stroke-dasharray="2 2"/>';
  });

  // Estructuras
  const denso = L.apoyos.length > 34;
  let ultimoId = -999, ultimoAng = -999, altAng = 0;
  L.apoyos.forEach(a => {
    const px = x(a.prog);
    if (a.extremo) {
      s += '<rect x="' + (px - 4).toFixed(1) + '" y="' + (yL - 4) + '" width="8" height="8" ' +
        'fill="none" stroke="#e6edf3" stroke-width="1.6"/>';
    } else if (a.ancla) {
      s += '<rect x="' + (px - 3.7).toFixed(1) + '" y="' + (yL - 3.7) + '" width="7.4" height="7.4" ' +
        'fill="#f0a500" transform="rotate(45 ' + px.toFixed(1) + ' ' + yL + ')"/>';
    } else {
      s += '<circle cx="' + px.toFixed(1) + '" cy="' + yL + '" r="2.4" fill="#7f8d9a"/>';
    }
    // El rótulo solo se pinta si cabe: dos códigos encimados no informan, ensucian.
    const quiere = a.extremo || a.ancla || (!denso && a.i % 2 === 0);
    if (quiere && px - 15 > ultimoId) {
      s += '<text x="' + px.toFixed(1) + '" y="' + (yL + 20) + '" fill="' +
        (a.ancla && !a.extremo ? "#f0a500" : "#8b98a5") + '" font-size="9" text-anchor="middle"' +
        FT + '>' + a.id + '</text>';
      ultimoId = px + 15;
    }
    if (a.deflexion !== null && a.deflexion >= 30) {
      altAng = (px - 26 > ultimoAng) ? 0 : 1;   // se escalona cuando dos quiebres van juntos
      s += '<text x="' + px.toFixed(1) + '" y="' + (yL - 10 - altAng * 11) + '" fill="#f0a500" ' +
        'font-size="9" text-anchor="middle"' + FT + '>' + nf(a.deflexion, 1) + '°</text>';
      ultimoAng = px + 26;
    }
  });

  // Evento de falla
  if (L.fallas > 0 && L.real) {
    const f = L.apoyos.find(a => a.id === "E02");
    const px = x(f.prog);
    s += '<circle class="pulso" cx="' + px.toFixed(1) + '" cy="' + yL + '" r="6" fill="#d64545" opacity=".5"/>';
    s += '<circle cx="' + px.toFixed(1) + '" cy="' + yL + '" r="5.6" fill="#d64545" stroke="#0f1419" stroke-width="1.4"/>';
    s += '<text x="' + px.toFixed(1) + '" y="' + (yL - 22) + '" fill="#ff8b8b" font-size="9.5" ' +
      'text-anchor="middle"' + FT + '>expediente abierto</text>';
  }

  // Escala de progresiva
  s += '<line x1="' + m + '" y1="' + (H - 12) + '" x2="' + (W - m) + '" y2="' + (H - 12) +
       '" stroke="' + "#2b353f" + '" stroke-width=".7"/>';
  for (let k = 0; k <= 4; k++) {
    const p = total * k / 4, px = x(p);
    s += '<line x1="' + px.toFixed(1) + '" y1="' + (H - 15) + '" x2="' + px.toFixed(1) + '" y2="' + (H - 9) +
      '" stroke="#2b353f" stroke-width=".7"/>';
    s += '<text x="' + px.toFixed(1) + '" y="' + (H - 1) + '" fill="#6f7d8a" font-size="8.6" ' +
      'text-anchor="' + (k === 0 ? "start" : k === 4 ? "end" : "middle") + '"' + FT + '>' +
      nf(p, 0) + ' m</text>';
  }
  s += '</svg>';
  return s;
}

/* ── Barras de vanos, con la marca del promedio y las de fuera de banda ─── */
function barrasVanos(L) {
  if (!L.tramos) return "";
  const maxV = L.vanoMax, med = L.vanoMedio;
  let filas = "";
  let idx = 0;
  L.tramos.forEach(t => {
    t.vanos.forEach(v => {
      const a1 = L.apoyos[idx].id, a2 = L.apoyos[idx + 1].id;
      const rel = v / t.vir;
      const fuera = rel < 0.7 || rel > 1.3;
      filas += '<div class="vb" title="' + a1 + ' → ' + a2 + ' · ' + nf(v, 2) + ' m · a/VIR ' +
        nf(rel, 2) + '">' +
        '<span class="vb-n">' + a1 + '→' + a2 + '</span>' +
        '<span class="vb-p"><span class="vb-v' + (fuera ? " fuera" : "") + '" style="width:' +
          (v / maxV * 100).toFixed(1) + '%"></span>' +
        '<span class="vb-m" style="left:' + (med / maxV * 100).toFixed(1) + '%"></span></span>' +
        '<span class="vb-c">' + nf(v, 1) + '</span></div>';
      idx++;
    });
  });
  return '<div class="vanos-barras">' + filas + '</div>';
}

/* ── Tarjetas de acción: lo que exige atención hoy ──────────────────────── */
function acciones(L) {
  const A = [];
  if (L.fallas > 0 && L.real) {
    A.push({ c: "", ico: "⚡", t: "Expediente de falla abierto — apertura de línea en E02",
      cuerpo: "El componente afectado está identificado y geolocalizado, la evidencia está cargada y la cronología escrita. " +
        "Lo que falta es lo que decide si el informe se defiende: <b>" + L.verificaciones +
        " verificaciones pendientes sin resolver</b>.",
      pie: "4 fotografías del expediente · 3 hipótesis causales ordenadas por verosimilitud", ir: "falla" });
  }
  if (L.peorFactor && L.peorFactor.factor > 1) {
    const p = L.peorFactor;
    A.push({ c: "am", ico: "∠", t: "Empiece por " + p.id + ": el quiebre amplifica ×" + nf(p.factor, 3),
      cuerpo: "Deflexión de <b>" + nf(p.deflexion, 1) + "°</b>. El factor 2·sen(α/2) vale <b>" +
        nf(p.factor, 3) + "</b>, o sea que la estructura recibe un <b>" + nf((p.factor - 1) * 100, 1) +
        " % MÁS</b> de carga transversal que el propio tiro del conductor. Es carga permanente: existe con viento y sin él.",
      pie: L.amplifican + " de " + (L.est - 2) + " apoyos amplifican por encima de 1 · carga total calculada " +
        nf(p.ft, 0) + " kgf", ir: "cargas" });
  }
  if (L.longit) {
    const t1 = L.longit[0], t2 = L.longit[L.longit.length - 1];
    const peor = t2.porCond > t1.porCond ? t2 : t1;
    A.push({ c: "am", ico: "↹", t: "Los dos terminales cargan con todo: " + t1.id + " y " + t2.id,
      cuerpo: "Soportan el tiro entero del tramo que les llega: <b>" + nf(peor.porCond, 0) +
        " kgf por conductor</b> en " + peor.id + " (" + nf(peor.total, 0) + " kgf con las tres fases) y " +
        nf(Math.min(t1.porCond, t2.porCond), 0) + " kgf en el otro. Es un orden de magnitud por encima de " +
        "cualquier desequilibrio entre tramos. Son las dos estructuras cuyo fallo abre la línea.",
      pie: "Eje LONGITUDINAL — no se suma con el transversal · 0 de " + L.est + " declaran capacidad longitudinal",
      ir: "cargas" });
  }
  if (L.tramos && L.picoTramo && L.picoTramo.pctRts > 25) {
    const t = L.picoTramo;
    A.push({ c: "am", ico: "%", t: "El tope de tiro sigue sin decidir, y aquí cambia el resultado",
      cuerpo: "El tramo <b>" + t.n + " (" + t.desde + "→" + t.hasta + ")</b> llega a <b>" +
        pct(t.pctRts) + " de la RTS</b>. Con el tope del 50 % que usa el motor, cumple. " +
        "Con el <b>25 % de la doctrina interna</b>, no. La decisión está abierta.",
      pie: "El veredicto de este tramo depende del criterio, no del cálculo", ir: "mecanico" });
  }
  if (!A.length) A.push({ c: "am", ico: "○", t: "Ninguna acción abierta hoy",
    cuerpo: "No hay expedientes de falla ni apoyos que amplifiquen el tiro por encima de 1. " +
      "Eso <b>no</b> significa que la línea esté verificada: significa que no hay nada urgente encima.",
    pie: "Lo que falta sigue abajo, en «lo que este levantamiento no demuestra»", ir: "resumen" });
  return A;
}

/* ── Los huecos declarados ──────────────────────────────────────────────── */
function huecos(L) {
  const H = [];
  H.push({ c: "rd", t: "Capacidad transversal de los apoyos",
    x: "0 de " + L.est, cob: 0,
    d: "Ningún apoyo declara carga de rotura ni las dos alturas. El sistema sabe cuánta carga " +
       "<b>recibe</b> cada estructura, pero no puede decir cuánto <b>aguanta</b>." });
  H.push({ c: "rd", t: "Capacidad longitudinal de los apoyos",
    x: "0 de " + L.est, cob: 0,
    d: "Y no se deduce de la carga de rotura: esa es un ensayo <b>transversal en punta</b>. " +
       "Es otro eje y otro ensayo." });
  if (L.real) {
    H.push({ c: "am", t: "Fotografía por punto",
      x: "14 de 26", cob: 14 / 26,
      d: "99 fotografías de estructura repartidas en 14 puntos. <b>12 puntos declaran que no tienen ninguna</b> — " +
         "lo declaran, no lo esconden." });
  } else if (L.fichas) {
    H.push({ c: "am", t: "Fichas de apoyo capturadas",
      x: L.fichas[0] + " de " + L.fichas[1], cob: L.fichas[0] / L.fichas[1],
      d: "El levantamiento sigue en curso. Los apoyos sin ficha no tienen función estructural declarada." });
  } else {
    H.push({ c: "rd", t: "Fichas de apoyo capturadas", x: "0 de " + L.est, cob: 0,
      d: "Sin ficha no hay función estructural, y sin función estructural no hay tramos de tensión." });
  }
  return H;
}

function deudas(L) {
  if (L.real) return [
    { c: "rd", h: "Cotas GPS de mano, precisión declarada ±8 m", d: "NO sirven para flecha, gálibo ni distancias de seguridad. Se usan para planta, no para perfil." },
    { c: "rd", h: "El vano peso no se puede calcular", d: "Falta la cota del <b>punto de sujeción</b> (terreno + altura útil del apoyo). Sin él no se detecta el arrancamiento." },
    { c: "rd", h: "El despeje al terreno queda sin verificar", d: "Es consecuencia directa de lo anterior: sin perfil fiable no hay gálibo que comprobar contra el RETIE." },
    { c: "am", h: "Módulo elástico del conductor en conflicto", d: "6.300 vs 7.000 kg/mm² según la fuente. <b>Ese conflicto decide si un tramo cumple el RETIE</b>, y la ficha real del proveedor sigue pendiente." },
    { c: "am", h: "Fluencia del conductor (creep)", d: "No se modela. El conductor se alarga con los años y la flecha crece: lo que hoy despeja, en diez años puede no despejar." },
    { c: "", h: "Sistema de referencia", d: "El levantamiento está en WGS84; el oficial de Colombia es MAGNA-SIRGAS. Para cruzar con catastro hay que transformar." },
  ];
  if (!L.cond) return [
    { c: "rd", h: "No hay conductor declarado", d: "Sin conductor no hay <b>Mecánico, Térmica, Viento ni Cargas</b>. Las cuatro secciones siguen existiendo y dicen qué les falta." },
    { c: "am", h: "No hay hipótesis de cálculo", d: "Sin hipótesis no hay criterio, y sin criterio ningún número de esta línea es un veredicto." },
    { c: "", h: "Lo que sí hay", d: "Geometría: " + L.est + " estructuras, " + L.vanosN + " vanos y " + nf(L.longitud, 0) + " m de recorrido. Con eso se calculan distancias, deflexiones y cantidades geométricas." },
  ];
  return [
    { c: "rd", h: "Ficha del proveedor del conductor", d: "Se calcula con propiedades de <b>catálogo de referencia</b>, no con la hoja del conductor realmente instalado." },
    { c: "am", h: "El vano peso no se puede calcular", d: "Falta la cota del punto de sujeción. Sin él no se detecta el arrancamiento." },
    { c: "am", h: "El despeje al terreno queda sin verificar", d: "Precisión GPS declarada " + (L.gps || "—") + "." },
  ];
}

/* ── Render principal del tablero ───────────────────────────────────────── */
function pintarTablero() {
  const L = ST.linea;
  const V = veredicto(L);
  const S = semaforos(L);
  const A = acciones(L);
  const HU = huecos(L);
  const DE = deudas(L);
  let h = "";

  /* Cabecera del activo */
  h += '<header class="activo"><div>' +
    '<h1>' + L.cod + ' <span class="zona-tag">' + esc(L.zona) + '</span>' +
    '<span class="sello ' + (L.estado === "firmable" ? "gr" : L.estado === "atender" ? "am" :
      L.estado === "no-firmable" ? "rd" : "gs") + '">' + ETIQ_ESTADO[L.estado] + '</span></h1>' +
    '<div class="identidad">' +
      '<span class="dato"><b>' + nf(L.kv, L.kv % 1 ? 1 : 0) + '</b> kV</span>' +
      '<span class="dato"><b>1</b> circuito</span>' +
      '<span class="dato"><b>' + L.est + '</b> estructuras' + (L.emp ? ' + <b>' + L.emp + '</b> empalmes' : '') + '</span>' +
      '<span class="dato"><b>' + L.vanosN + '</b> vanos</span>' +
      '<span class="dato"><b>' + nf(L.longitud, 0) + '</b> m de recorrido</span>' +
      '<span class="dato">vano medio <b>' + nf(L.vanoMedio, 2) + '</b> m</span>' +
      '<span class="dato">mín <b>' + nf(L.vanoMin, 2) + '</b> · máx <b>' + nf(L.vanoMax, 2) + '</b> m</span>' +
      (L.cond ? '<span class="dato">conductor <b>' + esc(L.cond.codigo) + '</b>' +
        (L.real ? ' ' + esc(L.cond.calibre) + ' · ' + nf(L.cond.seccion, 1) + ' mm² · Ø ' +
          nf(L.cond.diametro * 1000, 2) + ' mm · RTS ' + nf(L.cond.rts) + ' kgf' : '') + '</span>'
        : '<span class="dato tenue">conductor — no declarado</span>') +
      (L.tramos ? '<span class="dato"><b>' + L.tramos.length + '</b> tramos de tensión (reparto ' +
        L.tramos.map(t => t.nVanos).join("-") + ')</span>'
        : '<span class="dato tenue">tramos de tensión — no calculables</span>') +
    '</div></div>' +
    '<div class="veredicto ' + V.clase + '">' +
      '<div class="veredicto-t">' + V.t + '</div>' +
      '<p class="veredicto-v">' + V.v + '</p>' +
      '<p class="veredicto-c">' + V.c + '</p>' +
      '<p class="criterio"><b>El criterio viaja pegado al veredicto:</b> ' +
        (L.hip ? 'hipótesis «' + esc(L.hip.nombre) + '», procedencia <b>' + esc(L.hip.procedencia) +
          '</b>, congelada <b>' + (L.hip.congelada ? "sí" : "no") + '</b> · tope de tiro <b>50 % de la RTS</b> (la doctrina interna dice 25 %; sin decidir)'
          : 'esta línea no declara hipótesis: no hay criterio contra el que emitir un veredicto') +
      '</p>' +
    '</div></header>';

  h += '<div class="zona">';

  /* Banda de semáforos */
  h += '<div class="banda">';
  S.forEach(s => {
    h += '<button class="sem ' + s.c + '" data-ir="' + s.ir + '">' +
      '<span class="sem-pt ' + (s.c === "rd" ? "p-rd" : s.c === "am" ? "p-am" : s.c === "gr" ? "p-gr" :
        s.c === "az" ? "p-az" : "p-gs") + '"></span><span>' +
      '<span class="sem-t">' + s.t + '</span>' +
      '<span class="sem-v">' + s.v + '</span>' +
      '<span class="sem-s">' + s.s + '</span></span></button>';
  });
  h += '</div>';

  h += '<p class="orienta">Ingeniero: <b>' + L.cod + '</b> — ' +
    (L.estado === "firmable"
      ? 'no tiene nada urgente encima; lo que le falta es el veredicto estructural de sus apoyos.'
      : L.estado === "sin-levantar"
      ? 'todavía no hay levantamiento. Lo que ve abajo es lo que el inventario ya sabe, y nada más.'
      : 'esto <b>no es un dictamen firmable</b>. Mientras la hipótesis no esté congelada y los apoyos no declaren capacidad, cada número de esta pantalla es un cálculo comprobable, no un veredicto.') +
    '</p>';

  /* 1 · Exige acción */
  h += '<div class="rotulo' + (L.fallas > 0 ? ' urgente' : '') + '">Exige acción hoy' +
    '<span class="nota">' + A.length + (A.length === 1 ? ' asunto abierto' : ' asuntos abiertos') + '</span></div>';
  h += '<div class="acciones">';
  A.forEach(a => {
    h += '<button class="accion ' + a.c + '" data-ir="' + a.ir + '">' +
      '<span class="accion-ico">' + a.ico + '</span><span>' +
      '<span class="accion-t">' + a.t + '</span>' +
      '<p class="accion-c">' + a.cuerpo + '</p>' +
      '<span class="accion-pie">' + a.pie + ' <span class="ir">abrir ›</span></span>' +
      '</span></button>';
  });
  h += '</div>';

  /* 2 · La línea, de un vistazo */
  h += '<div class="rotulo">La línea completa<span class="nota">' + L.est +
    ' estructuras por progresiva' + (L.emp ? ' · los ' + L.emp + ' empalmes NO son apoyos' : '') + '</span></div>';
  h += '<div class="cinta-caja">' + cinta(L) + '</div>';
  h += '<div class="leyenda">' +
    '<span><i class="li term"></i> Terminal</span>' +
    '<span><i class="li ancla"></i> Retención / anclaje (' + L.anclas + ')</span>' +
    '<span><i class="li" style="background:#7f8d9a;width:7px;height:7px"></i> Suspensión</span>' +
    (L.emp ? '<span><i class="li emp"></i> Empalme — cuelga a mitad de vano, no sostiene</span>' : '') +
    (L.fallas > 0 && L.real ? '<span><i class="li" style="background:#d64545"></i> Evento de falla</span>' : '') +
    '<span style="margin-left:auto;color:var(--tenue)">' + (L.tramos
      ? 'Las bandas de color son los tramos de tensión, con su VIR'
      : 'Sin conductor no hay tramos de tensión que dibujar') + '</span>' +
    '</div>';

  h += '</div>'; /* fin zona superior */
  h += pintarHallazgos(L);
  h += pintarHuecos(L, HU, DE);
  h += pintarComportamiento(L);
  h += pintarResuelto(L);
  h += pieDiseno();

  document.getElementById("main").innerHTML = h;
  document.getElementById("main").scrollTop = 0;
  document.getElementById("tb-cod").textContent = L.cod;
  document.getElementById("tb-sub").textContent = "Tablero del activo · " + L.zona + " · " +
    ETIQ_ESTADO[L.estado];
}

/* ── 3 · Hallazgos de ingeniería ────────────────────────────────────────── */
function pintarHallazgos(L) {
  let h = '<div class="zona"><div class="rotulo">Hallazgos de ingeniería' +
    '<span class="nota">calculados por el motor, no redactados a mano</span></div>';

  if (!L.tramos) {
    h += '<div class="panel"><h3>Cálculo mecánico<span class="der">no evaluable</span></h3>' +
      '<p class="prosa">Esta sección <b>sigue existiendo</b> y dice qué le falta, porque ocultarla se leería ' +
      'como «aquí no aplica» — y el hueco dejaría de contarse justo cuando más líneas hay.</p>' +
      '<ul class="deudas"><li class="rd"><b>Falta el conductor.</b> Sin masa lineal, sección, módulo elástico ' +
      'y carga de rotura no hay cambio de estado, ni flecha, ni tiro, ni carga sobre los apoyos.</li>' +
      '<li class="am"><b>Falta la hipótesis.</b> EDS, temperaturas y viento de diseño son el criterio: ' +
      'sin ellos no hay contra qué comparar.</li></ul>' +
      '<p class="fine">Lo que sí se puede afirmar hoy de ' + L.cod + ': ' + L.est + ' estructuras, ' +
      L.vanosN + ' vanos, ' + nf(L.longitud, 0) + ' m de recorrido, ' + L.anclas +
      ' anclajes deducidos por geometría y vano medio de ' + nf(L.vanoMedio, 2) + ' m.</p></div></div>';
    return h;
  }

  const admisible50 = 0.50 * L.cond.rts, admisible25 = 0.25 * L.cond.rts;
  /* Tabla de tramos */
  h += '<div class="rejilla r-32">';
  h += '<div class="panel"><h3>Cálculo mecánico por tramo de tensión' +
    '<span class="der">' + L.tramos.length + ' tramos · 4 estados por tramo</span></h3>' +
    '<div class="tabla-caja"><table class="tabla"><thead><tr>' +
    '<th>Tramo</th><th class="n">Vanos</th><th class="n">Vano<br><i>máximo</i></th><th class="n">VIR</th>' +
    '<th class="n">EDS<br><i>' + nf(L.hip.eds) + ' %</i></th>' +
    '<th class="n">T máx<br><i>' + nf(L.hip.tMax) + ' °C</i></th>' +
    '<th class="n">Viento<br><i>' + nf(L.hip.viento) + ' km/h</i></th>' +
    '<th class="n">T mín<br><i>' + nf(L.hip.tMin) + ' °C</i></th>' +
    '<th class="n">Pico</th><th class="n">% RTS</th>' +
    '<th class="n">Flecha<br><i>máxima</i></th><th class="n">Fuera<br><i>de banda</i></th></tr></thead><tbody>';
  L.tramos.forEach(t => {
    const cl = t.pico > admisible50 ? " grave" : (t.pico > admisible25 ? " fuera" : "");
    h += '<tr class="' + cl.trim() + '">' +
      '<td class="ap">' + t.n + ' · ' + t.desde + '→' + t.hasta + '</td>' +
      '<td class="n">' + t.nVanos + '</td>' +
      '<td class="n">' + nf(t.vanoMax, 2) + '</td>' +
      '<td class="n destaca">' + nf(t.vir, 1) + '</td>' +
      '<td class="n">' + nf(t.eds, 0) + '</td>' +
      '<td class="n">' + nf(t.tMax, 0) + '</td>' +
      '<td class="n">' + nf(t.viento, 0) + '</td>' +
      '<td class="n">' + nf(t.tMin, 0) + '</td>' +
      '<td class="n destaca">' + nf(t.pico, 0) + '</td>' +
      '<td class="n' + (t.pctRts > 25 ? " mal" : "") + '">' + nf(t.pctRts, 1) + '</td>' +
      '<td class="n">' + nf(t.flechaMax, 2) + ' m</td>' +
      '<td class="n' + (t.fuera ? " destaca" : "") + '">' + t.fuera + ' de ' + t.nVanos + '</td></tr>';
  });
  h += '</tbody><tfoot><tr><td colspan="12">Tiros en kgf por conductor · vanos, VIR y flecha en metros. ' +
    'La flecha se evalúa a temperatura máxima, que es el estado que decide el gálibo.</td></tr></tfoot></table></div>' +
    '<span class="sello-calc"><b>Sello:</b> motor de cálculo v0.3.0 · hipótesis «' + esc(L.hip.nombre) +
    '» · tope adoptado ' + nf(admisible50, 0) + ' kgf (50 % de la RTS). ' +
    'Con el 25 % de la doctrina interna el tope sería ' + nf(admisible25, 0) + ' kgf.</span>' +
    '<p class="fine"><b>Un VIR único de línea sería un error:</b> el de esta va de ' +
      nf(Math.min.apply(null, L.tramos.map(t => t.vir)), 1) + ' m a ' +
      nf(Math.max.apply(null, L.tramos.map(t => t.vir)), 1) + ' m — un factor de ' +
      nf(Math.max.apply(null, L.tramos.map(t => t.vir)) / Math.min.apply(null, L.tramos.map(t => t.vir)), 1) +
      '. Calcular la línea entera con uno solo daría flechas y tiros equivocados en los dos extremos del rango. ' +
      'Por eso el cálculo se hace por tramo, nunca por línea.</p>' +
      '<ul class="deudas" style="margin-top:11px">' +
      '<li class="am"><b>El tope de tiro decide el veredicto de esta tabla.</b> Con el 50 % de la RTS que ' +
      'usa el motor hoy (' + nf(admisible50, 0) + ' kgf) <b>ningún tramo excede</b>. Con el 25 % de la ' +
      'doctrina interna (' + nf(admisible25, 0) + ' kgf) excederían <b>' +
      L.tramos.filter(t => t.pico > admisible25).length + ' de ' + L.tramos.length + '</b>. ' +
      'La decisión sigue abierta, así que las filas tintadas están señaladas contra el criterio del 25 %, no dictaminadas.</li>' +
      '<li><b>Control catenaria contra parábola</b> en el vano más largo (' + nf(L.vanoMax, 2) + ' m, ' +
      'estado EDS): catenaria ' + nf(flechaCatenaria(L.cond.masa, L.vanoMax, L.ctx.Heds), 3) + ' m contra ' +
      'parábola ' + nf(L.cond.masa * L.vanoMax * L.vanoMax / (8 * L.ctx.Heds), 3) + ' m — ' +
      pct(Math.abs(flechaCatenaria(L.cond.masa, L.vanoMax, L.ctx.Heds) -
        L.cond.masa * L.vanoMax * L.vanoMax / (8 * L.ctx.Heds)) /
        flechaCatenaria(L.cond.masa, L.vanoMax, L.ctx.Heds) * 100, 2) +
      ' de diferencia. A estos vanos la parábola es utilizable; la catenaria se reserva para auditar.</li>' +
      '</ul></div>';

  /* Panel de la banda VIR */
  h += '<div class="panel"><h3>¿La geometría cuadra con la hipótesis?' +
    '<span class="der">banda 0,7 – 1,3 del VIR</span></h3>' +
    '<div class="kpis"><div class="kpi"><div class="kpi-v ' + (L.fuera ? "rd" : "gr") + '">' +
      L.fuera + '<small>/ ' + L.vanosN + '</small></div>' +
      '<div class="kpi-l">Vanos fuera de banda</div>' +
      '<div class="kpi-s">Fuera de ella la hipótesis del vano ideal pierde validez y el tramo debería subdividirse.</div></div>' +
    '<div class="kpi"><div class="kpi-v">' + nf(L.vanoMedio, 2) + '<small> m</small></div>' +
      '<div class="kpi-l">Vano promedio</div>' +
      '<div class="kpi-s">Mín ' + nf(L.vanoMin, 2) + ' m · máx ' + nf(L.vanoMax, 2) + ' m · relación ' +
      nf(L.vanoMax / L.vanoMin, 1) + '×</div></div></div>' +
    barrasVanos(L) +
    '<p class="fine">Cada barra es un vano; la marca blanca es el promedio de la línea. ' +
    'Las barras en ámbar son las que se salen de la banda <b>respecto al VIR de su propio tramo</b>, ' +
    'no respecto al promedio.</p></div>';
  h += '</div></div>';
  return h;
}

/* ── 4 · Lo que el levantamiento NO demuestra ───────────────────────────── */

      '<span class="cob-n' + (p >= 100 ? " ok" : "") + '">' + x.x + '</span></div>' +
      '<div class="cob-pista"><div class="cob-val' + (p >= 100 ? " ok" : p > 0 ? " am" : "") +
        '" style="width:' + Math.max(p, 1.2) + '%"></div></div>' +
      '<p class="cob-c">' + x.d + '</p></div>';

/* ── 5 · Comportamiento: térmica y viento ───────────────────────────────── */
function pintarComportamiento(L) {
  if (!L.cond || !L.hip) return "";
  const c = L.ctx;
  const balanceo = Math.atan(c.wV / L.cond.masa) * 180 / Math.PI;
  let h = '<div class="zona"><div class="rotulo">Comportamiento del conductor' +
    '<span class="nota">clima y viento: dos hipótesis, dos consecuencias</span></div>' +
    '<div class="rejilla r-2">';

  /* Térmica */
  if (L.termica) {
    const ref = L.termica.find(e => e.ref);
    const mejor = L.termica.reduce((a, b) => b.I > a.I ? b : a);
    const peor = L.termica.reduce((a, b) => b.I < a.I ? b : a);
    const mva = I => Math.sqrt(3) * L.kv * I / 1000;
    h += '<div class="panel"><h3>Capacidad térmica — IEEE Std 738' +
      '<span class="der">4 escenarios de clima adoptados</span></h3>' +
      '<ul class="deudas" style="margin-bottom:10px"><li class="am">' +
      '<b>Del mejor al peor escenario la línea pierde ' +
      pct((mejor.I - peor.I) / mejor.I * 100) + ' de su capacidad</b> — de ' + nf(mejor.I) + ' A (' +
      esc(mejor.etiqueta.toLowerCase()) + ') a ' + nf(peor.I) + ' A (' + esc(peor.etiqueta.toLowerCase()) +
      '). Un día sin viento pesa más que seis grados de ambiente.</li></ul>' +
      '<div class="tabla-caja"><table class="tabla"><thead><tr>' +
      '<th>Escenario</th><th class="n">Ambiente</th><th class="n">Viento</th><th class="n">Sol</th>' +
      '<th class="n">Ampacidad</th><th class="n">MVA a ' + nf(L.kv, L.kv % 1 ? 1 : 0) + ' kV</th>' +
      '<th class="n">Derrateo</th></tr></thead><tbody>';
    L.termica.forEach(e => {
      const der = (e.I - ref.I) / ref.I * 100;
      h += '<tr class="' + (e.ref ? "fuera" : "") + '">' +
        '<td class="ap">' + esc(e.etiqueta) + (e.ref ? ' <span class="sello am">referencia</span>' : '') + '</td>' +
        '<td class="n">' + nf(e.ta) + ' °C</td>' +
        '<td class="n">' + nf(e.v, 2) + ' m/s</td>' +
        '<td class="n">' + nf(e.sol) + ' W/m²</td>' +
        '<td class="n destaca">' + nf(e.I) + ' A</td>' +
        '<td class="n">' + nf(mva(e.I), 1) + '</td>' +
        '<td class="n' + (der < -20 ? " mal" : "") + '">' + (der > 0 ? "+" : "") + nf(der, 1) + ' %</td>' +
        '</tr>';
    });
    h += '</tbody></table></div>' +
      '<ul class="deudas" style="margin-top:9px">' +
      L.termica.map(e => '<li class="' + (e.clave === "nino" ? "am" : "") + '"><b>' + esc(e.etiqueta) +
        '</b> — ' + esc(e.nota) + '</li>').join("") + '</ul>' +
      '<span class="sello-calc">Conductor a ' + nf(L.cond.tmax) + ' °C (límite continuo de la aleación 6201-T81, ' +
      'no un valor conservador de catálogo) · ε = α = 0,5 · 10 msnm. ' +
      'La flecha, en cambio, se calculó a ' + nf(L.hip.tMax) + ' °C: pedirle a la línea una corriente que la ' +
      'caliente más que eso invalida el gálibo.</span></div>';
  } else {
    h += '<div class="panel"><h3>Capacidad térmica<span class="der">no evaluable</span></h3>' +
      '<p class="prosa">Sin la ficha real del conductor no se resuelve el balance térmico. ' +
      'La sección existe y dice exactamente qué le falta: <b>diámetro, sección y material verificados</b>.</p>' +
      '<p class="fine">Un número de relleno aquí se firma. Un hueco, no.</p></div>';
  }

  /* Viento */
  h += '<div class="panel"><h3>Hipótesis de viento<span class="der">' +
    nf(L.hip.viento) + ' km/h a ' + nf(L.hip.tViento) + ' °C · Cx ' + nf(L.hip.cx, 1) +
    ' · ρ ' + nf(L.hip.rho, 1) + ' kg/m³</span></h3>' +
    '<div class="kpis">' +
    '<div class="kpi"><div class="kpi-v">' + nf(c.q, 0) + '<small> Pa</small></div>' +
      '<div class="kpi-l">Presión dinámica</div><div class="kpi-s">Lo que empuja el aire a ' +
      nf(L.hip.viento) + ' km/h.</div></div>' +
    '<div class="kpi"><div class="kpi-v">' + nf(c.wV, 3) + '<small> kg/m</small></div>' +
      '<div class="kpi-l">Empuje sobre el cable</div><div class="kpi-s">Por metro de conductor, en horizontal.</div></div>' +
    '<div class="kpi"><div class="kpi-v az">' + nf(L.cond.masa, 3) + '<small> kg/m</small></div>' +
      '<div class="kpi-l">Peso propio</div><div class="kpi-s">Lo que pesa el conductor, en vertical.</div></div>' +
    '<div class="kpi"><div class="kpi-v">' + nf(c.wTot, 3) + '<small> kg/m</small></div>' +
      '<div class="kpi-l">Carga resultante</div><div class="kpi-s">Composición vectorial: ' +
      nf(c.wTot / L.cond.masa, 2) + '× el peso propio.</div></div>' +
    '<div class="kpi"><div class="kpi-v ' + (balanceo > 30 ? "rd" : "") + '">' + nf(balanceo, 1) +
      '<small>°</small></div><div class="kpi-l">Ángulo de balanceo</div>' +
      '<div class="kpi-s">' + (balanceo > 30 ? 'Por encima de 30°: la cadena se va de lado y come distancia al apoyo.' :
        'Dentro de 30°.') + '</div></div>' +
    '<div class="kpi"><div class="kpi-v">' + nf(c.wV / L.cond.masa, 2) + '<small>×</small></div>' +
      '<div class="kpi-l">Empuje / peso</div><div class="kpi-s">El viento empuja más de lo que el cable pesa.</div></div>' +
    '</div>' +
    '<p class="fine"><b>Lo que este cálculo NO dice:</b> no dimensiona ninguna cadena de aisladores, ' +
    'no evalúa el acercamiento del conductor al fuste con la cadena balanceada, y no considera viento ' +
    'racheado ni efecto de vano (los factores de la norma que reducen la presión en vanos largos). ' +
    'La hipótesis es de <b>' + esc(L.hip.procedencia) + '</b>.</p></div>';

  h += '</div></div>';
  return h;
}

    '<li><i>✓</i><span><b>Resistencia c.c.</b> contra tabla de fabricante: 1,3 % de desviación.</span></li>' +

  h += '<div class="panel"><h3>Modelo del activo</h3><ul class="ok-lista">' +
    (L.emp ? '<li><i>✓</i><span>Los <b>' + L.emp + ' empalmes no se cuentan como apoyos</b>: contarlos partía un vano real de 247,8 m en dos falsos de ~84 y ~164 m.</span></li>' : '') +
    '<li><i>✓</i><span><b>' + L.anclas + ' anclajes</b> deducidos por deflexión' +
      (L.real ? ': E02 64,7° · E04 50,2° · E06 118,2° · E20 76,0° · E21 58,6°' : '') + '.</span></li>' +
    (L.real ? '<li><i>✓</i><span>La deflexión tiene <b>un solo dueño</b>: la manda la geodésica. Tres ángulos heredados estaban mal y se corrigieron.</span></li>' : '') +
    '<li><i>✓</i><span>Nombres canónicos separados de los de campo: el punto que el GPS llama «E02» <b>no es</b> el apoyo E02.</span></li>' +
    '</ul></div>';

  h += '<div class="panel"><h3>Evidencia y entrega</h3><ul class="ok-lista">' +
    '<li><i>✓</i><span><b>' + nf(L.fotos) + ' fotografías</b> servidas con la sesión del usuario, cada una asignada a su punto.</span></li>' +
    '<li><i>✓</i><span><b>Exportables</b>: GPX 1.1, KML, CSV es-CO con coma decimal, CSV crudo RFC 4180, verificación mecánica, memoria de cantidades e informe HTML imprimible sin internet.</span></li>' +
    '<li><i>✓</i><span>Cada cifra queda amarrada a la fecha, la hipótesis y la versión del cálculo con que se produjo.</span></li>' +
    '</ul><p class="fine">Este sistema no certifica nada. Certifica el ingeniero que firma. ' +
    'El trabajo del sistema es hacer barato comprobar que ese ingeniero tiene razón.</p></div>';

  h += '</div></div>';
  return h;
}

/* ══════════════════════════════════════════════════════════════════════════
   INSPECTOR — el detalle de una sección, sin abandonar el tablero.

    '<p class="prosa"><b>' + motivo + '</b></p>' +
    '<p class="fine">' + detalle + '</p></div>';
}

function criterioFila(c, v, u, cl, est, fuente) {

}
function cronoFila(t, q, o) {
  return '<tr><td class="ap">' + t + '</td><td style="white-space:normal">' + q +
    '</td><td style="color:var(--mut)">' + o + '</td></tr>';
}
function verifFila(v, q) {
  return '<tr><td style="white-space:normal">' + v + '</td><td style="white-space:normal;color:var(--mut)">' +

}
function cargaDe(L, id) {
  if (!L.cargas) return "—";
  const c = L.cargas.find(x => x.id === id);
  return (!c || c.extremo) ? "—" : nf(c.ft, 0) + " kgf";
}

    '<tr><td>Río navegable</td><td>RETIE Libro 3, Tabla 3.10.2.a</td><td class="n">10,40 m</td></tr>' +
    '<tr><td>Campos deportivos</td><td>RETIE Libro 3, Tabla 3.10.2.a</td><td class="n">12,00 m</td></tr>' +
    '<tr><td>Ampacidad en régimen permanente</td><td>IEEE Std 738</td><td class="n">balance térmico</td></tr>' +
