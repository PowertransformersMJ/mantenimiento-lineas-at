INSPECTOR.mecanico = function (L) {
  if (!L.tramos) return sinDato("Cálculo mecánico", SIN_CONDUCTOR, NOTA_OCULTAR);
  const adm50 = 0.50 * L.cond.rts, adm25 = 0.25 * L.cond.rts;
  let h = '<div class="rotulo">Conductor y regulación</div><div class="kpis">' +
    '<div class="kpi"><div class="kpi-v" style="font-size:14px">' + esc(L.cond.codigo) + '</div>' +
      '<div class="kpi-l">Conductor</div><div class="kpi-s">' + nf(L.cond.seccion, 1) + ' mm² · Ø ' +
      nf(L.cond.diametro * 1000, 2) + ' mm · ' + nf(L.cond.masa, 3) + ' kg/m</div></div>' +
    '<div class="kpi"><div class="kpi-v">' + nf(L.cond.rts) + '<small> kgf</small></div>' +
      '<div class="kpi-l">Carga de rotura (RTS)</div><div class="kpi-s">Tope 50 % = ' + nf(adm50) +
      ' kgf · 25 % = ' + nf(adm25) + ' kgf</div></div>' +
    '<div class="kpi"><div class="kpi-v">' + L.tramos.length + '</div><div class="kpi-l">Tramos de tensión</div>' +
      '<div class="kpi-s">' + L.anclas + ' anclajes intermedios · reparto ' + L.tramos.map(t => t.nVanos).join("-") + '</div></div>' +
    '<div class="kpi"><div class="kpi-v ' + (L.fuera ? "rd" : "gr") + '">' + L.fuera + '<small>/' + L.vanosN + '</small></div>' +
      '<div class="kpi-l">Vanos fuera de banda</div></div>' +
    (L.termica ? '<div class="kpi"><div class="kpi-v">' + nf(L.termica.find(e => e.ref).I) + '<small> A</small></div>' +
      '<div class="kpi-l">Ampacidad de referencia</div><div class="kpi-s">IEEE 738 · día típico</div></div>' : '') +
    '</div>';

  h += '<div class="rotulo">Vano a vano<span class="nota">' + L.vanosN + ' vanos · relación a/VIR destacada</span></div>' +
    '<div class="tabla-caja" style="max-height:420px"><table class="tabla"><thead><tr>' +
    '<th>Vano</th><th class="n">Longitud</th><th class="n">Tramo</th><th class="n">VIR del tramo</th>' +
    '<th class="n">a / VIR</th><th>En banda</th><th class="n">Flecha T máx</th><th class="n">Long. catenaria</th>' +
    '<th>Observación</th></tr></thead><tbody>';
  let idx = 0;
  L.tramos.forEach(t => {
    t.vanos.forEach(v => {
      const a1 = L.apoyos[idx].id, a2 = L.apoyos[idx + 1].id;
      const rel = v / t.vir, fuera = rel < 0.7 || rel > 1.3;
      const fl = flechaCatenaria(L.cond.masa, v, t.tMax);
      const lc = v + sobrelongitud(L.cond.masa, v, t.eds);
      h += '<tr class="' + (fuera ? "fuera" : "") + '">' +
        '<td class="ap">' + a1 + ' → ' + a2 + '</td>' +
        '<td class="n">' + nf(v, 2) + '</td><td class="n">' + t.n + '</td>' +
        '<td class="n">' + nf(t.vir, 1) + '</td>' +
        '<td class="n ' + (fuera ? "mal" : "destaca") + '">' + nf(rel, 2) + '</td>' +
        '<td>' + (fuera ? '<span class="sello am">fuera</span>' : '<span class="sello gr">sí</span>') + '</td>' +
        '<td class="n">' + nf(fl, 2) + ' m</td><td class="n">' + nf(lc, 2) + ' m</td>' +
        '<td style="white-space:normal;color:var(--mut);font-size:10.4px">' +
          (fuera ? (rel > 1.3 ? "Más largo que la banda: el tramo debería subdividirse."
                              : "Más corto que la banda: la hipótesis del vano ideal pierde validez aquí.")
                 : "—") + '</td></tr>';
      idx++;
    });
  });
  h += '</tbody></table></div>';

  h += '<div class="rotulo">Umbrales y criterios<span class="nota">valor, umbral, estado y FUENTE</span></div>' +
    '<div class="tabla-caja"><table class="tabla"><thead><tr><th>Indicador</th><th class="n">Valor</th>' +
    '<th class="n">Umbral</th><th>Estado</th><th>Fuente del umbral</th></tr></thead><tbody>' +
    criterioFila("Tiro pico de la línea", nf(L.picoTramo.pico, 0) + " kgf",
      nf(adm50, 0) + " kgf (50 % RTS)", L.picoTramo.pico > adm50 ? "rd" : "gr",
      L.picoTramo.pico > adm50 ? "Excede" : "Cumple", "motor de cálculo — tope adoptado hoy") +
    criterioFila("Tiro pico de la línea", nf(L.picoTramo.pico, 0) + " kgf",
      nf(adm25, 0) + " kgf (25 % RTS)", L.picoTramo.pico > adm25 ? "rd" : "gr",
      L.picoTramo.pico > adm25 ? "Excede" : "Cumple", "doctrina interna — DECISIÓN ABIERTA") +
    criterioFila("Vanos en banda 0,7–1,3 del VIR", (L.vanosN - L.fuera) + " de " + L.vanosN,
      "todos", L.fuera ? "am" : "gr", L.fuera ? "Revisar" : "Cumple", "hipótesis del vano ideal de regulación") +
    criterioFila("Flecha máxima", nf(Math.max.apply(null, L.tramos.map(t => t.flechaMax)), 2) + " m",
      "según despeje", "gs", "No evaluable", "sin perfil del terreno no hay gálibo") +
    criterioFila("Apoyos con veredicto estructural", "0 de " + L.est, "los " + L.est,
      "rd", "No evaluable", "ningún apoyo declara capacidad") +
    '</tbody></table></div>' +
    '<span class="sello-calc"><b>Control catenaria vs parábola</b> en el vano más largo (' +
    nf(L.vanoMax, 2) + ' m): catenaria ' +
    nf(flechaCatenaria(L.cond.masa, L.vanoMax, L.ctx.Heds), 3) + ' m contra parábola ' +
    nf(L.cond.masa * L.vanoMax * L.vanoMax / (8 * L.ctx.Heds), 3) + ' m. ' +
    'A estos vanos la parábola es utilizable; la catenaria se reserva para auditar.</span>';
  return h;
};

INSPECTOR.termica = function (L) {
  if (!L.termica) return sinDato("Comportamiento térmico",
    L.cond ? "Falta la ficha real del conductor para resolver el balance térmico."
           : SIN_CONDUCTOR, NOTA_OCULTAR);
  const ref = L.termica.find(e => e.ref);
  const R20 = 0.1182;
  const beta = 0.00347;
  let h = '<div class="rotulo">Resistencia en corriente continua<span class="nota">Ω/km</span></div>' +
    '<div class="tabla-caja"><table class="tabla"><thead><tr><th class="n">Temperatura</th>' +
    '<th class="n">Resistencia</th><th>Qué es esa temperatura</th></tr></thead><tbody>';
  [[20, "Temperatura de catálogo. Es la única fila que se puede confrontar con la ficha del fabricante."],
   [50, "Conductor cargado en un día corriente."],
   [75, "Límite continuo del ACSR: por encima, el aluminio se recuece y no vuelve."],
   [90, "Límite continuo de las aleaciones (AAAC / ACAR). Para un ACSR ya es zona de daño permanente."]
  ].forEach(function (f) {
    const T = f[0], R = R20 * (1 + beta * (T - 20));
    const lim = T === L.cond.tmax;
    h += '<tr class="' + (lim ? "fuera" : "") + '"><td class="n ap">' + nf(T) + ' °C</td>' +
      '<td class="n destaca">' + nf(R, 4) + '</td>' +
      '<td style="white-space:normal;color:var(--mut);font-size:10.6px">' + f[1] +
      (lim ? ' <span class="sello am">límite del material</span>' : '') + '</td></tr>';
  });
  h += '</tbody></table></div>' +
    '<span class="sello-calc">Calculada ' + nf(R20, 4) + ' Ω/km a 20 °C contra ≈ 0,1198 de la tabla del ' +
    'fabricante: <b>1,3 % de desviación</b>. El factor 1,02 del cálculo es el sobrelargo por cableado ' +
    '(los hilos van helicoidales y recorren más que el cable).</span>';

  h += '<div class="rotulo">Avisos<span class="nota">ordenados de más grave a menos</span></div><ul class="deudas">' +
    '<li class="rd"><b>Un día sin viento le quita al conductor cerca del 27 % de su capacidad.</b> ' +
    'El viento pesa más que la temperatura ambiente: por eso la ampacidad de placa es engañosa.</li>' +
    '<li class="am"><b>Con El Niño el ambiente sube y la ampacidad baja justo cuando la demanda sube.</b> ' +
    'Ese es el momento en que una línea que siempre bastó deja de bastar.</li>' +
    '<li class="am"><b>La flecha se calculó a ' + nf(L.hip.tMax) + ' °C</b> y la ampacidad se evalúa a ' +
    nf(L.cond.tmax) + ' °C. Pedirle a la línea una corriente que la caliente más de lo que supuso el ' +
    'cálculo de flechas es una incoherencia cara: el gálibo deja de estar verificado.</li>' +
    '<li><b>Referencia adoptada:</b> «' + esc(ref.etiqueta) + '». Contra ella se mide todo el derrateo. ' +
    'Dos referencias serían dos tablas distintas superpuestas.</li></ul>';
  return h;
};

INSPECTOR.viento = function (L) {
  if (!L.tramos) return sinDato("Carga de viento", SIN_CONDUCTOR, NOTA_OCULTAR);
  const c = L.ctx;
  let h = '<div class="rotulo">Tiro y flecha con viento, tramo a tramo</div>' +
    '<div class="tabla-caja"><table class="tabla"><thead><tr><th>Tramo</th><th class="n">VIR</th>' +
    '<th class="n">Tiro EDS</th><th class="n">Tiro con viento</th><th class="n">Incremento</th>' +
    '<th class="n">Flecha con viento</th><th class="n">% RTS</th></tr></thead><tbody>';
  L.tramos.forEach(t => {
    const fl = flechaCatenaria(c.wTot, t.vanoMax, t.viento);
    h += '<tr><td class="ap">' + t.n + ' · ' + t.desde + '→' + t.hasta + '</td>' +
      '<td class="n">' + nf(t.vir, 1) + '</td><td class="n">' + nf(t.eds, 0) + '</td>' +
      '<td class="n destaca">' + nf(t.viento, 0) + '</td>' +
      '<td class="n">+' + pct((t.viento / t.eds - 1) * 100) + '</td>' +
      '<td class="n">' + nf(fl, 2) + ' m</td>' +
      '<td class="n">' + nf(t.viento / L.cond.rts * 100, 1) + '</td></tr>';
  });
  h += '</tbody></table></div>' +
    '<span class="sello-calc">Tiros en kgf por conductor. La flecha con viento se mide en el plano de la ' +
    'catenaria inclinada, no en la vertical: por eso no se compara directamente con el gálibo.</span>';
  h += '<div class="rotulo">Lo que este cálculo NO dice</div><ul class="deudas">' +
    '<li class="am"><b>No dimensiona ninguna cadena de aisladores.</b> El ángulo de balanceo de ' +
    nf(Math.atan(c.wV / L.cond.masa) * 180 / Math.PI, 1) + '° dice que la cadena se va de lado; ' +
    'cuánto se acerca al fuste depende de la geometría de la cruceta, que no está capturada.</li>' +
    '<li class="am"><b>No aplica factores de vano ni de ráfaga.</b> La norma reduce la presión efectiva en ' +
    'vanos largos porque la ráfaga no cubre el vano entero. Aquí se usa la presión plena: es conservador, ' +
    'pero conviene saberlo.</li>' +
    '<li><b>No evalúa el viento sobre la estructura,</b> solo sobre el conductor. La superficie expuesta ' +
    'del apoyo es otro dato que no está declarado.</li></ul>';
  return h;
};

INSPECTOR.cargas = function (L) {
  if (!L.cargas) return sinDato("Carga sobre las estructuras", SIN_CONDUCTOR, NOTA_OCULTAR);
  const con = L.cargas.filter(c => !c.extremo);
  const term = L.longit.filter(c => c.extremo);
  let h = '';

  /* ── EJE TRANSVERSAL ── */
  h += '<div class="rotulo">Eje transversal<span class="nota">quiebre + viento · NO se suma con el longitudinal</span></div>';
  h += '<div class="kpis">' +
    '<div class="kpi"><div class="kpi-v">×' + nf(L.peorFactor.factor, 3) + '</div>' +
      '<div class="kpi-l">Mayor amplificación del quiebre</div>' +
      '<div class="kpi-s">' + L.peorFactor.id + ' · ' + nf(L.peorFactor.deflexion, 1) + '° · ' +
      pct((L.peorFactor.factor - 1) * 100) + ' más carga</div></div>' +
    '<div class="kpi"><div class="kpi-v">' + L.amplifican + '</div>' +
      '<div class="kpi-l">Apoyos que reciben más que la tensión</div>' +
      '<div class="kpi-s">factor por encima de 1 — deflexión mayor de 60°</div></div>' +
    '<div class="kpi"><div class="kpi-v">' + nf(L.peorCarga.ft, 0) + '<small> kgf</small></div>' +
      '<div class="kpi-l">Mayor carga transversal</div><div class="kpi-s">' + L.peorCarga.id + '</div></div>' +
    '<div class="kpi"><div class="kpi-v gr">' + con.length + '<small>/' + L.est + '</small></div>' +
      '<div class="kpi-l">Con carga calculada</div><div class="kpi-s">los 2 extremos van al eje longitudinal</div></div>' +
    '<div class="kpi"><div class="kpi-v rd">0<small>/' + L.est + '</small></div>' +
      '<div class="kpi-l">Con capacidad declarada</div><div class="kpi-s">sin ella no hay veredicto posible</div></div>' +
    '</div>';

  h += '<div class="tabla-caja" style="max-height:400px;margin-top:11px"><table class="tabla"><thead><tr>' +
    '<th>Apoyo</th><th>Función</th><th class="n">Tramos</th><th class="n">Deflexión</th>' +
    '<th class="n">2·sen(α/2)</th><th class="n">Vano viento</th><th class="n">Tiro rector</th>' +
    '<th class="n">F quiebre</th><th class="n">F viento</th><th class="n">F total</th>' +
    '<th class="n">Capacidad</th><th>Veredicto</th></tr></thead><tbody>';
  L.cargas.forEach(c => {
    if (c.extremo) {
      h += '<tr><td class="ap">' + c.id + '</td><td>Terminal</td><td class="n">—</td>' +
        '<td class="n hueco">—</td><td class="n hueco">—</td><td class="n">' + nf(c.vanoViento, 2) + '</td>' +
        '<td class="n hueco">—</td><td class="n hueco">—</td><td class="n hueco">—</td>' +
        '<td class="n hueco">—</td><td class="n hueco">—</td>' +
        '<td><span class="sello gs">eje longitudinal</span></td></tr>';
      return;
    }
    h += '<tr class="' + (c.amplifica ? "fuera" : "") + '">' +
      '<td class="ap">' + c.id + '</td><td style="color:var(--mut)">' + c.funcion + '</td>' +
      '<td class="n">' + c.tramosN.join(", ") + '</td>' +
      '<td class="n">' + nf(c.deflexion, 1) + '</td>' +
      '<td class="n ' + (c.amplifica ? "mal" : "") + '">' + nf(c.factor, 3) + '</td>' +
      '<td class="n">' + nf(c.vanoViento, 2) + '</td>' +
      '<td class="n">' + nf(c.tiro, 0) + '</td>' +
      '<td class="n">' + nf(c.fq, 0) + '</td>' +
      '<td class="n">' + nf(c.fv, 0) + '</td>' +
      '<td class="n destaca">' + nf(c.ft, 0) + '</td>' +
      '<td class="n hueco">—</td>' +
      '<td><span class="sello gs">no evaluable</span></td></tr>';
  });
  h += '</tbody><tfoot><tr><td colspan="12">Cargas en kgf, con 3 conductores. El «tiro rector» es el ' +
    'estado de viento del tramo más cargado que llega al apoyo. La carga del quiebre es <b>permanente</b>: ' +
    'existe con viento y sin él.</td></tr></tfoot></table></div>';

  /* ── EJE LONGITUDINAL ── */
  h += '<div class="rotulo">Eje longitudinal<span class="nota">otro eje, otro ensayo, otra capacidad</span></div>';
  const desq = L.longit.filter(c => !c.extremo && c.concluyente);
  const peorL = desq.reduce((a, b) => (!a || b.total > a.total) ? b : a, null);
  const peorT = term[1].porCond > term[0].porCond ? term[1] : term[0];
  h += '<div class="kpis">' +
    '<div class="kpi"><div class="kpi-v">' + nf(peorT.porCond, 0) + '<small> kgf</small></div>' +
      '<div class="kpi-l">Mayor carga longitudinal</div>' +
      '<div class="kpi-s">' + peorT.id + ' · por conductor · ' + nf(peorT.total, 0) +
      ' kgf con las 3 fases. El otro terminal, ' + nf(Math.min(term[0].porCond, term[1].porCond), 0) + ' kgf.</div></div>' +
    '<div class="kpi"><div class="kpi-v">' + desq.length + '</div>' +
      '<div class="kpi-l">Anclajes que tiran hacia los dos lados</div>' +
      '<div class="kpi-s">' + (peorL ? "el mayor, " + peorL.id + " con " + nf(peorL.porCond, 0) + " kgf/cond" : "—") + '</div></div>' +
    '<div class="kpi"><div class="kpi-v gs">—</div><div class="kpi-l">Lo que pesa el tendido de obra</div>' +
      '<div class="kpi-s">el tiro de tendido no está declarado</div></div>' +
    '<div class="kpi"><div class="kpi-v">' + (L.est - 2 - desq.length) + '</div>' +
      '<div class="kpi-l">Sentido no concluyente</div>' +
      '<div class="kpi-s">suspensiones: el conductor corre sobre la grapa</div></div>' +
    '<div class="kpi"><div class="kpi-v rd">0<small>/' + L.est + '</small></div>' +
      '<div class="kpi-l">Con capacidad longitudinal</div>' +
      '<div class="kpi-s">y NO se deduce de la carga de rotura</div></div>' +
    '<div class="kpi"><div class="kpi-v rd">0<small>/' + L.est + '</small></div>' +
      '<div class="kpi-l">Con veredicto</div></div>' +
    '</div>';

  h += '<div class="tabla-caja" style="max-height:340px;margin-top:11px"><table class="tabla"><thead><tr>' +
    '<th>Apoyo</th><th>Función</th><th>Caso de carga</th><th class="n">Por conductor</th>' +
    '<th class="n">3 fases</th><th>Sentido</th><th class="n">Capacidad</th><th class="n">Utilización</th>' +
    '<th>Veredicto</th></tr></thead><tbody>';
  L.longit.forEach(c => {
    const rel = c.extremo || c.concluyente;
    h += '<tr class="' + (c.extremo ? "fuera" : "") + '">' +
      '<td class="ap">' + c.id + '</td><td style="color:var(--mut)">' + c.funcion + '</td>' +
      '<td style="white-space:normal;color:var(--mut);font-size:10.6px">' + c.caso + '</td>' +
      '<td class="n' + (c.extremo ? " destaca" : "") + '">' + (c.porCond === null ? "—" : nf(c.porCond, 0)) + '</td>' +
      '<td class="n">' + (c.total === null ? "—" : nf(c.total, 0)) + '</td>' +
      '<td>' + (c.sentido ? '<span class="sello az">' + esc(c.sentido) + '</span>'
                          : '<span class="sello gs">no concluyente</span>') + '</td>' +
      '<td class="n hueco">—</td><td class="n hueco">—</td>' +
      '<td><span class="sello gs">no evaluable</span></td></tr>';
  });
  h += '</tbody></table></div>';

  h += '<div class="rotulo">Notas del cálculo<span class="nota">agrupadas: la repetida no tapa a la que dice algo distinto</span></div>' +
    '<ul class="deudas">' +
    '<li class="rd"><b>' + L.est + ' apoyos · «no declara capacidad estructural».</b> Se repite en todas las ' +
    'filas de las dos tablas. Es UNA observación, no ' + (L.est * 2) + '.</li>' +
    '<li class="am"><b>' + L.amplifican + ' apoyos · «el quiebre amplifica por encima de 1».</b> ' +
    L.cargas.filter(c => c.amplifica).map(c => c.id + " ×" + nf(c.factor, 3)).join(" · ") + '.</li>' +
    '<li class="am"><b>2 apoyos · «extremo de línea: caso dominante longitudinal».</b> ' +
    term[0].id + ' y ' + term[1].id + ', con el tiro entero.</li>' +
    '<li><b>' + (L.est - 2 - desq.length) + ' apoyos · «sentido longitudinal no concluyente».</b> ' +
    'En una suspensión el conductor corre sobre la grapa y el desequilibrio se reparte.</li>' +
    '</ul>' +
    '<p class="fine"><b>Este módulo no dimensiona ningún apoyo.</b> Compara una carga contra una capacidad ' +
    '<b>declarada</b>. Si nadie la declaró, la fila queda no evaluable — no se estima, porque un apoyo que ' +
    '«cumple» contra una rotura supuesta es un informe firmado sobre una suposición.</p>';
  return h;
};

INSPECTOR.cantidades = function (L) {
  let h = '<div class="rotulo">Cantidades continuas<span class="nota">geométricas: salen del trazado, no de un catálogo</span></div>';
  if (!L.tramos) {
    h += '<div class="panel"><p class="prosa">Sin conductor no hay catenaria, así que la longitud real de ' +
      'cable no se puede dar. Lo que sí sale del trazado:</p>' +
      '<div class="tabla-caja"><table class="tabla"><thead><tr><th>Concepto</th><th class="n">Cantidad</th>' +
      '<th>De dónde sale</th></tr></thead><tbody>' +
      '<tr><td>Recorrido de la línea</td><td class="n destaca">' + nf(L.longitud, 2) + ' m</td>' +
      '<td style="color:var(--mut)">suma de los ' + L.vanosN + ' vanos entre estructuras</td></tr>' +
      '<tr><td>Longitud de conductor por catenaria</td><td class="n hueco">—</td>' +
      '<td style="color:var(--mut)">requiere masa lineal y tiro: falta el conductor</td></tr>' +
      '</tbody></table></div></div>';
    return h;
  }
  let extra = 0;
  L.tramos.forEach(t => t.vanos.forEach(v => { extra += sobrelongitud(L.cond.masa, v, t.eds); }));
  const porFase = L.longitud + extra;
  h += '<div class="tabla-caja"><table class="tabla"><thead><tr><th>Concepto</th><th class="n">Cantidad</th>' +
    '<th>De dónde sale</th></tr></thead><tbody>' +
    '<tr><td>Recorrido de la línea (cuerdas)</td><td class="n">' + nf(L.longitud, 2) + ' m</td>' +
    '<td style="color:var(--mut)">suma de los ' + L.vanosN + ' vanos entre estructuras</td></tr>' +
    '<tr><td>Sobrelongitud por catenaria</td><td class="n">' + nf(extra, 2) + ' m</td>' +
    '<td style="color:var(--mut)">vano a vano, con el tiro EDS de <b>su</b> tramo — no con un tiro único</td></tr>' +
    '<tr><td><b>Conductor por fase</b></td><td class="n destaca">' + nf(porFase, 2) + ' m</td>' +
    '<td style="color:var(--mut)">recorrido + sobrelongitud (' + pct(extra / L.longitud * 100, 2) + ' más)</td></tr>' +
    '<tr class="fuera"><td><b>Conductor, 3 fases</b></td><td class="n destaca">' + nf(porFase * 3, 2) + ' m</td>' +
    '<td style="color:var(--mut)">sin flojos, sin empalmes, sin desperdicio de tendido</td></tr>' +
    '</tbody></table></div>' +
    '<span class="sello-calc">Se calcula por catenaria vano a vano, <b>no por vanos rectos</b>: el cable ' +
    'cuelga y recorre más que la cuerda. Sobre ' + nf(L.longitud, 0) + ' m la diferencia es de solo ' +
    nf(extra, 2) + ' m, pero es la diferencia entre una cantidad medida y una estimada.</span>';

  h += '<div class="rotulo">Conteos por función de apoyo</div><div class="tabla-caja"><table class="tabla">' +
    '<thead><tr><th>Función estructural</th><th class="n">Cantidad</th><th>Nota</th></tr></thead><tbody>';
  const porFuncion = {};
  L.apoyos.forEach(a => { porFuncion[a.funcion] = (porFuncion[a.funcion] || 0) + 1; });
  Object.keys(porFuncion).forEach(f => {
    h += '<tr><td class="ap">' + f + '</td><td class="n destaca">' + porFuncion[f] + '</td>' +
      '<td style="color:var(--mut);white-space:normal;font-size:10.6px">' +
      (f === "Terminal" ? "Soportan el tiro entero. Su fallo abre la línea."
       : f === "Retención / anclaje" ? "Cortan el tramo de tensión. Deducidos por deflexión, no capturados en campo."
       : "El conductor corre sobre la grapa: no corta tramo.") + '</td></tr>';
  });
  if (L.emp) h += '<tr><td class="ap">Empalme</td><td class="n">' + L.emp + '</td>' +
    '<td style="color:var(--mut);white-space:normal;font-size:10.6px">Va <b>aparte</b>: no es apoyo, ' +
    'no sostiene el conductor y no entra en ningún conteo de estructuras.</td></tr>';
  h += '<tr style="border-top:1px solid var(--bd-solido)"><td><b>Total de estructuras</b></td>' +
    '<td class="n destaca">' + L.est + '</td><td></td></tr></tbody></table></div>';

  h += '<div class="rotulo urgente">Lo que todavía NO se puede cuantificar</div><ul class="deudas">' +
    '<li class="rd"><b>Crucetas.</b> Ni material, ni longitud, ni cantidad por apoyo.</li>' +
    '<li class="rd"><b>Retenidas.</b> Ni cantidad ni tipo — y en cinco anclajes son determinantes.</li>' +
    '<li class="rd"><b>Herrajes.</b> Grapas, amortiguadores, horquillas: nada capturado.</li>' +
    '<li class="rd"><b>Aisladores.</b> Modelo, material y número de unidades por cadena.</li></ul>' +
    '<p class="fine">Un listado de materiales inventado <b>es peor que no tener listado</b>: alguien compra ' +
    'con él. Por eso estas cuatro líneas no traen un número estimado.</p>';
  return h;
};

INSPECTOR.exportar = function (L) {
  const conCota = L.gps ? L.est : 0;
  let h = '<div class="rotulo">Levantamiento</div><div class="rejilla" style="gap:6px">' +
    botonExp("Trazado en GPX 1.1", "Para el GPS de campo. Waypoints por estructura y ruta por el trazado.") +
    botonExp("Trazado en KML", "Para Google Earth. Estilos por función de apoyo.") +
    botonExp("Puntos en CSV para Excel es-CO", "Separador punto y coma y <b>coma decimal</b>: se abre bien sin tocar nada.") +
    botonExp("Puntos en CSV crudo (RFC 4180)", "Punto decimal y comillas estándar. Para tratar el dato, no para leerlo.") +
    '</div>';
  h += '<div class="rotulo">Cálculo</div><div class="rejilla" style="gap:6px">' +
    botonExp("Verificación mecánica en CSV", L.tramos ? "5 secciones: tramos, vano a vano, umbrales, cargas y procedencia."
      : "<b>No disponible:</b> sin conductor no hay verificación mecánica que exportar.", !L.tramos) +
    botonExp("Memoria de cantidades en CSV", L.tramos ? "Cantidades continuas y conteos, con la columna «de dónde sale»."
      : "<b>No disponible:</b> requiere el cálculo mecánico.", !L.tramos) +
    botonExp("Informe completo en HTML imprimible", "11 secciones. Se abre sin internet y se imprime como documento.") +
    '</div>';
  h += '<div class="rotulo">Completitud del dato<span class="nota">lo que va y lo que no va dentro</span></div>' +
    '<div class="tabla-caja"><table class="tabla"><thead><tr><th>Campo</th><th class="n">Con dato</th>' +
    '<th>Consecuencia en el archivo</th></tr></thead><tbody>' +
    '<tr><td>Puntos con cota</td><td class="n">' + conCota + ' de ' + L.est + '</td>' +
    '<td style="color:var(--mut);white-space:normal">La cota va marcada como <b>no firmable</b> en todos los formatos.</td></tr>' +
    '<tr><td>Puntos con hora de captura</td><td class="n">' + (L.gps ? L.est : 0) + ' de ' + L.est + '</td>' +
    '<td style="color:var(--mut);white-space:normal">Sin hora, el GPX pierde la traza temporal.</td></tr>' +
    '<tr><td>Puntos sin nombre canónico</td><td class="n">0 de ' + L.est + '</td>' +
    '<td style="color:var(--mut);white-space:normal">Todos llevan el nombre de línea, no el que grabó el GPS.</td></tr>' +
    '<tr><td>Apoyos con capacidad declarada</td><td class="n mal">0 de ' + L.est + '</td>' +
    '<td style="color:var(--mut);white-space:normal">La columna sale vacía, no en cero.</td></tr>' +
    '</tbody></table></div>' +
    '<p class="fine"><b>Procedencia de cada archivo:</b> los del levantamiento salen del dato capturado en ' +
    'campo tal cual; los del cálculo salen del motor, sellados con su versión y con la hipótesis vigente. ' +
    'Un archivo calculado con otra versión que la pantalla es exactamente la contradicción que este ' +
    'proyecto no se permite.</p>' +
    '<p class="fine hueco">En la maqueta los botones no descargan nada.</p>';
  return h;
};
function botonExp(t, d, off) {
  return '<button class="accion am" ' + (off ? 'disabled style="opacity:.5;cursor:not-allowed"' : '') + '>' +
    '<span class="accion-ico">↓</span><span><span class="accion-t">' + t + '</span>' +
    '<p class="accion-c">' + d + '</p></span></button>';
}

/* ── El pie plegado: qué propone este diseño ────────────────────────────── */
function pieDiseno() {
  return '<div class="marca-maqueta">Maqueta de navegación. LN-627 lleva las cifras reales del proyecto ' +
    '(24 estructuras, 2 empalmes, 23 vanos, 2.929 m, 66 kV, 103 fotografías) y todo lo demás se calcula ' +
    'aquí con el mismo criterio del motor. <b>Las otras once líneas son sintéticas</b>: códigos inventados, ' +
    'geometría generada, cero coordenadas y cero fotografías.</div>' +
    '<div class="pie-diseno"><details><summary>Qué propone este diseño</summary><div class="cont">' +
    '<p>Este diseño apuesta por <b>una sola pantalla</b>. Al seleccionar la línea en la barra lateral, todo ' +
    'lo consolidado se condensa aquí, en un orden fijo: primero el veredicto y los cuatro semáforos, luego ' +
    'lo que exige acción hoy, después la línea entera dibujada, los hallazgos de ingeniería, los huecos ' +
    'declarados y, al fondo y más apagado, lo que ya está resuelto. Usted mira diez segundos y sabe de qué ' +
    'línea ocuparse y qué le falta, sin abrir una sola pestaña.</p>' +
    '<p class="gana"><b>Qué gana.</b> Deja de haber once pestañas que rellenar por línea: hay una portada ' +
    'por activo y un inspector lateral para bajar al detalle cuando hace falta — y el inspector <b>conserva ' +
    'la sección</b> al cambiar de línea, así que comparar las Cargas de dos líneas es un clic, no una ' +
    'reconstrucción. Los huecos (0 de 24 apoyos con veredicto, la precisión GPS, el módulo elástico en ' +
    'conflicto) tienen el mismo peso visual que los verdes, que es justo lo que la frase de gobierno exige. ' +
    'Y la cartera escala: la barra lateral solo necesita el resumen guardado de cada línea, no la línea ' +
    'entera, así que veinte activos no son veinte cálculos al abrir.</p>' +
    '<p class="pierde"><b>Qué pierde.</b> Es una pantalla densa: quien busque una sola cifra tiene que ' +
    'recorrerla, y a 1280 px se vuelve larga. El mapa deja de ser el protagonista del Resumen —aquí manda ' +
    'una cinta esquemática de la línea, más comparable entre activos pero menos geográfica—. Y obliga a una ' +
    'decisión de producto: cada línea necesita un <b>resumen guardado, fechado y sellado</b> con la versión ' +
    'del motor; si ese sello se desincroniza de la pantalla, el tablero miente, que es el único error que ' +
    'este proyecto no se puede permitir.</p>' +
    '<p><b>Frente a las otras opciones:</b> si prefiere navegar por secciones y comparar líneas dentro de ' +
    'cada una, este no es su diseño. Este apuesta a que la pregunta que usted hace primero no es «¿qué dice ' +
    'la pestaña Cargas?», sino «¿de cuál me tengo que ocupar y por qué?».</p>' +
    '</div></details></div>';
}

/* ══════════════════════════════════════════════════════════════════════════
   INSPECTOR — pintado y cableado
   ═══════════════════════════════════════════════════════════════════════ */
function pintarInspector() {
  if (!document.body.classList.contains("insp-on")) return;
  const L = ST.linea;
  const sel = document.getElementById("insp-sel");
  sel.innerHTML = SECCIONES.map(s =>
    '<option value="' + s[0] + '"' + (s[0] === ST.seccion ? " selected" : "") + '>' + s[1] + '</option>').join("");
  const nombre = (SECCIONES.find(s => s[0] === ST.seccion) || SECCIONES[0])[1];
  document.getElementById("insp-tit").textContent = L.cod + " · " + nombre;
  const fn = INSPECTOR[ST.seccion];
  document.getElementById("insp-cuerpo").innerHTML = fn
    ? fn(L)
    : '<div class="panel"><p class="prosa">Sección no desarrollada en esta maqueta.</p></div>';
  document.getElementById("insp-cuerpo").scrollTop = 0;
}

function abrirInspector(seccion) {
  if (seccion) ST.seccion = seccion;
  document.body.classList.add("insp-on");
  document.documentElement.style.setProperty("--insp-ancho", "520px");
  document.getElementById("btn-insp").classList.add("on");
  pintarInspector();
}
function cerrarInspector() {
  document.body.classList.remove("insp-on");
  document.documentElement.style.setProperty("--insp-ancho", "0px");
  document.getElementById("btn-insp").classList.remove("on");
}

/* ══════════════════════════════════════════════════════════════════════════
   CABLEADO
   ═══════════════════════════════════════════════════════════════════════ */
document.getElementById("lista").addEventListener("click", (e) => {
  const t = e.target.closest("[data-toggle]");
  if (t) { const z = t.dataset.toggle; ST.cerrados[z] = !ST.cerrados[z]; pintarSidebar(); return; }
  const f = e.target.closest("[data-cod]");
  if (!f) return;
  const L = CARTERA.find(x => x.cod === f.dataset.cod);
  if (!L || L === ST.linea) return;
  ST.linea = L;
  // El punto elegido en Fichas se reajusta; la SECCIÓN del inspector NO se toca.
  ST.punto = L.apoyos[Math.min(5, L.apoyos.length - 1)].id;
  pintarSidebar(); pintarTablero(); pintarInspector();
});

document.getElementById("main").addEventListener("click", (e) => {
  const b = e.target.closest("[data-ir]");
  if (!b) return;
  abrirInspector(b.dataset.ir);
});

document.getElementById("insp-cuerpo").addEventListener("click", (e) => {
  const p = e.target.closest("[data-punto]");
  if (!p) return;
  ST.punto = p.dataset.punto;
  pintarInspector();
});

document.getElementById("insp-sel").addEventListener("change", (e) => {
  ST.seccion = e.target.value; pintarInspector();
});
document.getElementById("insp-cerrar").addEventListener("click", cerrarInspector);
document.getElementById("btn-insp").addEventListener("click", () => {
  if (document.body.classList.contains("insp-on")) cerrarInspector(); else abrirInspector();
});
document.getElementById("btn-exp").addEventListener("click", () => abrirInspector("exportar"));

document.getElementById("btn-side").addEventListener("click", () => {
  const off = document.body.classList.toggle("side-off");
  document.documentElement.style.setProperty("--side-ancho", off ? "0px" : "264px");
});

document.getElementById("q").addEventListener("input", (e) => {
  ST.filtro = e.target.value; pintarSidebar();
});

document.getElementById("seg-orden").addEventListener("click", (e) => {
  const b = e.target.closest("[data-orden]");
  if (!b) return;
  ST.orden = b.dataset.orden;
  [].forEach.call(document.querySelectorAll("#seg-orden button"),
    x => x.classList.toggle("on", x === b));
  pintarSidebar();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") cerrarInspector();
});

/* Arranque */
pintarSidebar();
pintarTablero();
</script>
</body>
</html>
