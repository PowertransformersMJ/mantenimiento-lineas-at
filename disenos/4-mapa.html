/* ═══════════════════════════════════════════════════════════════════════
   CABLEADO Y CICLO DE PINTADO
   ═══════════════════════════════════════════════════════════════════ */
function cablearSeccion(){
  document.querySelectorAll('[data-ap]').forEach(el => {
    el.onclick = () => { S.sel = +el.dataset.ap; S.ficha = +el.dataset.ap; S.insp = 'punto'; render(); };
  });
  document.querySelectorAll('[data-ficha]').forEach(el => {
    el.onclick = () => { const v = el.dataset.ficha;
      S.ficha = v.startsWith('E') && v.length === 2 && !isNaN(+v[1]) ? v : +v;
      if (typeof S.ficha === 'number'){ S.sel = S.ficha; S.insp = 'punto'; }
      render(); };
  });
  document.querySelectorAll('[data-fund]').forEach(el => {
    el.onclick = () => { S.fundamento = el.dataset.fund; pintarSeccion(); };
  });
  document.querySelectorAll('[data-ir]').forEach(el => {
    el.onclick = () => { S.seccion = el.dataset.ir; render(); };
  });
  document.querySelectorAll('[data-par]').forEach(el => {
    el.onclick = () => { const [i,j] = el.dataset.par.split(',').map(Number);
      S.distA = i; S.distB = j; pintarSeccion(); };
  });
  const dA = $('dA'), dB = $('dB'), inv = $('invertir');
  if (dA) dA.onchange = () => { S.distA = +dA.value; pintarSeccion(); };
  if (dB) dB.onchange = () => { S.distB = +dB.value; pintarSeccion(); };
  if (inv) inv.onclick = () => { const t = S.distA; S.distA = S.distB; S.distB = t; pintarSeccion(); };
  document.querySelectorAll('[data-baja]').forEach(el => {
    el.onclick = () => { const ac = $('acuse');
      if (ac) ac.innerHTML = `<p class="ok" style="margin:0"><b>Acuse:</b> «${H(el.dataset.baja)}» se habría
        preparado con el sello <b>motor v1.4.2 · hipótesis sin congelar · 03-08-2026</b>.
        En esta maqueta no se descarga nada.</p>`;
      if (ac) ac.scrollIntoView({block:'nearest', behavior:'smooth'}); };
  });
}

function render(){
  pintarFiltro(); pintarLista(); pintarBarra(); pintarCabLinea();
  pintarCapas(); pintarMapa(); pintarBanda(); pintarSeccion(); pintarInspector(); pintarEstado();
}
function pintarEstado(){
  const l = lineaActual();
  const izq = esReal()
    ? `<b>${nf(N)}</b> estructuras · <b>${nf(VANOS.length)}</b> vanos · <b>${nf(LTOTAL,0)}</b> m ·
       <b>${nf(KV)}</b> kV · <b>${nf(TRAMOS.length)}</b> tramos · <b>103</b> fotografías`
    : `<b>${nf(l.est)}</b> estructuras · <b>${nf(l.km,1)}</b> km · <b>${nf(l.kv,l.kv%1?1:0)}</b> kV`;
  $('estado-barra').innerHTML =
    `<span>${izq}</span>
     <span>Capa: <b>${CAPAS.find(c=>c[0]===S.capa)[1]}</b></span>
     <span>Sección: <b>${SECCIONES.find(s=>s[0]===S.seccion)[1]}</b></span>
     <span>${S.sel===null?'Ningún apoyo señalado':'Señalado: <b>'+APOYOS[S.sel].nom+'</b>'}</span>
     <details class="propone"><summary>Qué propone este diseño ▴</summary>
       <div class="caja">
         <h5>Territorio primero — la geografía como índice</h5>
         <p>Al abrir una línea no te encuentras once pestañas: te encuentras <b>su trazado</b>, y encima le
           enciendes la capa que te interesa — tramos de tensión, quiebres que amplifican, vanos fuera de
           banda, inventario declarado, fotografías. Señalas E06 y el inspector de la derecha te cuenta ese
           apoyo entero. Las once secciones siguen ahí, en el cajón de abajo, y la que tengas abierta
           <b>sobrevive al cambio de línea</b>.</p>
         <p><b>Qué gana:</b> «¿dónde está el problema?» se contesta en un gesto, no leyendo 24 filas por 12
           columnas. Y el hueco se vuelve imposible de ignorar: enciende «Inventario declarado» y la línea
           entera se queda hueca, porque 0 de 24 apoyos declaran capacidad. Eso es exactamente lo que pasa.</p>
         <p><b>Qué pierde:</b> las tablas largas (Cargas, Distancias, Mecánico) viven en un cajón bajo el mapa
           y tienen menos alto que si ocuparan la pantalla entera — se puede arrastrar el tirador, pero nunca
           llegan a pantalla completa. Y una línea sin coordenadas fiables se queda sin su mejor índice: ahí
           esta maqueta se defiende peor que las otras tres.</p>
         <p><b>Cuándo elegirla:</b> si tu trabajo es decidir a qué apoyo mandas la cuadrilla, esta. Si es leer
           tablas de arriba abajo, otra te servirá mejor. — <em>Maqueta: trazado sintético, sin una sola
           coordenada real ni fotografía. Los conteos y las cifras de ingeniería son los del proyecto.</em></p>
       </div></details>`;
}

/* ── Eventos globales ──────────────────────────────────────────────── */
$('plegar').onclick = () => { document.body.classList.toggle('plegado');
  setTimeout(()=>{ pintarMapa(); }, 200); };
$('buscar').oninput = (e) => { S.busca = e.target.value; pintarLista(); };
$('filtro').onclick = (e) => { const b = e.target.closest('[data-f]');
  if (b){ S.filtro = b.dataset.f; pintarFiltro(); pintarLista(); } };
$('lista').onclick = (e) => { const f = e.target.closest('[data-linea]');
  if (f && f.dataset.linea !== S.linea){ S.linea = f.dataset.linea; S.sel = null;
    S.insp = 'linea'; S.ficha = 0; render(); } };
$('lista').onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' '){
  const f = e.target.closest('[data-linea]'); if (f){ e.preventDefault(); f.click(); } } };
$('capas').onchange = (e) => {
  if (e.target.name === 'capa'){ S.capa = e.target.value; pintarCapas(); pintarMapa(); pintarEstado(); }
  if (e.target.dataset.ov){ S.overlay[e.target.dataset.ov] = e.target.checked; pintarCapas(); pintarMapa(); }
};
$('banda').onclick = (e) => {
  const b = e.target.closest('[data-sec]');
  if (b){ S.seccion = b.dataset.sec; pintarBanda(); pintarSeccion(); pintarEstado();
    $('panel-sec').scrollTop = 0; return; }
  if (e.target.closest('#mas-alto')){
    const c = $('cajon'), h = c.getBoundingClientRect().height;
    c.style.height = (h > 560 ? 300 : h + 170) + 'px';
    setTimeout(pintarMapa, 30);
  }
};
/* Tirador: el cajón se puede dar más o menos alto, como un panel de Xcode. */
(() => {
  let arrastrando = false, y0 = 0, h0 = 0;
  const t = $('tirador'), c = $('cajon');
  t.onmousedown = (e) => { arrastrando = true; y0 = e.clientY;
    h0 = c.getBoundingClientRect().height; document.body.style.cursor = 'ns-resize';
    e.preventDefault(); };
  addEventListener('mousemove', (e) => { if (!arrastrando) return;
    const h = Math.min(innerHeight - 220, Math.max(120, h0 + (y0 - e.clientY)));
    c.style.height = h + 'px'; });
  addEventListener('mouseup', () => { if (!arrastrando) return;
    arrastrando = false; document.body.style.cursor = ''; pintarMapa(); });
})();
$('insp-tabs').onclick = (e) => { const b = e.target.closest('[data-insp]');
  if (b){ S.insp = b.dataset.insp; pintarInspector(); } };
addEventListener('resize', () => { clearTimeout(window.__t);
  window.__t = setTimeout(pintarMapa, 120); });
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const i = SECCIONES.findIndex(s => s[0] === S.seccion);
  if (e.key === 'ArrowRight' && e.metaKey){ S.seccion = SECCIONES[(i+1)%SECCIONES.length][0]; render(); }
  if (e.key === 'ArrowLeft' && e.metaKey){ S.seccion = SECCIONES[(i-1+SECCIONES.length)%SECCIONES.length][0]; render(); }
  if (e.key === 'Escape'){ S.sel = null; S.insp = 'linea'; render(); }
});

/* La línea vive en la URL. Sin esto, «la primera de la lista» deja de ser una
   respuesta con 20 líneas — y no se puede mandar un enlace a una línea concreta.
   Formato: #LN-627/cargas/quiebre/E06 */
function leerURL(){
  if (typeof location === 'undefined') return;
  const h = (location.hash || '').replace(/^#/, '');
  if (!h) return;
  const [cod, sec, capa, ap] = h.split('/');
  if (CARTERA.some(l => l.cod === cod)) S.linea = cod;
  if (SECCIONES.some(s => s[0] === sec)) S.seccion = sec;
  if (CAPAS.some(c => c[0] === capa)) S.capa = capa;
  const i = APOYOS.findIndex(a => a.nom === ap);
  if (i >= 0){ S.sel = i; S.ficha = i; S.insp = 'punto'; }
}
function escribirURL(){
  if (typeof location === 'undefined') return;
  const h = `#${S.linea}/${S.seccion}/${S.capa}${S.sel!==null?'/'+APOYOS[S.sel].nom:''}`;
  try { if (location.hash !== h) history.replaceState(null, '', h); } catch (_) {}
}
addEventListener('hashchange', () => { leerURL(); render(); });
const _render = render;
render = function(){ _render(); escribirURL(); };

/* El cajón arranca proporcional a la pantalla: en un 16" deja el mapa alto y
   en una pantalla baja no lo ahoga. A partir de ahí manda el tirador. */
$('cajon').style.height = Math.round(Math.max(260, Math.min(420, innerHeight * 0.38))) + 'px';

leerURL();
render();
requestAnimationFrame(pintarMapa);

</script>
